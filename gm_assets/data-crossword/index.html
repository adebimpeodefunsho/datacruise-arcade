  <style>
/* ============================================================
   DataCruise Word Games — Crack the Data Crossword
   Terminal / hacker aesthetic — matches "Derive the Data Jargon".
   ============================================================ */

:root {
  --bg-0: #06080c;
  --bg-1: #0a0e14;
  --bg-2: #11161f;
  --bg-3: #1a212e;
  --border: #1f2937;
  --border-hi: #2a3445;

  --neon-green: #00ff9c;
  --neon-cyan:  #00f0ff;
  --neon-magenta: #ff2e92;
  --neon-yellow: #ffd700;

  --text:   #c9d1d9;
  --text-dim: #8b949e;
  --text-faint: #4a5260;

  --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'Consolas', monospace;

  --shadow-glow-green: 0 0 12px rgba(0, 255, 156, 0.45), 0 0 30px rgba(0, 255, 156, 0.15);
  --shadow-glow-cyan:  0 0 12px rgba(0, 240, 255, 0.45), 0 0 30px rgba(0, 240, 255, 0.15);
  --shadow-glow-mag:   0 0 12px rgba(255, 46, 146, 0.45), 0 0 30px rgba(255, 46, 146, 0.15);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(ellipse at top, rgba(0, 240, 255, 0.06), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(255, 46, 146, 0.05), transparent 60%),
    var(--bg-0);
  min-height: 100vh; min-height: 100dvh;
}

.scanlines {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.12) 3px, rgba(0,0,0,0) 4px
  );
  mix-blend-mode: multiply; opacity: 0.5;
}

#app {
  position: relative; z-index: 1;
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}

/* ---- Terminal frame ---- */
.term {
  width: 100%; max-width: 920px;
  background: var(--bg-1);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  box-shadow: 0 0 0 1px rgba(0,240,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
  overflow: hidden;
}
.term-bar {
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; color: var(--text-dim);
}
.term-bar .dots { display: flex; gap: 6px; }
.term-bar .dot { width: 11px; height: 11px; border-radius: 50%; background: #2a3445; }
.term-bar .dot.r { background: #ff5f56; }
.term-bar .dot.y { background: #ffbd2e; }
.term-bar .dot.g { background: #27c93f; }
.term-bar .path { flex: 1; font-family: var(--mono); letter-spacing: 0.02em; }
.term-bar .path .prompt { color: var(--neon-green); }
.term-bar .path .sep    { color: var(--text-faint); }
.term-bar .path .cmd    { color: var(--neon-cyan); }
.mute-btn {
  background: transparent;
  border: 1px solid var(--border-hi);
  color: var(--text-dim);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 13px; cursor: pointer; line-height: 1;
  margin-left: auto;
  transition: all 0.15s ease;
}
.mute-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }

.term-body { padding: 26px 22px 28px; }

/* ---- brand line ---- */
.brand {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
}
.brand-title {
  font-size: 12px; letter-spacing: 0.18em;
  color: var(--neon-cyan); text-transform: uppercase;
}
.brand-title .pipe { color: var(--text-faint); margin: 0 8px; }
.brand-meta {
  font-size: 11px; color: var(--text-faint);
  letter-spacing: 0.08em; text-transform: uppercase;
}

/* ---- Splash ---- */
.splash { text-align: center; padding: 14px 4px 4px; }
.splash h1 {
  font-family: var(--mono); font-weight: 700;
  font-size: clamp(28px, 5vw, 40px);
  margin: 14px 0 8px;
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
  letter-spacing: 0.02em;
}
.splash h1 .punc { color: var(--neon-magenta); }
.splash h1 .cursor { display: inline-block; animation: blink 1s steps(1) infinite; color: var(--neon-cyan); margin-left: 4px; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.splash .tagline {
  color: var(--text-dim);
  font-size: 14px; margin: 0 auto 24px;
  max-width: 520px; line-height: 1.55;
}
.splash .tagline .hl { color: var(--neon-cyan); }
.splash .mascot {
  margin: 18px auto 8px;
  width: 160px; height: 160px;
  filter: drop-shadow(0 0 18px rgba(255, 196, 60, 0.4));
}

.how-to {
  text-align: left;
  background: var(--bg-2);
  border: 1px dashed var(--border-hi);
  border-radius: 6px;
  padding: 14px 18px;
  margin: 18px auto;
  max-width: 520px;
  font-size: 13px; color: var(--text-dim);
}
.how-to .head {
  color: var(--neon-cyan);
  font-weight: 700; letter-spacing: 0.06em;
  margin-bottom: 8px;
  font-size: 11px; text-transform: uppercase;
}
.how-to ul { margin: 0; padding: 0; list-style: none; }
.how-to li { padding: 3px 0; display: flex; gap: 10px; align-items: center; }
.how-to li::before { content: ">"; color: var(--neon-green); font-weight: 700; }
.how-to .hl { color: var(--neon-cyan); }
.how-to .key {
  display: inline-block;
  padding: 1px 8px;
  border: 1px solid var(--border-hi);
  border-radius: 3px;
  color: var(--neon-yellow);
  background: var(--bg-1);
  font-size: 11px;
}

/* ---- Buttons ---- */
.btn {
  font-family: var(--mono);
  font-size: 14px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 12px 26px;
  background: transparent;
  border: 1px solid var(--neon-green); color: var(--neon-green);
  border-radius: 4px; cursor: pointer;
  transition: all 0.15s ease;
  text-shadow: 0 0 8px rgba(0, 255, 156, 0.4);
}
.btn:hover, .btn:focus-visible {
  background: rgba(0, 255, 156, 0.1);
  box-shadow: var(--shadow-glow-green);
  outline: none; transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn.cyan { border-color: var(--neon-cyan); color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0,240,255,0.4); }
.btn.cyan:hover, .btn.cyan:focus-visible { background: rgba(0,240,255,0.1); box-shadow: var(--shadow-glow-cyan); }
.btn.mag { border-color: var(--neon-magenta); color: var(--neon-magenta); text-shadow: 0 0 8px rgba(255,46,146,0.4); }
.btn.mag:hover, .btn.mag:focus-visible { background: rgba(255,46,146,0.1); box-shadow: var(--shadow-glow-mag); }
.btn.ghost { border-color: var(--border-hi); color: var(--text-dim); text-shadow: none; }
.btn.ghost:hover { border-color: var(--text-dim); color: var(--text); background: rgba(255,255,255,0.03); box-shadow: none; }
.btn.tiny { padding: 6px 14px; font-size: 11px; letter-spacing: 0.08em; }

.start-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 18px 0 6px; }

/* ---- HUD ---- */
.hud {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px; margin-bottom: 12px;
}
.hud-cell {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
  display: flex; flex-direction: column; align-items: flex-start;
  font-size: 11px;
}
.hud-cell .lbl {
  color: var(--text-faint);
  text-transform: uppercase; letter-spacing: 0.1em;
  font-size: 10px;
}
.hud-cell .val {
  color: var(--neon-cyan);
  font-size: 18px; font-weight: 700;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.35);
}
.hud-cell .val.small { font-size: 11px; letter-spacing: 0.04em; text-shadow: none; color: var(--text-dim); }
.hud-cell.score .val { color: var(--neon-green); text-shadow: 0 0 6px rgba(0,255,156,0.35); }
.hud-cell.found .val { color: var(--neon-yellow); text-shadow: 0 0 6px rgba(255,215,0,0.35); }
.hud-cell.timer .val { color: var(--neon-magenta); text-shadow: 0 0 6px rgba(255,46,146,0.35); }

.timer-row { margin: 0 0 18px; }
.timer-bar {
  height: 6px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 3px; overflow: hidden;
}
.timer-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
  transition: width 0.1s linear, background 0.3s ease;
  box-shadow: 0 0 8px rgba(0,240,255,0.5);
}
.timer-bar-fill.warn {
  background: linear-gradient(90deg, var(--neon-yellow), var(--neon-magenta));
  animation: pulse 0.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

/* ============================================================
   Board layout — grid + clues side-by-side
   ============================================================ */
.board {
  display: grid;
  grid-template-columns: minmax(0, auto) 1fr;
  gap: 22px;
  align-items: start;
}
.grid-wrap { display: flex; justify-content: center; }

.grid {
  display: grid;
  grid-template-columns: repeat(10, 38px);
  grid-auto-rows: 38px;
  gap: 2px;
  padding: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border-hi);
  border-radius: 6px;
  box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.05);
}
.cell {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  cursor: pointer;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--neon-cyan);
  font-size: 19px;
  user-select: none;
  transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
}
.cell.block {
  background: transparent;
  border-color: transparent;
  cursor: default;
}
.cell:hover:not(.block) {
  border-color: var(--neon-cyan);
}
.cell .num {
  position: absolute;
  top: 1px; left: 3px;
  font-size: 9px;
  color: var(--text-faint);
  font-weight: 600;
  letter-spacing: 0;
  pointer-events: none;
}
.cell .letter { line-height: 1; }
.cell.active-word {
  background: rgba(0, 240, 255, 0.08);
  border-color: rgba(0, 240, 255, 0.5);
}
.cell.cursor {
  background: rgba(0, 240, 255, 0.18);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 10px rgba(0,240,255,0.45), inset 0 0 6px rgba(0,240,255,0.25);
  animation: cursor-pulse 1s ease-in-out infinite;
}
@keyframes cursor-pulse {
  0%, 100% { box-shadow: 0 0 10px rgba(0,240,255,0.45), inset 0 0 6px rgba(0,240,255,0.25); }
  50%      { box-shadow: 0 0 14px rgba(0,240,255,0.65), inset 0 0 8px rgba(0,240,255,0.35); }
}
.cell.found {
  background: rgba(0, 255, 156, 0.12);
  border-color: var(--neon-green);
  color: var(--neon-green);
  text-shadow: 0 0 8px rgba(0,255,156,0.5);
}
.cell.found.cursor {
  box-shadow: 0 0 10px rgba(0,255,156,0.45);
}

/* ---- Clue lists ---- */
.clues {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  min-width: 0;
}
.clue-col {
  background: var(--bg-2);
  border: 1px solid var(--border-hi);
  border-radius: 6px;
  padding: 10px 12px 12px;
  min-width: 0;
}
.clue-head {
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--neon-cyan);
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px dashed var(--border-hi);
}
.clue-col ul { list-style: none; margin: 0; padding: 0; }
.clue-item {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 6px;
  align-items: start;
  padding: 6px 6px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.35;
  transition: background 0.1s ease, color 0.1s ease;
}
.clue-item:hover { background: rgba(0, 240, 255, 0.05); }
.clue-item.active {
  background: rgba(0, 240, 255, 0.12);
  color: var(--text);
  box-shadow: inset 2px 0 0 var(--neon-cyan);
}
.clue-item.found {
  opacity: 0.55;
  text-decoration: line-through;
  color: var(--neon-green);
}
.clue-item.found .cnum,
.clue-item.found .clen { color: var(--neon-green); }
.clue-item .cnum {
  color: var(--neon-yellow);
  font-weight: 700;
  letter-spacing: 0.02em;
}
.clue-item .clen {
  color: var(--text-faint);
  font-size: 11px;
  white-space: nowrap;
}

.actions-row {
  margin-top: 18px;
  display: flex; justify-content: space-between;
  gap: 10px; flex-wrap: wrap;
}

/* ============================================================
   Game over
   ============================================================ */
.over { text-align: center; padding: 8px 4px; }
.over h2 {
  font-size: 30px;
  color: var(--neon-magenta);
  text-shadow: var(--shadow-glow-mag);
  letter-spacing: 0.04em;
  margin: 6px 0 4px;
}
.over h2.correct { color: var(--neon-green); text-shadow: var(--shadow-glow-green); }
.over h2.wrong   { color: var(--neon-magenta); text-shadow: var(--shadow-glow-mag); }
.over .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }
.over .final-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px auto 22px;
  max-width: 480px;
}
.over .stat {
  background: var(--bg-2);
  border: 1px solid var(--border-hi);
  border-radius: 6px;
  padding: 14px 8px;
}
.over .stat .num {
  font-size: 28px; font-weight: 700;
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
}
.over .stat.cyan .num   { color: var(--neon-cyan);   text-shadow: var(--shadow-glow-cyan); }
.over .stat.yellow .num { color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255,215,0,0.45); }
.over .stat .lbl {
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: 4px;
}

.answer-list {
  text-align: left;
  background: var(--bg-2);
  border: 1px dashed var(--border-hi);
  border-radius: 6px;
  padding: 12px 16px;
  margin: 0 auto 16px;
  max-width: 560px;
}
.answer-list.found { border-color: rgba(0, 255, 156, 0.4); }
.answer-list .al-head {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--neon-cyan);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.answer-list.found .al-head { color: var(--neon-green); }
.answer-list ul { list-style: none; margin: 0; padding: 0; }
.answer-list li { padding: 4px 0; font-size: 13px; }
.answer-list .al-num { color: var(--neon-yellow); font-weight: 700; margin-right: 4px; }
.answer-list .al-word { color: var(--neon-green); font-weight: 700; letter-spacing: 0.04em; }
.answer-list .al-clue { color: var(--text-dim); }

/* ============================================================
   Small / mobile
   ============================================================ */
@media (max-width: 760px) {
  .board { grid-template-columns: 1fr; gap: 16px; }
  .grid { grid-template-columns: repeat(10, 30px); grid-auto-rows: 30px; }
  .cell { font-size: 15px; }
  .cell .num { font-size: 8px; }
  .clues { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  body { font-size: 14px; }
  .term-body { padding: 18px 12px 22px; }
  .hud { grid-template-columns: repeat(3, 1fr); }
  .hud-cell:nth-child(4) { display: none; }
  .grid { grid-template-columns: repeat(10, 28px); grid-auto-rows: 28px; gap: 2px; padding: 6px; }
  .cell { font-size: 14px; }
  .splash h1 { font-size: 26px; }
  .splash .mascot { width: 130px; height: 130px; }
  .over .final-stats { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  .scanlines { display: none; }
}

/* Mobile fit — grid stays visible, clue list scrolls inside a capped box */
@media (max-width: 820px) {
  html, body { overflow-x: hidden; }
  #app { padding: 6px; align-items: flex-start; }
  .term-body { padding: 10px 12px 12px; }
  .brand { margin-bottom: 4px; }
  .hud { margin-bottom: 6px; }
  .clues { max-height: 198px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
}

  </style>
</head>

  <div id="app" aria-live="polite"></div>
  <script>
/* ==== puzzle.js ==== */
// Crack the Data Crossword — puzzle library.
// Hand-crafted 10x10 crosswords using only data-jargon terms.
//
// CROSSWORD RULE: every contiguous run of >=2 filled cells in any row or any
// column MUST be exactly one defined across- or down-word. Otherwise the player
// sees a "phantom word" like BINL (BIN + ETL's leading L stacked vertically),
// which reads as a nonsense word.
//
// The validator at the bottom of this file enforces this on every puzzle at
// module load — any violation throws and shows you which run is the problem.

const GRID_SIZE = 10;

const PUZZLES = [

  // --------------------------------------------------------------------------
  {
    id: 'tables-trees',
    name: 'Tables & Trees',
    theme: 'Spreadsheets, lookups, and the shape of stored data.',

      { num: 5, row: 6, col: 4, dir: 'A', answer: 'ROW',   clue: 'One horizontal record in a table.' },
      { num: 6, row: 6, col: 6, dir: 'D', answer: 'WIDE',  clue: 'A table layout with lots of columns.' },
    ],
  },

  // --------------------------------------------------------------------------
  {

    name: 'Chart Builder',
    theme: 'The visual vocabulary of charts and graphs.',
    words: [
      { num: 1, row: 0, col: 1, dir: 'A', answer: 'COUNT', clue: 'Tally up how many — a basic data summary.' },
      { num: 1, row: 0, col: 1, dir: 'D', answer: 'CHART', clue: 'A picture that shows numbers visually.' },
      { num: 2, row: 2, col: 1, dir: 'A', answer: 'AREA',  clue: 'A chart that fills the space under a line.' },

    ],

  // --------------------------------------------------------------------------
  {

// Validate every puzzle at module-load time. Any letter conflict OR phantom-word
// will throw here, so you see the problem the moment the module loads.
for (const p of PUZZLES) {
  validatePuzzle(p);
}

let lastPlayedId = null;

function pickPuzzle() {
  const pool = PUZZLES.filter((p) => p.id !== lastPlayedId);
  const choice = pool[Math.floor(Math.random() * pool.length)];
  lastPlayedId = choice.id;
  return choice;
}

function buildGrid(puzzle) {
  return stampGrid(puzzle);
}

function stampGrid(puzzle) {
  const cells = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    const row = [];
    for (let c = 0; c < GRID_SIZE; c++) {
      row.push({ row: r, col: c, letter: null, filled: false, input: '', num: null, found: false });
    }
    cells.push(row);
  }
  for (const w of puzzle.words) {
    const letters = w.answer.split('');
    for (let i = 0; i < letters.length; i++) {
      const r = w.dir === 'D' ? w.row + i : w.row;
      const c = w.dir === 'A' ? w.col + i : w.col;
      if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) {
        throw new Error(`Puzzle '${puzzle.id}' word ${w.num}${w.dir} (${w.answer}) goes off-grid at (${r},${c}).`);
      }
      const cell = cells[r][c];
      if (cell.letter && cell.letter !== letters[i]) {
        throw new Error(`Puzzle '${puzzle.id}' conflict at (${r},${c}): ${cell.letter} vs ${letters[i]} from ${w.num}${w.dir} (${w.answer}).`);
      }
      cell.letter = letters[i];
      cell.filled = true;
    }
  }
  for (const w of puzzle.words) {
    const cell = cells[w.row][w.col];
    if (cell.num == null) cell.num = w.num;
  }
  return cells;
}

// Enforce: every contiguous filled run (length >=2) in any row or column must
// match exactly one across/down word. Single isolated cells are fine.
function validatePuzzle(puzzle) {
  const cells = stampGrid(puzzle);

  // Across runs.
  for (let r = 0; r < GRID_SIZE; r++) {
    let c = 0;
    while (c < GRID_SIZE) {
      if (!cells[r][c].filled) { c++; continue; }
      const start = c;
      while (c < GRID_SIZE && cells[r][c].filled) c++;
      const len = c - start;
      if (len >= 2) {
        const match = puzzle.words.find(
          (w) => w.dir === 'A' && w.row === r && w.col === start && w.answer.length === len
        );
        if (!match) {
          throw new Error(
            `Puzzle '${puzzle.id}' has a phantom across-run at row ${r}, cols ${start}-${start + len - 1} ` +
            `(length ${len}) — no across word matches. Add a word here, or separate the cells.`
          );
        }
      }
    }
  }

  // Down runs.
  for (let c = 0; c < GRID_SIZE; c++) {
    let r = 0;
    while (r < GRID_SIZE) {
      if (!cells[r][c].filled) { r++; continue; }
      const start = r;
      while (r < GRID_SIZE && cells[r][c].filled) r++;
      const len = r - start;
      if (len >= 2) {
        const match = puzzle.words.find(
          (w) => w.dir === 'D' && w.col === c && w.row === start && w.answer.length === len
        );
        if (!match) {
          throw new Error(
            `Puzzle '${puzzle.id}' has a phantom down-run at col ${c}, rows ${start}-${start + len - 1} ` +
            `(length ${len}) — no down word matches. Add a word here, or separate the cells.`
          );
        }
      }
    }
  }
}

function clueGroups(puzzle) {
  const across = puzzle.words.filter((w) => w.dir === 'A').sort((a, b) => a.num - b.num);
  const down   = puzzle.words.filter((w) => w.dir === 'D').sort((a, b) => a.num - b.num);
  return { across, down };
}

function wordCells(word) {
  const out = [];
  for (let i = 0; i < word.answer.length; i++) {
    const r = word.dir === 'D' ? word.row + i : word.row;
    const c = word.dir === 'A' ? word.col + i : word.col;
    out.push({ row: r, col: c });
  }
  return out;
}

function isWordSolved(word, cells) {
  return wordCells(word).every(({ row, col }, i) => cells[row][col].input === word.answer[i]);
}

// Crack the Data Crossword — synthesized SFX (Web Audio, no assets).
// Same chiptune feel as the other Word Games. Mute persists in localStorage.

let ctx = null;
let muted = readMuted();

function readMuted() {
  try { return localStorage.getItem('datacruise.crossword.muted') === '1'; }
  catch { return false; }
}

function writeMuted() {
  try { localStorage.setItem('datacruise.crossword.muted', muted ? '1' : '0'); }
  catch { /* ignore */ }
}

function getCtx() {
  if (muted) return null;
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function tone({ freq, dur = 0.10, type = 'square', vol = 0.14, slide = 0, attack = 0.004, when = 0 }) {
  const c = getCtx();
  if (!c) return;
  const t0 = c.currentTime + when;
  const t1 = t0 + dur;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) {
    const endFreq = Math.max(20, freq + slide);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t1);
  }
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, t1);
  osc.connect(gain).connect(c.destination);
  osc.start(t0);
  osc.stop(t1 + 0.02);
}

function keyFreq() {
  return 1400 + Math.floor(Math.random() * 400);
}

const sfx = {
  key() {
    tone({ freq: keyFreq(), dur: 0.018, type: 'square', vol: 0.05 });
  },
  wordFound() {
    [659, 880, 1175, 1568].forEach((f, i) => {
      tone({ freq: f, dur: 0.13, type: 'triangle', vol: 0.16, when: i * 0.05 });
    });
  },
  wrong() {
    tone({ freq: 280, dur: 0.18, type: 'sawtooth', vol: 0.12, slide: -120 });
  },
  clueSelect() {
    tone({ freq: 720, dur: 0.05, type: 'square', vol: 0.09 });
  },
  timeout() {
    [440, 370, 294, 220].forEach((f, i) => {
      tone({ freq: f, dur: 0.18, type: 'sawtooth', vol: 0.13, when: i * 0.10 });
    });
  },
  gameover() {
    [523, 466, 392, 294].forEach((f, i) => {
      tone({ freq: f, dur: 0.22, type: 'triangle', vol: 0.15, when: i * 0.13 });
    });
  },
  win() {
    [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => {
      tone({ freq: f, dur: 0.18, type: 'triangle', vol: 0.18, when: i * 0.09 });
    });
  }
};

function isMuted() { return muted; }

function toggleMuted() {
  muted = !muted;
  writeMuted();
  if (muted && ctx) {
    try { ctx.suspend(); } catch {}
  } else if (!muted && ctx) {
    try { ctx.resume(); } catch {}
  }
  return muted;
}

// Crack the Data Crossword — game state + transitions.
// Pure-ish functions that mutate a single state object.


const CONFIG = {
  totalSeconds: 180,   // 3 minutes to find them all
  tickMs: 100,
  pointsPerLetter: 10,
  timeBonusPerSec: 2,
};

function createState() {
  return {
    screen: 'splash',       // 'splash' | 'play' | 'gameover'
    puzzle: null,           // the active puzzle from the library
    cells: null,            // 2D array from buildGrid()
    foundKeys: new Set(),   // e.g. "1A", "3D"
    activeKey: null,        // currently selected word key
    activeIdx: 0,           // letter index within the active word the cursor sits on
    timeLeftMs: 0,
    score: 0,
    result: null,           // 'win' | 'timeout' | null
  };
}

function startGame(s) {
  s.puzzle = pickPuzzle();
  s.cells = buildGrid(s.puzzle);
  s.foundKeys = new Set();
  const first = s.puzzle.words[0];
  s.activeKey = `${first.num}${first.dir}`;
  s.activeIdx = 0;
  s.timeLeftMs = CONFIG.totalSeconds * 1000;
  s.score = 0;
  s.result = null;
  s.screen = 'play';
}

function getActiveWord(s) {
  if (!s.activeKey || !s.puzzle) return null;
  return s.puzzle.words.find((w) => `${w.num}${w.dir}` === s.activeKey) || null;
}

function selectWord(s, key) {
  const w = s.puzzle.words.find((x) => `${x.num}${x.dir}` === key);
  if (!w) return;
  s.activeKey = key;
  const cellsList = wordCells(w);
  let idx = cellsList.findIndex(({ row, col }) => !s.cells[row][col].input);
  if (idx < 0) idx = 0;
  s.activeIdx = idx;
}

function typeLetter(s, ch) {
  const w = getActiveWord(s);
  if (!w) return { typed: false, wrong: false, wordFound: null, allDone: false };
  if (!/^[A-Z]$/.test(ch)) return { typed: false, wrong: false, wordFound: null, allDone: false };

  const cellsList = wordCells(w);
  const pos = cellsList[s.activeIdx];
  if (!pos) return { typed: false, wrong: false, wordFound: null, allDone: false };

  const expected = w.answer[s.activeIdx];
  const wrong = (ch !== expected);
  s.cells[pos.row][pos.col].input = ch;

  let next = s.activeIdx + 1;
  while (next < cellsList.length && s.cells[cellsList[next].row][cellsList[next].col].input) {
    next++;
  }
  if (next >= cellsList.length) next = cellsList.length - 1;
  s.activeIdx = next;

  const newlyFound = [];
  for (const word of s.puzzle.words) {
    const key = `${word.num}${word.dir}`;
    if (s.foundKeys.has(key)) continue;
    if (isWordSolved(word, s.cells)) {
      s.foundKeys.add(key);
      newlyFound.push(key);
      for (const { row, col } of wordCells(word)) {
        s.cells[row][col].found = true;
      }
      s.score += word.answer.length * CONFIG.pointsPerLetter;
    }
  }

  const allDone = s.foundKeys.size === s.puzzle.words.length;
  if (allDone) {
    const secsLeft = Math.max(0, Math.ceil(s.timeLeftMs / 1000));
    s.score += secsLeft * CONFIG.timeBonusPerSec;
    s.result = 'win';
    s.screen = 'gameover';
  }

  return { typed: true, wrong, wordFound: newlyFound[0] || null, allDone };
}

function backspace(s) {
  const w = getActiveWord(s);
  if (!w) return;
  const cellsList = wordCells(w);
  const cur = cellsList[s.activeIdx];
  const curCell = s.cells[cur.row][cur.col];
  if (curCell.found) return;
  if (curCell.input) {
    curCell.input = '';
  } else if (s.activeIdx > 0) {
    s.activeIdx -= 1;
    const prev = cellsList[s.activeIdx];
    if (!s.cells[prev.row][prev.col].found) {
      s.cells[prev.row][prev.col].input = '';
    }
  }
}

function moveCursor(s, delta) {
  const w = getActiveWord(s);
  if (!w) return;
  const cellsList = wordCells(w);
  let next = s.activeIdx + delta;
  if (next < 0) next = 0;
  if (next >= cellsList.length) next = cellsList.length - 1;
  s.activeIdx = next;
}

function timeout(s) {
  s.result = 'timeout';
  s.screen = 'gameover';
}

function cycleClue(s, dir = 1) {
  const order = s.puzzle.words.map((w) => `${w.num}${w.dir}`);
  const i = order.indexOf(s.activeKey);
  let n = i + dir;
  if (n < 0) n = order.length - 1;
  if (n >= order.length) n = 0;
  let guard = order.length;
  while (s.foundKeys.has(order[n]) && guard-- > 0) {
    n += dir;
    if (n < 0) n = order.length - 1;
    if (n >= order.length) n = 0;
  }
  selectWord(s, order[n]);
}

function renderGrid(state) {
  const active = getActiveWord(state);
  const activeCells = active ? wordCells(active) : [];
  const activeCellAt = (r, c) => activeCells.some((p) => p.row === r && p.col === c);
  const isCursor = (r, c) => active && activeCells[state.activeIdx] && activeCells[state.activeIdx].row === r && activeCells[state.activeIdx].col === c;

  let html = `<div class="grid" role="grid" aria-label="Crossword grid">`;
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = state.cells[r][c];
      if (!cell.filled) {
        html += `<div class="cell block" aria-hidden="true"></div>`;
      } else {
        const classes = ['cell'];
        if (cell.found) classes.push('found');
        if (activeCellAt(r, c)) classes.push('active-word');
        if (isCursor(r, c)) classes.push('cursor');
        html += `<div class="${classes.join(' ')}" data-r="${r}" data-c="${c}" role="gridcell">`;
        if (cell.num != null) html += `<span class="num">${cell.num}</span>`;
        html += `<span class="letter">${cell.input || ''}</span>`;
        html += `</div>`;
      }
    }
  }
  html += `</div>`;
  return html;
}

function renderClueColumn(state, label, dir) {
  const { across, down } = clueGroups(state.puzzle);
  const list = dir === 'A' ? across : down;
  let html = `<div class="clue-col"><div class="clue-head">${label}</div><ul>`;
  for (const w of list) {
    const key = `${w.num}${w.dir}`;
    const cls = ['clue-item'];
    if (state.activeKey === key) cls.push('active');
    if (state.foundKeys.has(key)) cls.push('found');
    html += `<li class="${cls.join(' ')}" data-key="${key}"><span class="cnum">${w.num}</span><span class="ctext">${escape(w.clue)}</span><span class="clen">(${w.answer.length})</span></li>`;
  }
  html += `</ul></div>`;
  return html;
}

function renderGameOver(state, handlers) {
  const win = state.result === 'win';
  const words = state.puzzle ? state.puzzle.words : [];
  const total = words.length;
  const foundList = words.filter((w) => state.foundKeys.has(`${w.num}${w.dir}`));
  const missList = words.filter((w) => !state.foundKeys.has(`${w.num}${w.dir}`));
  root.innerHTML = `
    <div class="term">
      ${termBar('~/datacruise/word-games/crack-the-crossword $ <span class="cmd">result</span>')}
      <div class="term-body over">
        <div class="brand">
          <div class="brand-title">DATACRUISE <span class="pipe">/</span> WORD GAMES</div>
          <div class="brand-meta">PUZZLE :: ${escape(state.puzzle?.name || '').toUpperCase()}</div>
        </div>
        <h2 class="${win ? 'correct' : 'wrong'}">${win ? '✓ ALL WORDS FOUND' : '⏱ TIME OUT'}</h2>
        <div class="subtitle">${win ? 'You decoded the whole grid.' : `You filled ${state.foundKeys.size} of ${total} words.`}</div>

        <div class="final-stats">
          <div class="stat"><div class="num">${state.score}</div><div class="lbl">Score</div></div>
          <div class="stat cyan"><div class="num">${state.foundKeys.size}/${total}</div><div class="lbl">Words</div></div>
          <div class="stat yellow"><div class="num">${formatTime(state.timeLeftMs)}</div><div class="lbl">Time left</div></div>
        </div>

        ${missList.length ? `
          <div class="answer-list">
            <div class="al-head">Words you missed</div>
            <ul>
              ${missList.map((w) => `<li><span class="al-num">${w.num}${w.dir}</span> <span class="al-word">${w.answer}</span> — <span class="al-clue">${escape(w.clue)}</span></li>`).join('')}
            </ul>
          </div>
        ` : ''}
        ${foundList.length && !win ? `
          <div class="answer-list found">
            <div class="al-head">Words you found</div>
            <ul>
              ${foundList.map((w) => `<li><span class="al-num">${w.num}${w.dir}</span> <span class="al-word">${w.answer}</span></li>`).join('')}
            </ul>
          </div>
        ` : ''}

        <div class="start-buttons">
          <button class="btn" id="btn-restart">▶ NEW PUZZLE</button>
          <button class="btn ghost" id="btn-home">⌂ HOME</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('btn-restart').addEventListener('click', () => handlers.onStart());
  document.getElementById('btn-home').addEventListener('click', () => handlers.onHome());
}

function attachPlayHandlers(state, handlers) {
  root.querySelectorAll('.clue-item').forEach((el) => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-key');
      if (state.foundKeys.has(key)) return;
      handlers.onSelectClue(key);
    });
  });
  root.querySelectorAll('.cell[data-r]').forEach((el) => {
    el.addEventListener('click', () => {
      const r = +el.getAttribute('data-r');
      const c = +el.getAttribute('data-c');
      handlers.onCellClick(r, c);
    });
  });
  document.getElementById('btn-home').addEventListener('click', () => handlers.onHome());
  document.getElementById('btn-quit').addEventListener('click', () => handlers.onQuit());
}

function updateTimerBar(timeLeftMs, totalMs) {
  const fill = document.getElementById('timer-fill');
  if (!fill) return;
  const pct = Math.max(0, Math.min(100, (timeLeftMs / totalMs) * 100));
  fill.style.width = pct + '%';
  if (pct < 25) fill.classList.add('warn'); else fill.classList.remove('warn');
  const t = document.getElementById('hud-time');
  if (t) t.textContent = formatTime(timeLeftMs);
}

function termBar(pathInner, hideMute = false) {
  return `
    <div class="term-bar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="path"><span class="prompt">buzz@datacruise</span><span class="sep">:</span>${pathInner}</div>
      ${hideMute ? '' : `<button class="mute-btn" id="btn-mute" aria-label="Toggle sound">${isMuted() ? '🔇' : '🔊'}</button>`}
    </div>
  `;
}

function formatTime(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, '0')}`;
}

function escape(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}


/* ==== main.js ==== */
// Crack the Data Crossword — entry point.


const state = createState();
let timerHandle = null;

function clearTimer() {
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
}

function startTimer() {
  clearTimer();
  const tick = CONFIG.tickMs;
  const totalMs = CONFIG.totalSeconds * 1000;
  timerHandle = setInterval(() => {
    if (state.screen !== 'play') return;
    state.timeLeftMs -= tick;
    if (state.timeLeftMs <= 0) {
      state.timeLeftMs = 0;
      clearTimer();
      timeout(state);
      sfx.timeout();
      sfx.gameover();
      draw();
    } else {
      updateTimerBar(state.timeLeftMs, totalMs);
    }
  }, tick);
}

const handlers = {
  onStart: () => {
    startGame(state);
    draw();
    startTimer();
    focusKbd();
  },
  onSelectClue: (key) => {
    sfx.clueSelect();
    selectWord(state, key);
    draw();
    focusKbd();
  },
  onCellClick: (r, c) => {
    const cur = getActiveWord(state);
    const curCells = cur ? wordCells(cur) : [];
    const inCurrent = curCells.some((p) => p.row === r && p.col === c);
    // Find the across word and down word containing this cell.
    const containing = state.puzzle.words.filter((w) => wordCells(w).some((p) => p.row === r && p.col === c));
    if (containing.length === 0) return;

    let chosen;
    if (inCurrent && containing.length > 1) {
      // Toggle to the other direction.
      const other = containing.find((w) => `${w.num}${w.dir}` !== state.activeKey);
      chosen = other || containing[0];
    } else if (inCurrent) {
      // Same word — just move the cursor to the clicked cell.
      const list = wordCells(cur);
      state.activeIdx = list.findIndex((p) => p.row === r && p.col === c);
      sfx.clueSelect();
      draw();
      focusKbd();
      return;
    } else {
      // Prefer an unfound word; otherwise the first.
      chosen = containing.find((w) => !state.foundKeys.has(`${w.num}${w.dir}`)) || containing[0];
    }
    sfx.clueSelect();
    selectWord(state, `${chosen.num}${chosen.dir}`);
    // Snap cursor to the clicked cell within the chosen word.
    const list = wordCells(chosen);
    const idx = list.findIndex((p) => p.row === r && p.col === c);
    if (idx >= 0) state.activeIdx = idx;
    draw();
    focusKbd();
  },
  onHome: () => {
    clearTimer();
    state.screen = 'splash';
    draw();
  },
  onQuit: () => {
    clearTimer();
    state.result = 'timeout';
    state.screen = 'gameover';
    sfx.gameover();
    draw();
  },
  onToggleMute: () => {
    toggleMuted();
    const btn = document.getElementById('btn-mute');
    if (btn) btn.textContent = isMuted() ? '🔇' : '🔊';
  }
};

// --- Mobile keyboard proxy --------------------------------------------------
// Grid cells are <div>s, so tapping them can't open a phone keyboard, and
// Android/on-screen keyboards don't report letters via `keydown`. A hidden but
// focusable <input> fixes both: tapping a cell focuses it (which opens the
// on-screen keyboard) and its `input` events feed letters + backspace reliably
// on every platform. A sentinel character means backspace still fires `input`
// even though the field is logically empty.
const kbd = document.createElement('input');
kbd.type = 'text';
kbd.setAttribute('inputmode', 'text');
kbd.setAttribute('autocapitalize', 'characters');
kbd.setAttribute('autocomplete', 'off');
kbd.setAttribute('autocorrect', 'off');
kbd.setAttribute('spellcheck', 'false');
kbd.setAttribute('aria-hidden', 'true');
kbd.tabIndex = -1;
kbd.style.cssText =
  'position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;' +
  'margin:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;z-index:-1;';
const KBD_SENT = ' ';
document.body.appendChild(kbd);
kbd.value = KBD_SENT;

function focusKbd() {
  if (state.screen !== 'play') return;
  kbd.value = KBD_SENT;
  try { kbd.focus({ preventScroll: true }); } catch (_) { kbd.focus(); }
  try { kbd.setSelectionRange(KBD_SENT.length, KBD_SENT.length); } catch (_) {}
}

kbd.addEventListener('input', () => {
  if (state.screen !== 'play') { kbd.value = KBD_SENT; return; }
  const v = kbd.value;
  if (v.length > KBD_SENT.length) {
    const added = v.slice(KBD_SENT.length);
    for (let i = 0; i < added.length; i++) {
      const ch = added[i];
      if (!/[a-zA-Z]/.test(ch)) continue;
      const res = typeLetter(state, ch.toUpperCase());
      if (res.typed) {
        if (res.wordFound) sfx.wordFound();
        else if (res.wrong) sfx.wrong();
        else sfx.key();
        draw();
        if (res.allDone) sfx.win();
      }
    }
  } else {
    // sentinel was deleted -> a backspace
    backspace(state);
    sfx.key();
    draw();
  }
  kbd.value = KBD_SENT;
  try { kbd.setSelectionRange(KBD_SENT.length, KBD_SENT.length); } catch (_) {}
});

function draw() {
  if (state.screen === 'splash') renderSplash(state, handlers);
  else if (state.screen === 'play') renderPlay(state, handlers);
  else if (state.screen === 'gameover') renderGameOver(state, handlers);
  // Wire the mute button on every render (it lives in the term bar).
  const m = document.getElementById('btn-mute');
  if (m) m.addEventListener('click', handlers.onToggleMute);

  // Fire the shareable result once, the first draw after entering game-over.
  if (state.screen === 'gameover') {
    if (!draw._over) {
      draw._over = true;
      const words = (state.puzzle && state.puzzle.words.length) || 1;
      const found = state.foundKeys ? state.foundKeys.size : 0;
      const pct = found / words;
      window.DataCruiseResult && DataCruiseResult.ready({
        slug: 'data-crossword', game: 'Crack the Data Crossword',
        headline: state.score + ' pts',
        sub: found + '/' + words + ' words solved ✏️',
        stars: pct >= 1 ? 3 : pct >= 0.6 ? 2 : pct > 0 ? 1 : 0, starsMax: 3,
      });
    }
  } else {
    draw._over = false;
  }
}

window.addEventListener('keydown', (e) => {
  if (state.screen === 'splash') {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      handlers.onStart();
    }
    return;
  }
  if (state.screen === 'gameover') {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      handlers.onStart();
    }
    return;
  }
  // Play screen.
  if (e.key === 'Tab') {
    e.preventDefault();
    cycleClue(state, e.shiftKey ? -1 : 1);
    sfx.clueSelect();
    draw();
    return;
  }
  if (e.key === 'Backspace') {
    if (document.activeElement === kbd) return; // handled by the input proxy
    e.preventDefault();
    backspace(state);
    sfx.key();
    draw();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    moveCursor(state, -1);
    draw();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    moveCursor(state, 1);
    draw();
    return;
  }
  if (/^[a-zA-Z]$/.test(e.key)) {
    if (document.activeElement === kbd) return; // handled by the input proxy
    e.preventDefault();
    const res = typeLetter(state, e.key.toUpperCase());
    if (res.typed) {
      if (res.wordFound) sfx.wordFound();
      else if (res.wrong) sfx.wrong();
      else sfx.key();
      draw();
      if (res.allDone) sfx.win();
    }
  }
});

draw();

const PLATFORM = "site";
const AD = { enabled: true, gameId: "vqru0z8yon89pseghdbzzsq5kfnik6re" };
let _gmReady = false, _gmPending = null;
// Enable GameMonetize test-ad mode on localhost / dev origins so ads actually
// serve during local verification. Real domains (GameMonetize's player,
// arcade.datacruise.app, etc.) get the production ad stack instead.
const _gmIsLocalOrigin = /^(127\.0\.0\.1|localhost|0\.0\.0\.0|::1)$/.test(location.hostname);
if (PLATFORM === "site" && AD.enabled && AD.gameId) {
  window.SDK_OPTIONS = {
    gameId: AD.gameId,
    testing: _gmIsLocalOrigin,
    debug: _gmIsLocalOrigin,
    onEvent: function (a) {
      switch (a && a.name) {
        case "SDK_READY":                   _gmReady = true; break;
        case "SDK_GAME_PAUSE":               if (_gmPending) _gmPending.adShown = true; break;
        case "SDK_REWARDED_WATCH_COMPLETE": if (_gmPending) _gmPending.earned = true; break;
        case "SDK_GAME_START":              _gmResolve(true); break;
        case "SDK_ERROR":                   _gmResolve(false); break;
      }
    }
  };
  (function (d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = "https://api.gamemonetize.com/sdk.js";
    fjs.parentNode.insertBefore(js, fjs);
  })(document, "script", "gamemonetize-sdk");
}
function _gmResolve(ok) {
  if (!_gmPending) return;
  const g = _gmPending; _gmPending = null;
  clearTimeout(g.timer);
  if (typeof g.done === "function") g.done(!!ok);
}
function showRewardedAd(onReward) {
  const done = (ok) => { if (ok && typeof onReward === "function") onReward(); };
  if (_gmReady && typeof sdk !== "undefined" && sdk && typeof sdk.showBanner === "function") {
    _gmPending = { done, earned: false, adShown: false,
                     timer: setTimeout(() => _gmResolve(true), 25000) };
    try { sdk.showBanner(); } catch (e) { _gmResolve(true); }
    return;
  }
  setTimeout(() => done(true), 800);
}

/* ==== Rewarded-ad hook ==== */
function _handleWatchAdContinue() {
  if (!(state && state.screen === 'gameover' && state.result === 'timeout')) return;
  showRewardedAd(() => {
    state.result = null;
            state.screen = 'play';
            state.timeLeftMs = (state.timeLeftMs || 0) + 30000;
            draw._over = false;
            draw();
            startTimer();
  });
}

(function () {
  const seen = new WeakSet();
  const check = () => {
    if (!(state && state.screen === 'gameover' && state.result === 'timeout')) return;
    const actions = document.querySelector(".end-actions, .card .actions, .game-over-actions, .actions-row");
    if (!actions || seen.has(actions)) return;
    if (actions.querySelector('[data-action="watch-ad-continue"]')) return;
    seen.add(actions);
    const btn = document.createElement("button");
    btn.className = "gold";
    btn.setAttribute("data-action", "watch-ad-continue");
    btn.textContent = "▶ WATCH AD → +30 SECONDS";
    const refNode = actions.firstChild;
    actions.insertBefore(btn, refNode);
  };
  setInterval(check, 400);
}());

document.addEventListener("click", function (e) {
  const t = e.target.closest && e.target.closest("[data-action]");
  if (t && t.getAttribute("data-action") === "watch-ad-continue") {

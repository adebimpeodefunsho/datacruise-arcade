<svg xmlns="http://www.w3.org/2000/svg" width="512" height="340" viewBox="0 0 512 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="340" fill="url(#sky)"/>

  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="50" r="1.8"/>
    <circle cx="140" cy="42" r="1.4"/>
    <circle cx="380" cy="50" r="2.2"/>
    <circle cx="450" cy="80" r="1.8"/>
    <circle cx="60" cy="120" r="1.6"/>
    <circle cx="470" cy="140" r="1.4"/>
  </g>

  <!-- Crossword grid — 5 rows × 8 cols × 24px -->
  <g transform="translate(272, 202)">
    <rect x="-108" y="-70" width="216" height="140" rx="10" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="2.5"/>
    <g transform="translate(-100, -62)" font-family="Impact, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#1A1A1A">
      <!-- Row 0: 3 black, D, 4 black -->
      <rect x="0" y="0" width="24" height="24" fill="#1A1A1A"/>
      <rect x="24" y="0" width="24" height="24" fill="#1A1A1A"/>
      <rect x="48" y="0" width="24" height="24" fill="#1A1A1A"/>
      <rect x="72" y="0" width="24" height="24" fill="#FFF" stroke="#1A1A1A" stroke-width="1"/>
      <text x="84" y="19" text-anchor="middle">D</text>
      <rect x="96" y="0" width="24" height="24" fill="#1A1A1A"/>
      <rect x="120" y="0" width="24" height="24" fill="#1A1A1A"/>
      <rect x="144" y="0" width="24" height="24" fill="#1A1A1A"/>
      <rect x="168" y="0" width="24" height="24" fill="#1A1A1A"/>
      <!-- Row 1: 3 black, A, 4 black -->
      <rect x="0" y="24" width="24" height="24" fill="#1A1A1A"/>
      <rect x="24" y="24" width="24" height="24" fill="#1A1A1A"/>
      <rect x="48" y="24" width="24" height="24" fill="#1A1A1A"/>
      <rect x="72" y="24" width="24" height="24" fill="#FFF" stroke="#1A1A1A" stroke-width="1"/>
      <text x="84" y="43" text-anchor="middle">A</text>
      <rect x="96" y="24" width="24" height="24" fill="#1A1A1A"/>
      <rect x="120" y="24" width="24" height="24" fill="#1A1A1A"/>
      <rect x="144" y="24" width="24" height="24" fill="#1A1A1A"/>
      <rect x="168" y="24" width="24" height="24" fill="#1A1A1A"/>
      <!-- Row 2: MEDIAN across -->
      <rect x="0" y="48" width="24" height="24" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="1"/>
      <text x="12" y="67" text-anchor="middle">M</text>
      <rect x="24" y="48" width="24" height="24" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="1"/>
      <text x="36" y="67" text-anchor="middle">E</text>
      <rect x="48" y="48" width="24" height="24" fill="#FFC500" stroke="#1A1A1A" stroke-width="1"/>
      <text x="60" y="67" text-anchor="middle">D</text>
      <rect x="72" y="48" width="24" height="24" fill="#FFC500" stroke="#1A1A1A" stroke-width="1"/>
      <text x="84" y="67" text-anchor="middle">I</text>
      <rect x="96" y="48" width="24" height="24" fill="#FFC500" stroke="#1A1A1A" stroke-width="1"/>
      <text x="108" y="67" text-anchor="middle">A</text>
      <rect x="120" y="48" width="24" height="24" fill="#FFC500" stroke="#1A1A1A" stroke-width="1"/>
      <text x="132" y="67" text-anchor="middle">N</text>
      <rect x="144" y="48" width="24" height="24" fill="#1A1A1A"/>
      <rect x="168" y="48" width="24" height="24" fill="#1A1A1A"/>
      <!-- Row 3 -->
      <rect x="0" y="72" width="24" height="24" fill="#1A1A1A"/>
      <rect x="24" y="72" width="24" height="24" fill="#1A1A1A"/>
      <rect x="48" y="72" width="24" height="24" fill="#1A1A1A"/>
      <rect x="72" y="72" width="24" height="24" fill="#FFF" stroke="#1A1A1A" stroke-width="1"/>
      <text x="84" y="91" text-anchor="middle">T</text>
      <rect x="96" y="72" width="24" height="24" fill="#1A1A1A"/>
      <rect x="120" y="72" width="24" height="24" fill="#1A1A1A"/>
      <rect x="144" y="72" width="24" height="24" fill="#1A1A1A"/>
      <rect x="168" y="72" width="24" height="24" fill="#1A1A1A"/>
      <!-- Row 4 -->
      <rect x="0" y="96" width="24" height="24" fill="#1A1A1A"/>
      <rect x="24" y="96" width="24" height="24" fill="#1A1A1A"/>
      <rect x="48" y="96" width="24" height="24" fill="#1A1A1A"/>
      <rect x="72" y="96" width="24" height="24" fill="#FFF" stroke="#1A1A1A" stroke-width="1"/>
      <text x="84" y="115" text-anchor="middle">A</text>
      <rect x="96" y="96" width="24" height="24" fill="#1A1A1A"/>
      <rect x="120" y="96" width="24" height="24" fill="#1A1A1A"/>
      <rect x="144" y="96" width="24" height="24" fill="#1A1A1A"/>
      <rect x="168" y="96" width="24" height="24" fill="#1A1A1A"/>

  <!-- Magni -->
  <g transform="translate(80, 275)">
    <ellipse cx="-13" cy="-13" rx="13" ry="8" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.2"/>
    <ellipse cx="13" cy="-13" rx="13" ry="8" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.2"/>
    <ellipse cx="0" cy="8" rx="21" ry="25" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -19 0 L 19 0" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M -19 14 L 19 14" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="0" cy="-19" r="12" fill="#7A4F2E" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="-4" cy="-20" r="2.4" fill="#FFF"/>
    <circle cx="4" cy="-21" r="2.4" fill="#FFF"/>
  </g>

  <!-- Timer bar -->
  <g transform="translate(272, 302)">
    <rect x="-134" y="-8" width="268" height="16" rx="8" fill="#FFF" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-132" y="-6" width="150" height="12" rx="6" fill="#FFC500"/>
  </g>

  <!-- Title -->
  <g transform="translate(256, 60)">
    <rect x="-220" y="-32" width="440" height="66" rx="18" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#FFC500" letter-spacing="2">CRACK THE DATA CROSSWORD</text>
    <text x="0" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #2</text>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="0.55" stop-color="#9265D8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Sparkles -->
  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="70" r="2"/>
    <circle cx="140" cy="50" r="1.5"/>
    <circle cx="380" cy="60" r="2.5"/>
    <circle cx="450" cy="90" r="2"/>
    <circle cx="60" cy="150" r="1.5"/>
    <circle cx="470" cy="170" r="1.5"/>
    <circle cx="30" cy="240" r="1.5"/>
    <circle cx="490" cy="260" r="2"/>
  </g>

  <!-- Crossword grid — 6x6 with a data term "MEDIAN" across and "DATA" down -->
  <g transform="translate(256, 260)">
    <!-- Grid backdrop -->
    <rect x="-150" y="-140" width="300" height="220" rx="12" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Cells: 8 columns, 5 rows, 34px each -->
    <g transform="translate(-136, -126)" font-family="Impact, Helvetica, sans-serif" font-weight="900" font-size="24" fill="#1A1A1A">
      <!-- Row 0: block block block D block block block block -->
      <rect x="0" y="0" width="34" height="34" fill="#1A1A1A"/>
      <rect x="34" y="0" width="34" height="34" fill="#1A1A1A"/>
      <rect x="68" y="0" width="34" height="34" fill="#1A1A1A"/>
      <rect x="102" y="0" width="34" height="34" fill="#FFF" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="119" y="26" text-anchor="middle">D</text>
      <text x="106" y="12" text-anchor="start" font-size="10" fill="#6B3EB0">1</text>
      <rect x="136" y="0" width="34" height="34" fill="#1A1A1A"/>
      <rect x="170" y="0" width="34" height="34" fill="#1A1A1A"/>
      <rect x="204" y="0" width="34" height="34" fill="#1A1A1A"/>
      <rect x="238" y="0" width="34" height="34" fill="#1A1A1A"/>

      <!-- Row 1: block block block A block block block block -->
      <rect x="0" y="34" width="34" height="34" fill="#1A1A1A"/>
      <rect x="34" y="34" width="34" height="34" fill="#1A1A1A"/>
      <rect x="68" y="34" width="34" height="34" fill="#1A1A1A"/>
      <rect x="102" y="34" width="34" height="34" fill="#FFF" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="119" y="60" text-anchor="middle">A</text>
      <rect x="136" y="34" width="34" height="34" fill="#1A1A1A"/>
      <rect x="170" y="34" width="34" height="34" fill="#1A1A1A"/>
      <rect x="204" y="34" width="34" height="34" fill="#1A1A1A"/>
      <rect x="238" y="34" width="34" height="34" fill="#1A1A1A"/>

      <!-- Row 2: M E D I A N (across word starts at col 0) -->
      <rect x="0" y="68" width="34" height="34" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="17" y="94" text-anchor="middle">M</text>
      <text x="4" y="80" text-anchor="start" font-size="10" fill="#6B3EB0">2</text>
      <rect x="34" y="68" width="34" height="34" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="51" y="94" text-anchor="middle">E</text>
      <rect x="68" y="68" width="34" height="34" fill="#FFC500" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="85" y="94" text-anchor="middle">D</text>
      <rect x="102" y="68" width="34" height="34" fill="#FFC500" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="119" y="94" text-anchor="middle">I</text>
      <rect x="136" y="68" width="34" height="34" fill="#FFC500" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="153" y="94" text-anchor="middle">A</text>
      <rect x="170" y="68" width="34" height="34" fill="#FFC500" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="187" y="94" text-anchor="middle">N</text>
      <rect x="204" y="68" width="34" height="34" fill="#1A1A1A"/>
      <rect x="238" y="68" width="34" height="34" fill="#1A1A1A"/>

      <!-- Row 3: block block block T block block block block -->
      <rect x="0" y="102" width="34" height="34" fill="#1A1A1A"/>
      <rect x="34" y="102" width="34" height="34" fill="#1A1A1A"/>
      <rect x="68" y="102" width="34" height="34" fill="#1A1A1A"/>
      <rect x="102" y="102" width="34" height="34" fill="#FFF" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="119" y="128" text-anchor="middle">T</text>
      <rect x="136" y="102" width="34" height="34" fill="#1A1A1A"/>
      <rect x="170" y="102" width="34" height="34" fill="#1A1A1A"/>
      <rect x="204" y="102" width="34" height="34" fill="#1A1A1A"/>
      <rect x="238" y="102" width="34" height="34" fill="#1A1A1A"/>

      <!-- Row 4: block block block A block block block block -->
      <rect x="0" y="136" width="34" height="34" fill="#1A1A1A"/>
      <rect x="34" y="136" width="34" height="34" fill="#1A1A1A"/>
      <rect x="68" y="136" width="34" height="34" fill="#1A1A1A"/>
      <rect x="102" y="136" width="34" height="34" fill="#FFF" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="119" y="162" text-anchor="middle">A</text>
      <rect x="136" y="136" width="34" height="34" fill="#1A1A1A"/>
      <rect x="170" y="136" width="34" height="34" fill="#1A1A1A"/>
      <rect x="204" y="136" width="34" height="34" fill="#1A1A1A"/>
      <rect x="238" y="136" width="34" height="34" fill="#1A1A1A"/>
    </g>
  </g>

  <!-- Timer bar -->
  <g transform="translate(256, 390)">
    <rect x="-150" y="-8" width="300" height="16" rx="8" fill="#FFF" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-148" y="-6" width="180" height="12" rx="6" fill="#FFC500"/>
    <text x="0" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="2">TIMER · 04:12</text>
  </g>

  <!-- Magni bee bottom-left -->
  <g transform="translate(95, 450)">
    <ellipse cx="-15" cy="-15" rx="14" ry="9" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="15" cy="-15" rx="14" ry="9" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="0" cy="8" rx="24" ry="28" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -22 0 L 22 0" stroke="#1A1A1A" stroke-width="3.5"/>
    <path d="M -22 16 L 22 16" stroke="#1A1A1A" stroke-width="3.5"/>
    <circle cx="0" cy="-22" r="14" fill="#7A4F2E" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -5 -34 Q -10 -42 -7 -48" stroke="#1A1A1A" stroke-width="1.8" fill="none"/>
    <circle cx="-7" cy="-48" r="2.2" fill="#1A1A1A"/>
    <path d="M 5 -34 Q 10 -42 7 -48" stroke="#1A1A1A" stroke-width="1.8" fill="none"/>
    <circle cx="7" cy="-48" r="2.2" fill="#1A1A1A"/>
    <circle cx="-4" cy="-22" r="2.6" fill="#FFF"/>
    <circle cx="4" cy="-23" r="2.6" fill="#FFF"/>
    <circle cx="-4" cy="-23" r="1.3" fill="#1A1A1A"/>
    <circle cx="4" cy="-24" r="1.3" fill="#1A1A1A"/>
  </g>

  <!-- Title -->
  <g transform="translate(256, 90)">
    <rect x="-220" y="-42" width="440" height="86" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#FFC500" letter-spacing="2">CRACK THE</text>
    <text x="0" y="24" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#FFC500" letter-spacing="2">DATA CROSSWORD</text>
    <text x="0" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #2</text>
  </g>
</svg>

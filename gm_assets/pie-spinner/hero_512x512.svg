<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Clouds -->
  <g opacity="0.6">
    <circle cx="80" cy="60" r="18" fill="#FFF"/>
    <circle cx="106" cy="58" r="22" fill="#FFF"/>
    <circle cx="134" cy="64" r="16" fill="#FFF"/>
    <circle cx="410" cy="70" r="18" fill="#FFF"/>
    <circle cx="440" cy="66" r="22" fill="#FFF"/>
  </g>

  <!-- Left: pie chart being built (4 slices, 3 lit) -->
  <g transform="translate(160,300)">
    <!-- Outer ring -->
    <circle r="120" fill="#1A1A1A"/>
    <!-- 4 slices: 45%, 25%, 20%, 10% clockwise from 12 o'clock -->
    <!-- Slice 1 (45%) — orange, lit -->
    <path d="M 0 0 L 0 -110 A 110 110 0 0 1 105 30 Z" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Slice 2 (25%) — gold, lit -->
    <path d="M 0 0 L 105 30 A 110 110 0 0 1 4 110 Z" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Slice 3 (20%) — green, lit -->
    <path d="M 0 0 L 4 110 A 110 110 0 0 1 -84 71 Z" fill="#2BB673" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Slice 4 (10%) — grey (still to light) -->
    <path d="M 0 0 L -84 71 A 110 110 0 0 1 0 -110 Z" fill="#DDD2B5" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Labels -->
    <text x="42" y="-52" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">45%</text>
    <text x="60" y="42" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#1A1A1A">25%</text>
    <text x="-40" y="60" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#1A1A1A">20%</text>
    <text x="-50" y="-30" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#6F5C2E">10%</text>
  </g>

  <!-- Right: spinner wheel with wedges + pointer -->
  <g transform="translate(370,300)">
    <!-- Pointer -->
    <polygon points="-18,-120 18,-120 0,-92" fill="#1A1A1A"/>
    <polygon points="-12,-116 12,-116 0,-98" fill="#FFC500"/>
    <!-- Wheel -->
    <circle r="98" fill="#1A1A1A"/>
    <circle r="93" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="3"/>
    <!-- 8 wedges, 45° each -->
    <g transform="rotate(-22.5)">
      <path d="M 0 0 L 93 0 A 93 93 0 0 1 66 66 Z" fill="#FFE0A8"/>
      <path d="M 0 0 L 66 66 A 93 93 0 0 1 0 93 Z" fill="#FFF7E2"/>
      <path d="M 0 0 L 0 93 A 93 93 0 0 1 -66 66 Z" fill="#FFE0A8"/>
      <path d="M 0 0 L -66 66 A 93 93 0 0 1 -93 0 Z" fill="#FFF7E2"/>
      <path d="M 0 0 L -93 0 A 93 93 0 0 1 -66 -66 Z" fill="#FFE0A8"/>
      <path d="M 0 0 L -66 -66 A 93 93 0 0 1 0 -93 Z" fill="#FFF7E2"/>
      <path d="M 0 0 L 0 -93 A 93 93 0 0 1 66 -66 Z" fill="#FFE0A8"/>
      <path d="M 0 0 L 66 -66 A 93 93 0 0 1 93 0 Z" fill="#FFF7E2"/>
    </g>
    <!-- Numbers on wedges -->
    <text x="55" y="10" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#1A1A1A">45</text>
    <text x="30" y="52" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">10</text>
    <text x="-30" y="52" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">60</text>
    <text x="-55" y="10" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#1A1A1A">25</text>
    <text x="-30" y="-30" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">90</text>
    <text x="0" y="-56" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">20</text>
    <text x="30" y="-30" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#1A1A1A">75</text>
    <text x="55" y="-30" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#1A1A1A">30</text>
    <!-- SPIN hub -->
    <circle r="30" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="3"/>
    <text y="6" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#1A1A1A" letter-spacing="2">SPIN</text>
  </g>

  <!-- Title panel -->
  <g transform="translate(256,90)">
    <rect x="-200" y="-40" width="400" height="80" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#FFC500" letter-spacing="3">PIE SPINNER</text>
    <text x="0" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 3</text>
  </g>
</svg>

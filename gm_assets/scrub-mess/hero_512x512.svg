<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="0.55" stop-color="#9265D8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="60" r="2"/>
    <circle cx="140" cy="50" r="1.5"/>
    <circle cx="380" cy="60" r="2.5"/>
    <circle cx="450" cy="90" r="2"/>
    <circle cx="60" cy="150" r="1.5"/>
    <circle cx="470" cy="170" r="1.5"/>
  </g>

  <!-- Left side: CLEAN words floating up -->
  <g font-family="Impact, Helvetica, sans-serif" font-size="16" font-weight="900">
    <g transform="translate(85, 200)">
      <rect x="-42" y="-14" width="84" height="26" rx="8" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#1A1A1A" letter-spacing="1">MEAN</text>
    </g>
    <g transform="translate(80, 260)">
      <rect x="-42" y="-14" width="84" height="26" rx="8" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#1A1A1A" letter-spacing="1">JOIN</text>
    </g>
    <g transform="translate(90, 320)">
      <rect x="-42" y="-14" width="84" height="26" rx="8" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#1A1A1A" letter-spacing="1">SQL</text>
    </g>
  </g>

  <!-- Right side: MESSY words falling into bin -->
  <g font-family="Impact, Helvetica, sans-serif" font-size="14" font-weight="900">
    <g transform="translate(360, 200) rotate(-8)">
      <rect x="-46" y="-14" width="92" height="26" rx="8" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#FFF" letter-spacing="1">MEEN</text>
    </g>
    <g transform="translate(400, 250) rotate(6)">
      <rect x="-46" y="-14" width="92" height="26" rx="8" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#FFF" letter-spacing="1">FOOTBALL</text>
    </g>
    <g transform="translate(345, 300) rotate(-4)">
      <rect x="-46" y="-14" width="92" height="26" rx="8" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#FFF" letter-spacing="1">JOIN</text>
      <text x="34" y="4" text-anchor="middle" font-size="10" fill="#FFF">2×</text>
    </g>
  </g>

  <!-- Center: Trash bin catching messy words -->
  <g transform="translate(256, 380)">
    <!-- Lid -->
    <rect x="-70" y="-8" width="140" height="12" rx="4" fill="#5C2A0F" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-14" y="-16" width="28" height="10" rx="4" fill="#5C2A0F" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Body -->
    <path d="M -60 4 L 60 4 L 50 90 L -50 90 Z" fill="#8B4513" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Slats -->
    <line x1="-52" y1="20" x2="52" y2="20" stroke="#1A1A1A" stroke-width="2" opacity="0.4"/>
    <line x1="-54" y1="40" x2="54" y2="40" stroke="#1A1A1A" stroke-width="2" opacity="0.4"/>
    <line x1="-56" y1="60" x2="56" y2="60" stroke="#1A1A1A" stroke-width="2" opacity="0.4"/>
    <!-- Recycle symbol -->
    <g transform="translate(0, 50)">
      <path d="M -12 -8 L -4 -14 L -8 -4 Z M 4 -14 L 12 -8 L 8 -4 Z M -4 8 L 4 8 L 0 14 Z" fill="#FFC500"/>
    </g>
  </g>

  <!-- Magni bee bottom-left -->
  <g transform="translate(90, 440)">
    <ellipse cx="-15" cy="-15" rx="14" ry="9" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="15" cy="-15" rx="14" ry="9" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="0" cy="8" rx="24" ry="28" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -22 0 L 22 0" stroke="#1A1A1A" stroke-width="3.5"/>
    <path d="M -22 16 L 22 16" stroke="#1A1A1A" stroke-width="3.5"/>
    <circle cx="0" cy="-22" r="14" fill="#7A4F2E" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -5 -34 Q -10 -42 -7 -48" stroke="#1A1A1A" stroke-width="1.8" fill="none"/>
    <circle cx="-7" cy="-48" r="2.2" fill="#1A1A1A"/>
    <path d="M 5 -34 Q 10 -42 7 -48" stroke="#1A1A1A" stroke-width="1.8" fill="none"/>
    <circle cx="7" cy="-48" r="2.2" fill="#1A1A1A"/>
    <circle cx="-4" cy="-22" r="2.6" fill="#FFF"/>
    <circle cx="4" cy="-23" r="2.6" fill="#FFF"/>
    <circle cx="-4" cy="-23" r="1.3" fill="#1A1A1A"/>
    <circle cx="4" cy="-24" r="1.3" fill="#1A1A1A"/>
  </g>

  <!-- Title -->
  <g transform="translate(256, 90)">
    <rect x="-220" y="-42" width="440" height="86" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">SCRUB THE</text>
    <text x="0" y="24" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">DATA MESS</text>
    <text x="0" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #4</text>
  </g>
</svg>

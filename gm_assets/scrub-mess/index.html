  <style>
/* ============================================================
   DataCruise Word Games — Scrub the Data Mess
   Shares the terminal / hacker aesthetic of the series.
   ============================================================ */

:root {
  --bg-0: #06080c;
  --bg-1: #0a0e14;
  --bg-2: #11161f;
  --bg-3: #1a212e;
  --border: #1f2937;
  --border-hi: #2a3445;

  --neon-green: #00ff9c;
  --neon-cyan:  #00f0ff;
  --neon-magenta: #ff2e92;
  --neon-yellow: #ffd700;
  --neon-red: #ff5577;

  --text:   #c9d1d9;
  --text-dim: #8b949e;
  --text-faint: #4a5260;

  --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'Consolas', monospace;

  --shadow-glow-green: 0 0 12px rgba(0, 255, 156, 0.45), 0 0 30px rgba(0, 255, 156, 0.15);
  --shadow-glow-cyan:  0 0 12px rgba(0, 240, 255, 0.45), 0 0 30px rgba(0, 240, 255, 0.15);
  --shadow-glow-mag:   0 0 12px rgba(255, 46, 146, 0.45), 0 0 30px rgba(255, 46, 146, 0.15);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(ellipse at 12% 8%, rgba(0, 240, 255, 0.11), transparent 55%),
    radial-gradient(ellipse at 88% 12%, rgba(177, 139, 255, 0.11), transparent 55%),
    radial-gradient(ellipse at 50% 105%, rgba(255, 46, 146, 0.11), transparent 60%),
    radial-gradient(ellipse at 92% 82%, rgba(255, 159, 67, 0.09), transparent 55%),
    radial-gradient(ellipse at 8% 78%, rgba(126, 217, 87, 0.08), transparent 55%),
    var(--bg-0);
  min-height: 100vh;
  min-height: 100dvh;
}

/* CRT scanlines */
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0) 0px,
    rgba(0, 0, 0, 0) 2px,
    rgba(0, 0, 0, 0.12) 3px,
    rgba(0, 0, 0, 0) 4px
  );
  mix-blend-mode: multiply;
  opacity: 0.45;
}

#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 16px;
}

/* =========================
   MENU SCREEN
   ========================= */
.screen-menu {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas:
    "brand  magni"
    "card   magni"
    "actions actions"
    "howto  howto";
  gap: 20px 28px;
  align-items: start;
  padding: 8px 0 32px;
}

.brand        { grid-area: brand; }
.menu-magni   { grid-area: magni; }
.card         { grid-area: card; }
.actions      { grid-area: actions; }
.howto        { grid-area: howto; }

.brand-tag {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--neon-cyan);
  opacity: 0.85;
  margin-bottom: 6px;
}
.title {
  font-size: clamp(28px, 5vw, 44px);
  margin: 0;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--text);
  text-shadow: var(--shadow-glow-green);
}
.title .accent {
  color: var(--neon-magenta);
  text-shadow: var(--shadow-glow-mag);
}
.subtitle {
  color: var(--text-dim);
  margin: 10px 0 0;
  max-width: 52ch;
}

.menu-magni {
  width: 140px;
  height: 140px;
  filter: drop-shadow(0 0 20px rgba(255, 196, 60, 0.32));
}

.card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}
.card-label {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.diff-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.diff-btn {
  background: var(--bg-2);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  color: var(--text);
  padding: 12px 10px;
  font-family: var(--mono);
  text-align: left;
  cursor: pointer;
  transition: transform 80ms ease, border-color 120ms, box-shadow 120ms;
  display: grid;
  gap: 4px;
}
.diff-btn:hover { transform: translateY(-1px); border-color: var(--neon-cyan); }
.diff-btn.on {
  border-color: var(--neon-green);
  box-shadow: var(--shadow-glow-green);
}
.diff-name {
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--neon-green);
}
.diff-meta {
  font-size: 11px;
  color: var(--text-dim);
}

.actions {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-primary {
  background: var(--bg-2);
  color: var(--neon-green);
  border: 1px solid var(--neon-green);
  border-radius: 8px;
  padding: 12px 22px;
  font-family: var(--mono);
  font-size: 15px;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: var(--shadow-glow-green);
  transition: transform 80ms ease, background 120ms;
}
.btn-primary:hover { transform: translateY(-1px); background: var(--bg-3); }
.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  padding: 10px 14px;
  font-family: var(--mono);
  letter-spacing: 1px;
  cursor: pointer;
  transition: color 120ms, border-color 120ms;
}
.btn-ghost:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }
.btn-ghost-sm { padding: 6px 10px; font-size: 12px; }

.howto {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}
.howto-title {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--neon-cyan);
  margin-bottom: 6px;
}
.howto ul {
  margin: 0;
  padding-left: 18px;
  color: var(--text-dim);
  font-size: 13px;
}
.howto li { margin-bottom: 3px; }
.t-messy { color: var(--neon-magenta); }
.t-clean { color: var(--neon-green); }

/* =========================
   PLAY SCREEN
   ========================= */
.screen-play {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 12px;
  height: calc(100vh - 32px);
  height: calc(100dvh - 32px);
}

.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
}
.hud-left { display: flex; gap: 20px; }
.hud-right { display: flex; gap: 10px; align-items: center; }
.hud-stat {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}
.hud-key {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
}
.hud-val {
  font-size: 18px;
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
}
.hud-tot { color: var(--text-faint); font-size: 13px; }
.timer {
  font-size: 28px;
  font-weight: 700;
  color: var(--neon-cyan);
  text-shadow: var(--shadow-glow-cyan);
  letter-spacing: 2px;
  min-width: 92px;
  text-align: right;
  transition: color 120ms, text-shadow 120ms, transform 120ms;
}
.timer.low {
  color: var(--neon-yellow);
  text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
  animation: pulse 1s infinite;
}
.timer.penalty {
  color: var(--neon-red);
  text-shadow: 0 0 12px rgba(255, 85, 119, 0.7);
  transform: scale(1.08);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}

.playfield {
  position: relative;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 260px;
  min-height: 0;
}

.heap {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(0, 240, 255, 0.10), transparent 60%),
    repeating-linear-gradient(0deg, rgba(0, 240, 255, 0.04) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, rgba(0, 240, 255, 0.04) 0 1px, transparent 1px 24px),
    var(--bg-2);
  border-right: 1px solid var(--border);
}
.heap::after {
  /* a faint ground line at the bottom */
  content: '';
  position: absolute;
  left: 4%;
  right: 4%;
  bottom: 4px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  opacity: 0.5;
}

.tile {
  position: absolute;
  top: 0; left: 0;
  background: var(--bg-3);
  color: var(--text);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  padding: 9px 14px;
  font-family: var(--mono);
  font-size: 17px;
  letter-spacing: 0.5px;
  cursor: pointer;
  white-space: pre;
  user-select: none;
  transition:
    transform 380ms cubic-bezier(.34, 1.2, .64, 1),
    opacity 380ms ease,
    background 100ms,
    border-color 100ms,
    box-shadow 100ms,
    filter 380ms ease;
  box-shadow: 0 2px 0 rgba(0,0,0,0.5);
}
.tile:hover {
  background: var(--bg-2);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.35), 0 2px 0 rgba(0,0,0,0.5);
  z-index: 999 !important;
}
.tile.flying {
  pointer-events: none;
  transition:
    transform 400ms cubic-bezier(.55, .055, .675, .19),
    opacity 400ms ease;
}
.tile.shake.is-clean {
  background: rgba(255, 85, 119, 0.18);
  border-color: var(--neon-red);
  animation: shake 0.45s;
}
@keyframes shake {
  0%, 100% { translate: 0 0; }
  20% { translate: -4px 0; }
  40% { translate: 4px 0; }
  60% { translate: -3px 0; }
  80% { translate: 3px 0; }
}
.tile-text { display: inline-block; }

/* Vibrant tile colours — assigned by a hash of the word in main.js (never by
   messy/clean, so they never hint the answer). Scoped to :not(.revealing) so
   at round-end the tiles drop back to the dark base and the per-kind reveal
   glows read correctly. */
.heap:not(.revealing) .tile.tile-c0 { background: #ff7a6b; color: #24100f; border-color: #d85a4c; }
.heap:not(.revealing) .tile.tile-c1 { background: #ff9f43; color: #241809; border-color: #d97e26; }
.heap:not(.revealing) .tile.tile-c2 { background: #ffd23f; color: #241f0c; border-color: #d9ad1f; }
.heap:not(.revealing) .tile.tile-c3 { background: #7ed957; color: #16240f; border-color: #5cb838; }
.heap:not(.revealing) .tile.tile-c4 { background: #2ed9c3; color: #0f2421; border-color: #1fb3a0; }
.heap:not(.revealing) .tile.tile-c5 { background: #57b9ff; color: #0f1d24; border-color: #3494e0; }
.heap:not(.revealing) .tile.tile-c6 { background: #b18bff; color: #1b1424; border-color: #8f66e0; }
.heap:not(.revealing) .tile.tile-c7 { background: #ff77c2; color: #24101c; border-color: #e055a0; }

.bin-area {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 16px 8px;
  gap: 8px;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(255, 46, 146, 0.12), transparent 60%),
    var(--bg-1);
}
.magni-side {
  width: 110px;
  height: 110px;
  filter: drop-shadow(0 0 14px rgba(255, 196, 60, 0.32));
}
.bin {
  width: 180px;
  height: 220px;
  filter: drop-shadow(0 6px 0 rgba(0,0,0,0.5));
}
.bin-svg { width: 100%; height: 100%; overflow: visible; }
.bin-lid {
  transform-origin: 14px 50px;
  transition: transform 200ms cubic-bezier(.34, 1.4, .64, 1);
}
.bin.open .bin-lid {
  transform: rotate(-40deg) translateY(-4px);
}

.bubble {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-3);
  border: 1px solid var(--neon-magenta);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: 1px;
  opacity: 0;
  pointer-events: none;
  box-shadow: var(--shadow-glow-mag);
  transition: opacity 200ms ease, transform 200ms ease;
}
.bubble.show {
  opacity: 1;
  transform: translateX(-50%) translateY(-4px);
  animation: bubblePop 1.4s forwards;
}
@keyframes bubblePop {
  0%   { opacity: 0; transform: translateX(-50%) translateY(6px); }
  15%  { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  85%  { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-14px); }
}

/* =========================
   SCORE / GRADE primitives — used by the result panel below
   ========================= */
.score-grade {
  font-weight: 800;
  letter-spacing: 0;
}
.grade-s { color: var(--neon-yellow); text-shadow: 0 0 18px rgba(255, 215, 0, 0.6); }
.grade-a { color: var(--neon-green);  text-shadow: var(--shadow-glow-green); }
.grade-b { color: var(--neon-cyan);   text-shadow: var(--shadow-glow-cyan); }
.grade-c { color: var(--text); }
.grade-d { color: var(--neon-magenta); text-shadow: var(--shadow-glow-mag); }
.grade-f { color: var(--neon-red);    text-shadow: 0 0 14px rgba(255, 85, 119, 0.5); }
.pct-sym { font-size: 0.55em; color: var(--text-dim); margin-left: 4px; }

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* =========================
   REVEAL PHASE — heap stays in place, missed tiles light up by kind.
   ========================= */
.heap.revealing .tile { cursor: default; pointer-events: none; }

.tile.reveal-clean {
  opacity: 0.18;
  filter: grayscale(0.8);
}

.tile.reveal-messy {
  z-index: 500 !important;
  animation: tilePulse 1.6s ease-in-out infinite;
}

@keyframes tilePulse {
  0%, 100% { transform-origin: center; }
  50%      { filter: brightness(1.15); }
}

/* Per-kind colors — bright glow + matching border */
.tile.reveal-typo {
  background: rgba(255, 215, 0, 0.18);
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  box-shadow: 0 0 14px rgba(255, 215, 0, 0.55), 0 0 32px rgba(255, 215, 0, 0.25);
}
.tile.reveal-junk {
  background: rgba(255, 85, 119, 0.20);
  border-color: var(--neon-red);
  color: var(--neon-red);
  box-shadow: 0 0 14px rgba(255, 85, 119, 0.55), 0 0 32px rgba(255, 85, 119, 0.25);
}
.tile.reveal-off-topic {
  background: rgba(255, 46, 146, 0.20);
  border-color: var(--neon-magenta);
  color: var(--neon-magenta);
  box-shadow: 0 0 14px rgba(255, 46, 146, 0.55), 0 0 32px rgba(255, 46, 146, 0.25);
}
.tile.reveal-duplicate {
  background: rgba(0, 240, 255, 0.18);
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: 0 0 14px rgba(0, 240, 255, 0.55), 0 0 32px rgba(0, 240, 255, 0.25);
}
.tile.reveal-bad-format {
  background: rgba(0, 255, 156, 0.18);
  border-color: var(--neon-green);
  color: var(--neon-green);
  box-shadow: 0 0 14px rgba(0, 255, 156, 0.55), 0 0 32px rgba(0, 255, 156, 0.25);
}

/* Small "kind" badge beneath the tile text */
.tile-badge {
  display: block;
  margin-top: 4px;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid currentColor;
  color: inherit;
  text-align: center;
  white-space: nowrap;
  font-weight: 600;
}

/* =========================
   RESULT PANEL — replaces the bin area at round end
   ========================= */
.bin-area.show-result {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(0, 255, 156, 0.10), transparent 70%),
    var(--bg-1);
  justify-content: flex-start;
  padding: 18px 12px;
  gap: 10px;
}
.result-panel {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.result-magni {
  width: 90px;
  height: 90px;
  filter: drop-shadow(0 0 14px rgba(255, 196, 60, 0.32));
}
.result-magni.cheer {
  filter: drop-shadow(0 0 18px rgba(255, 196, 60, 0.5));
  animation: bob 1.2s ease-in-out infinite;
}
.result-headline {
  font-size: 15px;
  letter-spacing: 3px;
  color: var(--neon-cyan);
  text-shadow: var(--shadow-glow-cyan);
}
.result-score {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 4px;
}
.result-score .score-grade {
  font-size: 56px;
  line-height: 0.9;
  font-weight: 800;
}
.result-score .score-pct {
  font-size: 30px;
  color: var(--text);
}
.result-meta {
  color: var(--text-dim);
  font-size: 12px;
  text-align: center;
}
.result-stats {
  list-style: none;
  padding: 0;
  margin: 8px 0 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
  width: 100%;
  max-width: 220px;
}
.result-stats li {
  display: flex;
  justify-content: space-between;
  color: var(--text-dim);
  font-size: 12px;
}
.result-stats strong { color: var(--neon-green); font-weight: 600; }
.result-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  align-items: stretch;
  margin-top: 10px;
}
.result-actions .btn-primary,
.result-actions .btn-ghost {
  width: 100%;
  text-align: center;
}

/* =========================
   Responsive tweaks
   ========================= */
@media (max-width: 720px) {
  .screen-menu {
    grid-template-columns: 1fr;
    grid-template-areas:
      "brand"
      "magni"
      "card"
      "actions"
      "howto";
  }
  .menu-magni { width: 100px; height: 100px; justify-self: center; }

  .playfield { grid-template-columns: 1fr 160px; }
  .bin { width: 130px; height: 160px; }
  .magni-side { width: 70px; height: 70px; }
  .tile { font-size: 12px; padding: 4px 8px; }
  .timer { font-size: 22px; min-width: 70px; }
  .hud-left { gap: 12px; }
  .hud-val { font-size: 15px; }
}

/* Mobile fit — keep the whole play area within the phone width */
@media (max-width: 820px) {
  html, body { overflow-x: hidden; }
  .screen-play { max-width: 100%; }
  .hud { padding: 8px 10px; gap: 8px; }
  .hud-left { gap: 10px; }
  .hud-key { font-size: 9px; }
  .hud-val { font-size: 14px; }
  .hud-right { gap: 6px; }
  .timer { min-width: 60px; font-size: 22px; }
  .btn-ghost-sm { padding: 5px 8px; font-size: 11px; }
  .playfield { grid-template-columns: 1fr 122px; }
  .bin { width: 100px; height: 126px; }
  .magni-side { width: 52px; height: 52px; }
}

  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script>
/* ==== words.js ==== */
// Scrub the Data Mess — word data
// Each "round" generates a heap mixing CLEAN data terms with MESSY items
// (misspellings, duplicates, junk symbols, off-topic words, bad formatting).

const CLEAN_TERMS = [
  'mean', 'median', 'mode', 'average', 'variance', 'stddev',
  'histogram', 'scatter', 'boxplot', 'heatmap', 'pareto', 'sparkline',
  'dashboard', 'KPI', 'metric', 'dimension', 'measure', 'segment',
  'regression', 'cluster', 'forecast', 'outlier', 'correlation', 'baseline',
  'schema', 'table', 'column', 'row', 'index', 'primary key',
  'query', 'filter', 'pivot', 'join', 'group by', 'aggregate',
  'pipeline', 'ingest', 'normalize', 'cleanse', 'enrich', 'transform',
  'sample', 'cohort', 'funnel', 'session', 'event', 'conversion',
  'percentile', 'quartile', 'median', 'rolling avg', 'z-score', 'p-value'
];

// Misspellings keyed by their canonical clean term — these are MESSY.
const MISSPELLINGS = {
  'mean':         ['meen', 'maen'],
  'median':       ['meedian', 'medain', 'medien'],
  'mode':         ['moed'],
  'average':      ['averege', 'avrage', 'avarage'],
  'variance':     ['varience', 'varriance'],
  'stddev':       ['stdev', 'st dev'],
  'histogram':    ['histgoram', 'histograam', 'histagram'],
  'scatter':      ['scatterr', 'sccater', 'scater'],
  'boxplot':      ['boxplt', 'boxpot'],
  'heatmap':      ['heetmap', 'heatmep'],
  'dashboard':    ['dashbord', 'dashboarrd', 'dashbaord'],
  'metric':       ['mertic', 'mettric'],
  'dimension':    ['dimention', 'dimmension'],
  'regression':   ['regresion', 'regressionn', 'regretion'],
  'cluster':      ['cluser', 'clustar'],
  'forecast':     ['forcast', 'forecaste'],
  'outlier':      ['outliar', 'outlyer'],
  'correlation':  ['corelation', 'correlationn', 'corellation'],
  'schema':       ['shema', 'schemma'],
  'query':        ['querie', 'qury'],
  'pivot':        ['pivt', 'pivott'],
  'pipeline':     ['pipline', 'pippeline'],
  'cleanse':      ['clense', 'cleens'],
  'percentile':   ['precentile', 'percentil'],
  'quartile':     ['quartille', 'quartil'],
  'p-value':      ['pvalue', 'p value'],
  'z-score':      ['zscore', 'z score'],
  'baseline':     ['basline', 'baseliine'],
  'aggregate':    ['agregate', 'aggreggate'],
  'normalize':    ['normalise', 'normilize'],
  'conversion':   ['convertion', 'convertsion'],
};

// Pure junk — never valid.
const JUNK = [
  '###', '???', '<<<', '>>>', '***',
  'NaN', 'null', 'undefined', 'NULL', '404', '<error>',
  '%%%', '&&&', '!!!', '...', '@@@', '~~~',
  '0x00', 'tbd', 'TODO', 'fixme', 'lorem'
];

// Off-topic words that don't belong in a data-terms heap.
const OFF_TOPIC = [
  'banana', 'potato', 'lunch', 'weekend', 'unicorn', 'sneaker',
  'pancake', 'pirate', 'wizard', 'goblin', 'pickle', 'dragon',
  'mango', 'kazoo', 'tofu', 'sandal', 'pebble', 'noodle',
  'cactus', 'walrus', 'penguin', 'koala', 'biscuit'
];

// Bad formatting variants: derived from clean terms.
function badFormat(term) {
  const variants = [
    `${term}!!!`,
    `${term}  `,
    `  ${term}`,
    term.split('').map((c, i) => i % 2 ? c.toUpperCase() : c.toLowerCase()).join(''),
    term.toUpperCase() + '?',
    term + '_' + term,
    term.replaceAll(' ', '_') + '__',
  ];
  return variants[Math.floor(Math.random() * variants.length)];
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Build a heap of items for a round.
 *
 * @param {object} opts
 * @param {number} opts.total       Total number of items in the heap.
 * @param {number} opts.messyRatio  Fraction of items that are messy (0–1).
 * @returns {{items: Array<{id:string, text:string, messy:boolean, reason?:string}>, totalMessy:number}}
 */
function buildHeap({ total, messyRatio }) {
  const messyTarget = Math.round(total * messyRatio);
  const cleanTarget = total - messyTarget;

  const items = [];
  let nextId = 0;
  const usedClean = new Set();

  // 1) Clean terms — unique within the heap.
  const cleanPool = shuffle(CLEAN_TERMS);
  for (let i = 0; i < cleanTarget && i < cleanPool.length; i++) {
    const term = cleanPool[i];
    usedClean.add(term);
    items.push({ id: `i${nextId++}`, text: term, messy: false });
  }

  // 2) Messy items — distribute across categories.
  // Roughly: 35% misspellings, 20% duplicates of clean terms, 20% junk,
  // 15% off-topic, 10% bad formatting.
  const distribution = [
    { kind: 'misspell', weight: 0.35 },
    { kind: 'dup',      weight: 0.20 },
    { kind: 'junk',     weight: 0.20 },
    { kind: 'offtopic', weight: 0.15 },
    { kind: 'badfmt',   weight: 0.10 },
  ];

  const usedMessy = new Set();

  function pushMessy(kind) {
    let text, reason;
    if (kind === 'misspell') {
      // Pick a term that has misspellings, prefer ones already in the heap (more "discoverable").
      const candidates = Object.keys(MISSPELLINGS);
      const term = pick(candidates);
      text = pick(MISSPELLINGS[term]);
      reason = `misspelled "${term}"`;
    } else if (kind === 'dup') {
      // Duplicate of a clean term that's already in the heap.
      const inHeap = [...usedClean];
      if (!inHeap.length) return pushMessy('junk');
      const term = pick(inHeap);
      text = term;
      reason = 'duplicate';
    } else if (kind === 'junk') {
      text = pick(JUNK);
      reason = 'junk';
    } else if (kind === 'offtopic') {
      text = pick(OFF_TOPIC);
      reason = 'not a data term';
    } else {
      const term = pick(CLEAN_TERMS);
      text = badFormat(term);
      reason = 'bad formatting';
    }
    // Avoid the exact same messy item appearing twice unless it's a duplicate-kind.
    if (kind !== 'dup' && usedMessy.has(text)) return false;
    usedMessy.add(text);
    items.push({ id: `i${nextId++}`, text, messy: true, reason });
    return true;
  }

  let placed = 0;
  let safety = messyTarget * 6;
  while (placed < messyTarget && safety-- > 0) {
    // Weighted random pick.
    const r = Math.random();
    let acc = 0, chosen = distribution[0].kind;
    for (const d of distribution) {
      acc += d.weight;
      if (r <= acc) { chosen = d.kind; break; }
    }
    if (pushMessy(chosen) !== false) placed++;
  }

  // Final shuffle so messy items aren't grouped at the end.
  const shuffled = shuffle(items);
  return { items: shuffled, totalMessy: shuffled.filter(i => i.messy).length };
}


/* ==== sound.js ==== */
// Scrub the Data Mess — synthesized SFX (Web Audio, no assets).
// Square + triangle waves and short noise bursts for trash whooshes.
// Mute state persists in localStorage.

let ctx = null;
let muted = readMuted();

function readMuted() {
  try { return localStorage.getItem('datacruise.scrub.muted') === '1'; }
  catch { return false; }
}

function writeMuted() {
  try { localStorage.setItem('datacruise.scrub.muted', muted ? '1' : '0'); }
  catch { /* ignore */ }
}

function getCtx() {
  if (muted) return null;
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function tone({ freq, dur = 0.10, type = 'square', vol = 0.14, slide = 0, attack = 0.004, when = 0 }) {
  const c = getCtx();
  if (!c) return;
  const t0 = c.currentTime + when;
  const t1 = t0 + dur;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) {
    const endFreq = Math.max(20, freq + slide);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t1);
  }
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, t1);
  osc.connect(gain).connect(c.destination);
  osc.start(t0);
  osc.stop(t1 + 0.02);
}

function noiseBurst({ dur = 0.08, vol = 0.10, when = 0, cutoff = 1500 }) {
  const c = getCtx();
  if (!c) return;
  const t0 = c.currentTime + when;
  const samples = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, samples, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < samples; i++) data[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource();
  src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = cutoff;
  const gain = c.createGain();
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter).connect(gain).connect(c.destination);
  src.start(t0);
  src.stop(t0 + dur + 0.02);
}

const sfx = {
  // Picking up an item (subtle blip).
  pick() {
    tone({ freq: 880, dur: 0.04, type: 'square', vol: 0.08 });
  },
  // Trashing a messy item — whoosh + clunk.
  trash() {
    noiseBurst({ dur: 0.18, vol: 0.10, cutoff: 1200 });
    tone({ freq: 320, dur: 0.08, type: 'triangle', vol: 0.16, when: 0.10 });
    tone({ freq: 180, dur: 0.10, type: 'square',  vol: 0.13, when: 0.14, slide: -60 });
  },
  // Wrong — trashed a clean term.
  wrong() {
    tone({ freq: 280, dur: 0.18, type: 'sawtooth', vol: 0.16, slide: -120 });
    noiseBurst({ dur: 0.10, vol: 0.06, cutoff: 700, when: 0.03 });
  },
  // Timer tick under 10s.
  tick() {
    tone({ freq: 1200, dur: 0.03, type: 'square', vol: 0.06 });
  },
  // Streak milestone (e.g., 5 in a row).
  streak() {
    tone({ freq: 988, dur: 0.08, type: 'square', vol: 0.13 });
    tone({ freq: 1318, dur: 0.10, type: 'square', vol: 0.13, when: 0.05 });
  },
  // Time's up.
  timeout() {
    [440, 370, 294, 220].forEach((f, i) => {
      tone({ freq: f, dur: 0.18, type: 'sawtooth', vol: 0.14, when: i * 0.10 });
    });
  },
  // Round complete — bright fanfare.
  win() {
    [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => {
      tone({ freq: f, dur: 0.18, type: 'triangle', vol: 0.18, when: i * 0.09 });
    });
  },
  // Round complete with imperfect score — softer cadence.
  done() {
    [659, 784, 1047].forEach((f, i) => {
      tone({ freq: f, dur: 0.18, type: 'triangle', vol: 0.16, when: i * 0.10 });
    });
  },
  // Button click in menus.
  click() {
    tone({ freq: 520, dur: 0.05, type: 'square', vol: 0.10 });
  },
};

function isMuted() { return muted; }

function toggleMuted() {
  muted = !muted;
  writeMuted();
  if (muted && ctx) {
    try { ctx.suspend(); } catch {}
  } else if (!muted && ctx) {
    try { ctx.resume(); } catch {}
  }
  return muted;
}

/* ==== main.js ==== */
// Scrub the Data Mess — game controller.
// The heap is rendered as absolutely-positioned word tiles in a triangular envelope.
// Click a messy tile -> flies into the bin. Click a clean tile -> shakes + time penalty.


const CLEAN_SET = new Set(CLEAN_TERMS);

const DIFFICULTIES = {
  easy:   { label: 'EASY',   total: 22, messyRatio: 0.40, seconds: 40, wrongPenalty: 2 },
  medium: { label: 'MEDIUM', total: 32, messyRatio: 0.45, seconds: 30, wrongPenalty: 3 },
  hard:   { label: 'HARD',   total: 44, messyRatio: 0.50, seconds: 20, wrongPenalty: 4 },
};

const state = {
  screen: 'menu',       // 'menu' | 'play'
  phase: 'live',        // 'live' | 'reveal'  — only meaningful on screen=play
  difficulty: 'medium',
  items: [],
  totalMessy: 0,
  trashedMessy: 0,
  wrongClicks: 0,
  streak: 0,
  timeLeft: 0,
  timerId: null,
  startedAt: 0,
  endReason: '',        // 'time' | 'clean' | 'manual'
};

const $app = document.getElementById('app');

// ---------- rendering ----------

function render() {
  if (state.screen === 'menu') return renderMenu();
  if (state.screen === 'play') return renderPlay();
}

function renderMenu() {
  const muteLabel = isMuted() ? '🔇 SOUND OFF' : '🔊 SOUND ON';
  $app.innerHTML = `
    <div class="screen screen-menu">
      <header class="brand">
        <div class="brand-tag">DataCruise · Word Games · #04</div>
        <h1 class="title">SCRUB THE DATA <span class="accent">MESS</span></h1>
        <p class="subtitle">Toss the typos, dupes, junk and off-topic words into the bin. Save the clean data.</p>
      </header>

      <div class="menu-magni" aria-hidden="true">${beeSvg({ mood: 'smirk' })}</div>

      <section class="card">
        <div class="card-label">SELECT DIFFICULTY</div>
        <div class="diff-row">
          ${Object.entries(DIFFICULTIES).map(([key, d]) => `
            <button class="diff-btn ${state.difficulty === key ? 'on' : ''}" data-diff="${key}">
              <span class="diff-name">${d.label}</span>
              <span class="diff-meta">${d.total} words · ${d.seconds}s · -${d.wrongPenalty}s err</span>
            </button>
          `).join('')}
        </div>
      </section>

      <div class="actions">
        <button class="btn-primary" id="startBtn">▶ START SCRUB</button>
        <button class="btn-ghost" id="muteBtn">${muteLabel}</button>
      </div>

      <section class="howto">
        <div class="howto-title">HOW TO PLAY</div>
        <ul>
          <li>Click any <span class="t-messy">messy</span> item to fling it into the bin.</li>
          <li>Messy = misspellings, duplicates, junk symbols, off-topic, bad formatting.</li>
          <li>Trashing a <span class="t-clean">clean</span> word costs time.</li>
          <li>Score = % of messy items you trash before the timer ends.</li>
        </ul>
      </section>
    </div>
  `;

  $app.querySelectorAll('[data-diff]').forEach(el => {
    el.addEventListener('click', () => {
      state.difficulty = el.dataset.diff;
      sfx.click();
      render();
    });
  });
  $app.querySelector('#startBtn').addEventListener('click', () => { sfx.click(); startGame(); });
  $app.querySelector('#muteBtn').addEventListener('click', () => { toggleMuted(); sfx.click(); render(); });
}

function renderPlay() {
  const muteLabel = isMuted() ? '🔇' : '🔊';
  $app.innerHTML = `
    <div class="screen screen-play">
      <header class="hud">
        <div class="hud-left">
          <div class="hud-stat">
            <span class="hud-key">TRASHED</span>
            <span class="hud-val" id="hudTrashed">${state.trashedMessy}<span class="hud-tot">/${state.totalMessy}</span></span>
          </div>
          <div class="hud-stat">

      <main class="playfield" id="playfield">

        <div class="bin-area">

      <div class="bubble" id="bubble">scrub the mess →</div>

  `;

  $app.querySelector('#muteBtnPlay').addEventListener('click', () => {
    toggleMuted();
    sfx.click();
    $app.querySelector('#muteBtnPlay').textContent = isMuted() ? '🔇' : '🔊';
  });
  $app.querySelector('#quitBtn').addEventListener('click', () => {
    sfx.click();
    stopTimer();
    state.screen = 'menu';
    render();
  });

  layoutHeap();
}

// At round end we stay on the play screen and replace the bin-area DOM
// with a results panel, while remaining tiles light up in their kind-colors.
function renderResultPanel() {
  const total = state.totalMessy || 1;
  const pct = Math.round((state.trashedMessy / total) * 100);
  const grade = pct >= 95 ? 'S' : pct >= 85 ? 'A' : pct >= 70 ? 'B' : pct >= 50 ? 'C' : pct >= 25 ? 'D' : 'F';
  const cheer = pct >= 70;
  const headline =
    state.endReason === 'clean' ? 'HEAP CLEARED' :
    state.endReason === 'time'  ? "TIME'S UP"   : 'ROUND ENDED';

  return `
    <div class="result-panel">
      <div class="result-magni ${cheer ? 'cheer' : ''}" aria-hidden="true">
        ${beeSvg({ mood: cheer ? 'cheer' : 'frown' })}
      </div>
      <div class="result-headline">${headline}</div>
      <div class="result-score">
        <div class="score-grade grade-${grade.toLowerCase()}">${grade}</div>
        <div class="score-pct">${pct}<span class="pct-sym">%</span></div>
      </div>
      <div class="result-meta">${state.trashedMessy} of ${state.totalMessy} messy binned</div>
      <ul class="result-stats">
        <li><span>Mistakes</span><strong>${state.wrongClicks}</strong></li>
        <li><span>Best streak</span><strong>${state.bestStreak || 0}</strong></li>
      </ul>
      <div class="result-actions">
        <button class="btn-primary" id="againBtn">▶ NEW HEAP</button>
        <button class="btn-ghost" id="menuBtn">MENU</button>
      </div>
    </div>
  `;
}

// ---------- heap layout ----------

function layoutHeap() {
  const heap = document.getElementById('heap');
  if (!heap) return;
  const rect = heap.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;

  // Layout items in rows, narrower at the top (mountain shape).
  // We sort items by length so wider tiles tend to sit on lower rows.
  const sorted = [...state.items].sort((a, b) => b.text.length - a.text.length);
  const n = sorted.length;
  // More rows = a taller mountain. Use up the available vertical space.
  const rows = Math.max(5, Math.ceil(Math.sqrt(n * 1.4)));
  const bottomPadding = 12;
  const rowHeight = Math.max(56, (H - bottomPadding * 2) / rows);

  // Distribute items across rows — more on the bottom rows.
  // Bottom-heavy weighting: row i (from top, 0..rows-1) gets count proportional to (i+1).
  const weights = [];
  let totalW = 0;
  for (let i = 0; i < rows; i++) { weights[i] = (i + 1); totalW += weights[i]; }
  const rowCounts = weights.map(w => Math.max(1, Math.round(n * w / totalW)));
  // Adjust to match n exactly.
  let diff = n - rowCounts.reduce((a, b) => a + b, 0);
  let idx = rows - 1;
  while (diff !== 0) {
    rowCounts[idx] += Math.sign(diff);
    idx = (idx - 1 + rows) % rows;
    diff = n - rowCounts.reduce((a, b) => a + b, 0);
  }

  heap.innerHTML = '';
  let cursor = 0;
  for (let r = 0; r < rows; r++) {
    const count = rowCounts[r];
    // Row r from top: row 0 = peak (narrowest), row rows-1 = base (widest).
    const yFromBottom = (rows - 1 - r) * rowHeight + bottomPadding;
    const top = H - yFromBottom - rowHeight;

    // Width shrinks toward the top.
    const widthFrac = 0.45 + 0.55 * (r / Math.max(1, rows - 1));
    const rowWidth = W * widthFrac;
    const xStart = (W - rowWidth) / 2;
    const slot = rowWidth / count;

    for (let k = 0; k < count; k++) {
      const item = sorted[cursor++];
      if (!item) break;
      const jitterX = (Math.random() - 0.5) * Math.min(18, slot * 0.45);
      const jitterY = (Math.random() - 0.5) * 10;
      const rot = (Math.random() - 0.5) * 14;
      const x = xStart + slot * k + slot / 2 + jitterX;
      const y = top + jitterY;

      const tile = document.createElement('button');
      // Colour each tile from a hash of its TEXT — vibrant "paper scrap" look,
      // deliberately NOT tied to messy/clean so it never hints the answer.
      let _h = 0;
      for (let k = 0; k < item.text.length; k++) _h = (_h * 31 + item.text.charCodeAt(k)) >>> 0;
      tile.className = 'tile tile-c' + (_h % 8);
      tile.type = 'button';
      tile.dataset.id = item.id;
      tile.style.transform = `translate(${x}px, ${y}px) translate(-50%, 0) rotate(${rot}deg)`;
      tile.style.zIndex = String(100 + r);
      tile.innerHTML = `<span class="tile-text">${escapeHtml(item.text)}</span>`;
      tile.addEventListener('click', (e) => handleTileClick(e, item));
      heap.appendChild(tile);
    }
  }

  // If we relayout during reveal (e.g. window resize), re-apply reveal styling.
  if (state.phase === 'reveal') revealHeap();
}

function escapeHtml(s) {
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    // Preserve leading/trailing spaces visibly:
    .replace(/^ /, ' ')
    .replace(/ $/, ' ');
}

// ---------- gameplay ----------

// An item is "messy to click NOW" if:
//   - its text is not a canonical clean data term (typos, junk, off-topic, bad-format), OR
//   - there are still other tiles with the same text in the heap (an excess copy).
// Once only one copy of a clean term remains, clicking it is wrong.
function isMessyNow(item) {
  if (!CLEAN_SET.has(item.text)) return true;
  const copies = state.items.filter(it => it.text === item.text).length;
  return copies > 1;
}

function handleTileClick(e, item) {
  if (state.screen !== 'play' || state.phase !== 'live') return;
  const tile = e.currentTarget;
  if (tile.classList.contains('flying') || tile.classList.contains('gone')) return;

  if (isMessyNow(item)) {
    sfx.pick();
    flyToBin(tile);
    state.items = state.items.filter(it => it.id !== item.id);
    state.trashedMessy++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak || 0, state.streak);
    if (state.streak > 0 && state.streak % 5 === 0) {
      sfx.streak();
      showBubble(`STREAK ×${state.streak}`);
    }
    updateHud();
    openBinBriefly();
    // Round end if all messy gone.
    if (state.trashedMessy >= state.totalMessy) {
      state.endReason = 'clean';
      finishRound();
    }
  } else {
    sfx.wrong();
    tile.classList.add('shake', 'is-clean');
    setTimeout(() => tile.classList.remove('shake', 'is-clean'), 500);
    state.wrongClicks++;
    state.streak = 0;
    const penalty = DIFFICULTIES[state.difficulty].wrongPenalty;
    state.timeLeft = Math.max(0, state.timeLeft - penalty);
    showBubble(`✗ "${item.text}" is clean   -${penalty}s`);
    flashTimer();
    updateHud();
    if (state.timeLeft <= 0) {
      state.endReason = 'time';
      finishRound();
    }
  }
}

function flyToBin(tile) {
  const bin = document.getElementById('bin');
  if (!bin) { tile.classList.add('gone'); return; }
  const tRect = tile.getBoundingClientRect();
  const bRect = bin.getBoundingClientRect();
  // Aim for the bin opening (top portion of the bin).
  const targetX = bRect.left + bRect.width / 2;
  const targetY = bRect.top + bRect.height * 0.25;
  const dx = targetX - (tRect.left + tRect.width / 2);
  const dy = targetY - (tRect.top + tRect.height / 2);

  // Preserve existing transform values by replacing rotate and chaining.
  const existing = tile.style.transform;
  tile.classList.add('flying');
  // Sequence: tile keeps its absolute placement, then we transition translate via a CSS variable.
  tile.style.setProperty('--fly-x', `${dx}px`);
  tile.style.setProperty('--fly-y', `${dy}px`);
  tile.style.transform = `${existing} translate(var(--fly-x), var(--fly-y)) scale(0.2) rotate(720deg)`;
  tile.style.opacity = '0';

  setTimeout(() => {
    sfx.trash();
  }, 220);
  setTimeout(() => {
    tile.classList.add('gone');
    tile.remove();
  }, 420);
}

function openBinBriefly() {
  const bin = document.getElementById('bin');
  if (!bin) return;
  bin.classList.add('open');
  clearTimeout(bin._closeTimer);
  bin._closeTimer = setTimeout(() => bin.classList.remove('open'), 280);
}

function flashTimer() {
  const t = document.getElementById('timer');
  if (!t) return;
  t.classList.add('penalty');
  setTimeout(() => t.classList.remove('penalty'), 350);
}

function showBubble(text) {
  const b = document.getElementById('bubble');
  if (!b) return;
  b.textContent = text;
  b.classList.remove('show');
  void b.offsetWidth; // restart animation
  b.classList.add('show');
}

function updateHud() {
  const t = document.getElementById('hudTrashed');
  const w = document.getElementById('hudWrong');
  const s = document.getElementById('hudStreak');
  if (t) t.innerHTML = `${state.trashedMessy}<span class="hud-tot">/${state.totalMessy}</span>`;
  if (w) w.textContent = String(state.wrongClicks);
  if (s) s.textContent = String(state.streak);
}

function startGame() {
  const cfg = DIFFICULTIES[state.difficulty];
  const heap = buildHeap({ total: cfg.total, messyRatio: cfg.messyRatio });
  state.items = heap.items;
  // Recompute totalMessy to match the click logic: every item is messy except
  // one canonical clean copy per distinct CLEAN_TERMS text appearing in the heap.
  const distinctClean = new Set(
    state.items.filter(it => CLEAN_SET.has(it.text)).map(it => it.text)
  );
  state.totalMessy = state.items.length - distinctClean.size;
  state.trashedMessy = 0;
  state.wrongClicks = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.timeLeft = cfg.seconds;
  state.startedAt = Date.now();
  state.endReason = '';
  state.screen = 'play';
  state.phase = 'live';
  render();
  startTimer();
}

function startTimer() {
  stopTimer();
  state.timerId = setInterval(() => {
    state.timeLeft = Math.max(0, state.timeLeft - 1);
    const el = document.getElementById('timer');
    if (el) {
      el.textContent = formatTime(state.timeLeft);
      el.classList.toggle('low', state.timeLeft <= 10);
    }
    if (state.timeLeft <= 10 && state.timeLeft > 0) sfx.tick();
    if (state.timeLeft <= 0) {
      state.endReason = 'time';
      finishRound();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerId) {
    clearInterval(state.timerId);
    state.timerId = null;
  }
}

function finishRound() {
  stopTimer();
  state.missed = collectMissed();
  state.phase = 'reveal';
  if (state.endReason === 'time') sfx.timeout();
  else if (state.trashedMessy === state.totalMessy && state.wrongClicks === 0) sfx.win();
  else sfx.done();

  {
    const total = state.totalMessy || 1;
    const pct = Math.round((state.trashedMessy / total) * 100);
    const grade = pct >= 95 ? 'S' : pct >= 85 ? 'A' : pct >= 70 ? 'B' : pct >= 50 ? 'C' : pct >= 25 ? 'D' : 'F';
    window.DataCruiseResult && DataCruiseResult.ready({
      slug: 'scrub-mess', game: 'Scrub the Data Mess',
      headline: pct + '%',
      sub: 'grade ' + grade + ' · data scrubbed',
      stars: pct >= 85 ? 3 : pct >= 70 ? 2 : pct > 0 ? 1 : 0, starsMax: 3,
    });
  }

  // Brief delay so any final trash animation finishes reading, then reveal in place.
  setTimeout(() => {
    revealHeap();
    swapBinForResult();
  }, 300);
}

// Light up every remaining tile with its kind class so the messy items pop
// against dimmed clean tiles. Mirrors collectMissed's duplicate logic.
function revealHeap() {
  const heap = document.getElementById('heap');
  if (!heap) return;
  heap.classList.add('revealing');
  const counts = state.items.reduce((m, it) => (m[it.text] = (m[it.text] || 0) + 1, m), {});
  const seenClean = new Set();

  for (const it of state.items) {
    const tile = heap.querySelector(`.tile[data-id="${it.id}"]`);
    if (!tile) continue;
    if (CLEAN_SET.has(it.text)) {
      if (counts[it.text] > 1 && seenClean.has(it.text)) {
        markTile(tile, 'duplicate', `×${counts[it.text]}`);
      } else if (counts[it.text] > 1) {
        seenClean.add(it.text);
        tile.classList.add('reveal-clean');
      } else {
        tile.classList.add('reveal-clean');
      }
    } else {
      const kind = classify(it);
      let hint = '';
      if (kind === 'typo') {
        const m = /^misspelled "(.+)"$/.exec(it.reason || '');
        if (m) hint = `→ ${m[1]}`;
      }
      markTile(tile, kind, hint);
    }
  }
}

function markTile(tile, kind, hint) {
  tile.classList.add('reveal-messy', `reveal-${cssKind(kind)}`);
  // Drop any existing badge if we're re-applying after a relayout.
  tile.querySelector('.tile-badge')?.remove();
  const badge = document.createElement('span');
  badge.className = `tile-badge tile-badge-${cssKind(kind)}`;
  badge.textContent = hint ? `${kind} ${hint}` : kind;
  tile.appendChild(badge);
}

function swapBinForResult() {
  const binArea = document.querySelector('.bin-area');
  if (!binArea) return;
  binArea.classList.add('show-result');
  binArea.innerHTML = renderResultPanel();
  binArea.querySelector('#againBtn')?.addEventListener('click', () => { sfx.click(); startGame(); });
  binArea.querySelector('#menuBtn')?.addEventListener('click', () => { sfx.click(); state.screen = 'menu'; render(); });
}

// Walk what's left on the heap and label each remaining messy item with a kind.
// Duplicates are paired with their canonical clean term.
function collectMissed() {
  const remaining = state.items;
  // Count copies per text so we can identify duplicates.
  const counts = remaining.reduce((m, it) => (m[it.text] = (m[it.text] || 0) + 1, m), {});
  // For duplicate clean texts (count > 1), keep one as "kept clean", flag the rest as duplicates.
  const seenClean = new Set();
  const missed = [];
  for (const it of remaining) {
    if (CLEAN_SET.has(it.text)) {
      if (counts[it.text] > 1 && seenClean.has(it.text)) {
        missed.push({ text: it.text, kind: 'duplicate', reason: it.reason || 'duplicate', count: counts[it.text] });
      } else if (counts[it.text] > 1) {
        // First copy of a duplicated clean term: this is the one the player would have kept.
        seenClean.add(it.text);
      }
      // Single copies of clean terms are not messy.
      continue;
    }
    // Non-canonical text — classify by reason if available.
    missed.push({ text: it.text, kind: classify(it), reason: it.reason || '' });
  }
  return missed;
}

function cssKind(k) { return String(k).replace(/[^a-z]+/gi, '-'); }

function classify(item) {
  const r = item.reason || '';
  if (r.startsWith('misspelled')) return 'typo';
  if (r === 'junk') return 'junk';
  if (r === 'not a data term') return 'off-topic';
  if (r === 'bad formatting') return 'bad format';
  if (r === 'duplicate') return 'duplicate';
  return 'messy';
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, '0')}`;
}

// Relayout heap when the window resizes during a round.
window.addEventListener('resize', () => {
  if (state.screen === 'play') layoutHeap();
});

render();

function _handleWatchAdContinue() {

  showRewardedAd(() => {
    state.phase = 'live';
            state.endReason = '';
            state.timeLeft = (state.timeLeft || 0) + 15;
            render();
            startTimer();
  });

  const seen = new WeakSet();
  const check = () => {
    if (!(state && state.screen === 'play' && state.phase === 'reveal' && state.endReason === 'time' && state.trashedMessy < state.totalMessy)) return;
    const actions = document.querySelector(".result-actions");
    if (!actions || seen.has(actions)) return;

document.addEventListener("click", function (e) {

  }

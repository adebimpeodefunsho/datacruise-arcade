<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="0.55" stop-color="#9265D8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="60" r="2"/>
    <circle cx="140" cy="50" r="1.5"/>
    <circle cx="380" cy="60" r="2.5"/>
    <circle cx="450" cy="90" r="2"/>
    <circle cx="60" cy="150" r="1.5"/>
    <circle cx="470" cy="170" r="1.5"/>
  </g>

  <!-- Sentence card -->
  <g transform="translate(256, 240)">
    <rect x="-215" y="-90" width="430" height="180" rx="16" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="3"/>
    <text x="-200" y="-58" font-family="Courier New, monospace" font-size="13" font-weight="900" fill="#6B3EB0" letter-spacing="1">$ bridge --sentence 1/5</text>

    <!-- Sentence 1: "A pie chart shows ____ of the whole." -->
    <text x="-200" y="-24" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1A1A1A">A pie chart shows</text>
    <g transform="translate(-8, -30)">
      <rect x="0" y="-4" width="76" height="30" rx="6" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="38" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1A1A1A">parts</text>
    </g>
    <text x="94" y="-24" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1A1A1A">of the whole.</text>

    <!-- Sentence 2: "A line chart tracks change ____ time." -->
    <text x="-200" y="18" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1A1A1A">A line chart tracks change</text>
    <g transform="translate(66, 12)">
      <rect x="0" y="-4" width="60" height="30" rx="6" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="30" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1A1A1A">over</text>
    </g>
    <text x="128" y="18" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1A1A1A">time.</text>

    <!-- Sentence 3: "Bars can be sorted ____ height." -->
    <text x="-200" y="60" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1A1A1A">Bars can be sorted</text>
    <g transform="translate(0, 54)">
      <rect x="0" y="-4" width="52" height="30" rx="6" fill="#FFF" stroke="#1A1A1A" stroke-width="2.5" stroke-dasharray="4 3"/>
      <text x="26" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#B0B0B0">___</text>
    </g>
    <text x="60" y="60" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1A1A1A">height.</text>
  </g>

  <!-- Word bank -->
  <g transform="translate(256, 400)">
    <rect x="-215" y="-24" width="430" height="70" rx="12" fill="#1A1A1A" opacity="0.8"/>
    <text x="-200" y="-4" font-family="Courier New, monospace" font-size="11" font-weight="900" fill="#FFC500" letter-spacing="1">bank $</text>
    <g transform="translate(-145, 20)">
      <rect x="-42" y="-16" width="84" height="30" rx="6" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFF">shows</text>
    </g>
    <g transform="translate(-55, 20)">
      <rect x="-30" y="-16" width="60" height="30" rx="6" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#1A1A1A">by</text>
    </g>
    <g transform="translate(20, 20)">
      <rect x="-32" y="-16" width="64" height="30" rx="6" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFF">into</text>
    </g>
    <g transform="translate(100, 20)">
      <rect x="-38" y="-16" width="76" height="30" rx="6" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFF">within</text>
    </g>
    <g transform="translate(180, 20)">
      <rect x="-30" y="-16" width="60" height="30" rx="6" fill="#9D62E0" stroke="#1A1A1A" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFF">for</text>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(256, 90)">
    <rect x="-220" y="-42" width="440" height="86" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">BRIDGE THE</text>
    <text x="0" y="24" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">DATA SENTENCE</text>
    <text x="0" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #3</text>
  </g>
</svg>

  <style>
/* ============================================================
   DataCruise Word Games — Bridge the Data Sentence
   Terminal / hacker aesthetic, matched to series
   ============================================================ */

:root {
  --bg-0: #06080c;
  --bg-1: #0a0e14;
  --bg-2: #11161f;
  --bg-3: #1a212e;
  --border: #1f2937;
  --border-hi: #2a3445;

  --neon-green: #00ff9c;
  --neon-cyan:  #00f0ff;
  --neon-magenta: #ff2e92;
  --neon-yellow: #ffd700;
  --neon-red: #ff5577;

  --text: #c9d1d9;
  --text-dim: #8b949e;
  --text-faint: #4a5260;

  --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'Consolas', monospace;

  --shadow-glow-green: 0 0 12px rgba(0, 255, 156, 0.45), 0 0 30px rgba(0, 255, 156, 0.15);
  --shadow-glow-cyan:  0 0 12px rgba(0, 240, 255, 0.45), 0 0 30px rgba(0, 240, 255, 0.15);
  --shadow-glow-mag:   0 0 12px rgba(255, 46, 146, 0.45), 0 0 30px rgba(255, 46, 146, 0.15);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(ellipse at top, rgba(0, 240, 255, 0.06), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(255, 46, 146, 0.05), transparent 60%),
    var(--bg-0);
  min-height: 100vh;
  min-height: 100dvh;
}

.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0) 0px,
    rgba(0, 0, 0, 0) 2px,
    rgba(0, 0, 0, 0.12) 3px,
    rgba(0, 0, 0, 0) 4px
  );
  mix-blend-mode: multiply;
  opacity: 0.5;
}

#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ============================================================
   Terminal frame
   ============================================================ */

.term {
  width: 100%;
  max-width: 820px;
  background: var(--bg-1);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  box-shadow:
    0 0 0 1px rgba(0, 240, 255, 0.08),
    0 20px 60px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}

.term-bar {
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-dim);
}

.term-bar .dots { display: flex; gap: 6px; }
.term-bar .dot { width: 11px; height: 11px; border-radius: 50%; background: #2a3445; }
.term-bar .dot.r { background: #ff5f56; }
.term-bar .dot.y { background: #ffbd2e; }
.term-bar .dot.g { background: #27c93f; }
.term-bar .path { margin-left: 10px; color: var(--text-faint); }

.term-body {
  padding: 22px 22px 26px;
}

/* ============================================================
   Header
   ============================================================ */

.hdr {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 18px;
  padding-bottom: 16px;
  border-bottom: 1px dashed var(--border-hi);
  margin-bottom: 18px;
}

.title {
  font-size: 20px;
  font-weight: 700;
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
  letter-spacing: 0.5px;
}
.title .prompt { color: var(--neon-cyan); margin-right: 8px; }
.title .series { color: var(--text-faint); font-weight: 400; font-size: 12px; display: block; margin-top: 2px; letter-spacing: 0; }

.hud {
  display: flex;
  gap: 16px;
  font-size: 13px;
  align-items: center;
}
.hud .stat { display: flex; flex-direction: column; align-items: flex-end; }
.hud .stat .lbl { color: var(--text-faint); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
.hud .stat .val { color: var(--neon-yellow); font-size: 18px; font-weight: 700; }
.hud .stat.timer .val.warn { color: var(--neon-magenta); animation: pulse 0.8s infinite; }

.mute-btn {
  background: transparent;
  border: 1px solid var(--border-hi);
  color: var(--text-dim);
  width: 36px;
  height: 36px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 16px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.mute-btn:hover {
  color: var(--neon-cyan);
  border-color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.06);
}

@keyframes pulse { 50% { opacity: 0.55; } }

/* ============================================================
   Sentence rows
   ============================================================ */

.sentences {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  transition: border-color 0.2s, background 0.3s;
}

.row-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.correction {
  margin-left: 30px;
  font-size: 13px;
  color: var(--text-dim);
  padding-top: 4px;
  border-top: 1px dashed rgba(255, 46, 146, 0.25);
}
.correction .corr-label {
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
  margin-right: 6px;
  font-weight: 700;
  letter-spacing: 0.5px;
  font-size: 11px;
  text-transform: uppercase;
}
.correction .corr-mid {
  color: var(--neon-green);
  font-weight: 700;
}

.banner {
  margin-bottom: 14px;
  padding: 10px 14px;
  background: rgba(255, 46, 146, 0.06);
  border: 1px solid rgba(255, 46, 146, 0.4);
  border-left-width: 3px;
  border-radius: 4px;
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}
.banner.banner-win {
  background: rgba(0, 255, 156, 0.06);
  border-color: var(--neon-green);
  color: var(--neon-green);
}

.row .num {
  color: var(--text-faint);
  font-size: 12px;
  margin-right: 4px;
  min-width: 22px;
}

.fixed {
  display: inline-block;
  padding: 6px 12px;
  background: transparent;
  color: var(--neon-cyan);
  font-weight: 700;
  text-shadow: var(--shadow-glow-cyan);
  font-size: 15px;
}

.slot {
  display: inline-block;
  min-width: 92px;
  min-height: 34px;
  padding: 6px 12px;
  background: var(--bg-1);
  border: 1px dashed var(--border-hi);
  border-radius: 4px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
}
.slot.empty { color: var(--text-faint); }
.slot.empty::before { content: '_____'; letter-spacing: 1px; }
.slot.filled {
  background: var(--bg-3);
  border-style: solid;
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.1);
}
.slot.filled:hover {
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  box-shadow: 0 0 0 1px rgba(255, 215, 0, 0.25);
}
.slot.filled.selected,
.slot.filled[data-selected="1"] {
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  background: rgba(255, 215, 0, 0.08);
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
}
.slot.target {
  border-color: var(--neon-yellow);
  background: rgba(255, 215, 0, 0.06);
}
/* Small × button inside a filled slot — single-answer reset. */
.slot-text { display: inline-block; vertical-align: middle; }
.slot-clear {
  display: inline-block;
  width: 18px;
  height: 18px;
  line-height: 14px;
  margin-left: 8px;
  padding: 0;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 50%;
  color: inherit;
  opacity: 0.55;
  cursor: pointer;
  font-family: inherit;
  vertical-align: middle;
  transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.slot-clear:hover {
  opacity: 1;
  background: rgba(255, 46, 146, 0.18);
  color: var(--neon-magenta);
  border-color: var(--neon-magenta);
  transform: scale(1.08);
}
.slot-clear:focus-visible {
  outline: 2px solid var(--neon-yellow);
  outline-offset: 2px;
}
/* Hide during review — round is over, can't change answers. */
.row.correct .slot-clear,
.row.wrong .slot-clear { display: none; }
.row.correct {
  background: rgba(0, 255, 156, 0.08);
  border-color: var(--neon-green);
}
.row.correct .slot.filled {
  border-color: var(--neon-green);
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
}
.row.wrong {
  background: rgba(255, 46, 146, 0.06);
  border-color: var(--neon-magenta);
}
.row.wrong .slot.filled {
  border-color: var(--neon-magenta);
  color: var(--neon-magenta);
}

/* ============================================================
   Word bank
   ============================================================ */

.bank-label {
  font-size: 11px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.bank-label .hint { color: var(--text-dim); text-transform: none; letter-spacing: 0; margin-left: 8px; }

.bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  min-height: 64px;
  margin-bottom: 18px;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.bank.return-target {
  border-style: dashed;
  border-color: var(--neon-yellow);
  background: rgba(255, 215, 0, 0.06);
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255, 215, 0, 0.15) inset;
}
.bank-empty {
  font-size: 12px;
  color: var(--text-faint);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin: auto;
}

.word {
  display: inline-block;
  padding: 8px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-hi);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: all 0.12s;
}
.word:hover {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  transform: translateY(-1px);
}
.word.selected {
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  background: rgba(255, 215, 0, 0.08);
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
  transform: translateY(-1px);
}

/* ============================================================
   Controls + result
   ============================================================ */

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
}

.btn {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 9px 18px;
  background: transparent;
  color: var(--neon-green);
  border: 1px solid var(--neon-green);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}
.btn:hover { background: rgba(0, 255, 156, 0.12); box-shadow: var(--shadow-glow-green); }
.btn.secondary { color: var(--text-dim); border-color: var(--border-hi); }
.btn.secondary:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.06); box-shadow: none; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:disabled:hover { background: transparent; box-shadow: none; }

.result {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--bg-2);
  border: 1px solid var(--border-hi);
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-dim);
}
.result.win { border-color: var(--neon-green); color: var(--neon-green); text-shadow: var(--shadow-glow-green); }
.result strong { color: var(--neon-yellow); }

/* ============================================================
   Mobile
   ============================================================ */

@media (max-width: 560px) {
  .term-body { padding: 16px 14px 20px; }
  .title { font-size: 17px; }
  .hud .stat .val { font-size: 16px; }
  .fixed, .slot, .word { font-size: 14px; padding: 6px 10px; }
  .slot { min-width: 78px; }
  .row { padding: 8px 10px; gap: 6px; }
}

/* Mobile fit — compress the round so all sentences + word bank fit */
@media (max-width: 820px) {
  html, body { overflow-x: hidden; }
  #app { padding: 6px; align-items: flex-start; }
  .term-body { padding: 10px 12px 12px; }
  .hdr { padding-bottom: 8px; margin-bottom: 8px; gap: 4px 12px; }
  .sentences { gap: 6px; margin-bottom: 8px; max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 2px; }
  .banner { padding: 8px 10px; font-size: 12px; }
  .row { padding: 6px 8px; gap: 3px; }
  .row-line { gap: 6px; }
  .fixed, .slot, .word { font-size: 13px; padding: 4px 8px; }
  .slot { min-width: 64px; }
  .bank { padding: 8px; min-height: 44px; margin-bottom: 8px; gap: 6px; }
  .controls { margin-top: 4px; gap: 8px; }
}

  </style>

<body>
  <div id="app" aria-live="polite"></div>
  <script>
/* ==== rounds.js ==== */
// Each sentence: first word, exactly 2 middle words, last word.
// Middle words must be unique WITHIN a round (otherwise placement is ambiguous).
// Order in the array = the correct sentence reading.

const ROUNDS = [
  {
    name: 'Round 1 · The Basics',
    seconds: 90,
    sentences: [
      { first: 'Data',     middles: ['paints', 'a'],            last: 'picture'   },
      { first: 'Charts',   middles: ['reveal', 'hidden'],       last: 'patterns'  },
      { first: 'Graphs',   middles: ['simplify', 'complex'],    last: 'ideas'     },
      { first: 'Insights', middles: ['drive', 'smart'],         last: 'decisions' },
      { first: 'Trends',   middles: ['shape', 'future'],        last: 'strategy'  },
    ],
  },
  {
    name: 'Round 2 · Chart Types',
    seconds: 90,
    sentences: [
      { first: 'Bar',     middles: ['charts', 'compare'],     last: 'values'      },
      { first: 'Line',    middles: ['graphs', 'track'],       last: 'change'      },
      { first: 'Pie',     middles: ['slices', 'show'],        last: 'share'       },
      { first: 'Maps',    middles: ['render', 'spatial'],     last: 'stories'     },
      { first: 'Color',   middles: ['highlights', 'key'],     last: 'differences' },
    ],
  },
  {
    name: 'Round 3 · The Toolkit',
    seconds: 90,
    sentences: [
      { first: 'Filters',    middles: ['reduce', 'visual'],     last: 'noise'     },
      { first: 'Outliers',   middles: ['demand', 'careful'],    last: 'attention' },
      { first: 'Dashboards', middles: ['summarize', 'daily'],   last: 'metrics'   },
      { first: 'Datasets',   middles: ['hide', 'deep'],         last: 'secrets'   },
      { first: 'Tooltips',   middles: ['explain', 'every'],     last: 'datum'     },
    ],
  },
];


/* ==== sound.js ==== */
// Bridge the Data Sentence — synthesized SFX (Web Audio, no assets).
// Matches the chiptune feel used elsewhere in the DataCruise Word Games series.

let ctx = null;
let muted = readMuted();

function readMuted() {
  try { return localStorage.getItem('datacruise.bridge.muted') === '1'; }
  catch { return false; }
}

function writeMuted() {
  try { localStorage.setItem('datacruise.bridge.muted', muted ? '1' : '0'); }
  catch { /* ignore */ }
}

function getCtx() {
  if (muted) return null;
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function tone({ freq, dur = 0.10, type = 'square', vol = 0.14, slide = 0, attack = 0.004, when = 0 }) {
  const c = getCtx();
  if (!c) return;
  const t0 = c.currentTime + when;
  const t1 = t0 + dur;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) {
    const endFreq = Math.max(20, freq + slide);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t1);
  }
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, t1);
  osc.connect(gain).connect(c.destination);
  osc.start(t0);
  osc.stop(t1 + 0.02);
}

const sfx = {
  pick() {
    tone({ freq: 660, dur: 0.05, type: 'square', vol: 0.09 });
  },
  place() {
    tone({ freq: 880, dur: 0.06, type: 'triangle', vol: 0.13 });
    tone({ freq: 1175, dur: 0.06, type: 'triangle', vol: 0.10, when: 0.04 });
  },
  returnToBank() {
    tone({ freq: 520, dur: 0.06, type: 'square', vol: 0.08, slide: -120 });
  },
  shuffle() {
    [600, 800, 700, 900].forEach((f, i) => {
      tone({ freq: f, dur: 0.04, type: 'square', vol: 0.08, when: i * 0.035 });
    });
  },
  submit() {
    tone({ freq: 880, dur: 0.05, type: 'square', vol: 0.10 });
    tone({ freq: 1320, dur: 0.07, type: 'triangle', vol: 0.12, when: 0.04 });
  },
  correctRow(i = 0) {
    const base = 523 + i * 60;
    tone({ freq: base, dur: 0.14, type: 'triangle', vol: 0.16 });
    tone({ freq: base * 1.5, dur: 0.14, type: 'triangle', vol: 0.12, when: 0.05 });
  },
  wrongRow() {
    tone({ freq: 280, dur: 0.18, type: 'sawtooth', vol: 0.12, slide: -120 });
  },
  win() {
    [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => {
      tone({ freq: f, dur: 0.18, type: 'triangle', vol: 0.18, when: i * 0.09 });
    });
  },
  partial() {
    [523, 659, 784].forEach((f, i) => {
      tone({ freq: f, dur: 0.16, type: 'triangle', vol: 0.16, when: i * 0.10 });
    });
  },
  timeout() {
    [440, 370, 294, 220].forEach((f, i) => {
      tone({ freq: f, dur: 0.18, type: 'sawtooth', vol: 0.13, when: i * 0.10 });
    });
  },
  gameover() {
    [1047, 1319, 1568, 2093].forEach((f, i) => {
      tone({ freq: f, dur: 0.22, type: 'triangle', vol: 0.18, when: i * 0.13 });
    });
  },
};

function isMuted() { return muted; }

function toggleMuted() {
  muted = !muted;
  writeMuted();
  if (muted && ctx) {
    try { ctx.suspend(); } catch {}
  } else if (!muted && ctx) {
    try { ctx.resume(); } catch {}
  }
  return muted;
}


/* ==== main.js ==== */

const app = document.getElementById('app');

const state = {
  roundIndex: 0,
  totalScore: 0,
  timeLeft: 0,
  sentences: [],
  bank: [],
  selectedWordId: null,
  status: 'playing',
  lastRoundResult: null,
  timer: null,
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startRound(idx) {
  const round = ROUNDS[idx];
  state.roundIndex = idx;
  state.timeLeft = round.seconds;
  state.status = 'playing';
  state.selectedWordId = null;
  state.lastRoundResult = null;
  state.sentences = round.sentences.map((s, i) => ({
    ...s,
    slots: s.middles.map(() => null),
    rowId: i,
  }));
  let wid = 0;
  const allMiddles = [];
  state.sentences.forEach((s) => {
    s.middles.forEach((w) => {
      allMiddles.push({ id: `w${wid++}`, text: w, location: 'bank' });
    });
  });
  state.bank = shuffle(allMiddles);
  if (state.timer) clearInterval(state.timer);
  state.timer = setInterval(tick, 1000);
  render();
}

function tick() {
  if (state.status !== 'playing') return;
  state.timeLeft -= 1;
  if (state.timeLeft <= 0) {
    state.timeLeft = 0;
    submitRound(true);
  } else {
    render();
  }
}

function findWord(id) {
  const inBank = state.bank.find((w) => w.id === id);
  if (inBank) return { word: inBank, in: 'bank' };
  for (const s of state.sentences) {
    for (let i = 0; i < s.slots.length; i++) {
      if (s.slots[i] && s.slots[i].id === id) {
        return { word: s.slots[i], in: 'slot', rowId: s.rowId, slotIdx: i };
      }
    }
  }
  return null;
}

function removeWordFromLocation(id) {
  const idx = state.bank.findIndex((w) => w.id === id);
  if (idx >= 0) { state.bank.splice(idx, 1); return; }
  for (const s of state.sentences) {
    for (let i = 0; i < s.slots.length; i++) {
      if (s.slots[i] && s.slots[i].id === id) { s.slots[i] = null; return; }
    }
  }
}

function onWordClick(id) {
  if (state.status !== 'playing') return;
  const sel = findWord(id);
  state.selectedWordId = state.selectedWordId === id ? null : id;
  if (state.selectedWordId) sfx.pick();
  else if (sel && sel.in === 'slot') sfx.returnToBank();
  render();
}

function onSlotClick(rowId, slotIdx) {
  if (state.status !== 'playing') return;
  const row = state.sentences[rowId];
  const occupant = row.slots[slotIdx];

  if (state.selectedWordId) {
    const sel = findWord(state.selectedWordId);
    if (!sel) { state.selectedWordId = null; render(); return; }
    // Clicking the same slot the selected word is already in: just deselect.
    if (sel.in === 'slot' && sel.rowId === rowId && sel.slotIdx === slotIdx) {
      state.selectedWordId = null;
      render();
      return;
    }
    removeWordFromLocation(sel.word.id);
    if (occupant) {
      occupant.location = 'bank';
      state.bank.push(occupant);
    }
    row.slots[slotIdx] = sel.word;
    sel.word.location = `slot:${rowId}:${slotIdx}`;
    state.selectedWordId = null;
    sfx.place();
  } else if (occupant) {
    state.selectedWordId = occupant.id;
    sfx.pick();
  }
  render();
}

function onBankClick() {
  if (state.status !== 'playing') return;
  if (!state.selectedWordId) return;
  const sel = findWord(state.selectedWordId);
  if (!sel) { state.selectedWordId = null; render(); return; }
  if (sel.in === 'slot') {
    removeWordFromLocation(sel.word.id);
    sel.word.location = 'bank';
    state.bank.push(sel.word);
    sfx.returnToBank();
  }
  state.selectedWordId = null;
  render();
}

function clearAll() {
  if (state.status !== 'playing') return;
  let moved = 0;
  for (const s of state.sentences) {
    for (let i = 0; i < s.slots.length; i++) {
      const w = s.slots[i];
      if (w) {
        w.location = 'bank';
        state.bank.push(w);
        s.slots[i] = null;
        moved++;
      }
    }
  }
  if (moved > 0) {
    state.bank = shuffle(state.bank);
    sfx.shuffle();
  }
  state.selectedWordId = null;
  render();
}

/**
 * Clear a single placed answer — returns just that one word to the bank.
 * Triggered by the small × button rendered inside each filled slot.
 */
function clearSlot(rowId, slotIdx) {
  if (state.status !== 'playing') return;
  const row = state.sentences[rowId];
  const word = row.slots[slotIdx];
  if (!word) return;
  row.slots[slotIdx] = null;
  word.location = 'bank';
  state.bank.push(word);
  if (state.selectedWordId === word.id) state.selectedWordId = null;
  sfx.returnToBank();
  render();
}

function submitRound(viaTimeout = false) {
  if (state.status !== 'playing') return;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  state.status = 'reviewing';
  if (viaTimeout) sfx.timeout(); else sfx.submit();

  let correct = 0;
  const perRow = state.sentences.map((s) => {
    const ok = s.slots.every((w, i) => w && w.text === s.middles[i]);
    if (ok) correct += 1;
    return ok;
  });
  const points = correct * 10;
  const bonus = correct === state.sentences.length ? state.timeLeft : 0;
  state.totalScore += points + bonus;
  state.lastRoundResult = { correct, total: state.sentences.length, points, bonus, perRow };
  render();

  // Stagger per-row reveal sounds, then a final flourish.
  perRow.forEach((ok, i) => {
    setTimeout(() => { ok ? sfx.correctRow(i) : sfx.wrongRow(); }, 350 + i * 320);
  });
  setTimeout(() => {
    if (correct === perRow.length) sfx.win();
    else if (correct > 0) sfx.partial();
  }, 350 + perRow.length * 320);
}

function nextRound() {
  if (state.roundIndex + 1 < ROUNDS.length) {
    startRound(state.roundIndex + 1);
  } else {
    state.status = 'finished';
    sfx.gameover();
    render();
    window.DataCruiseResult && DataCruiseResult.ready({
      slug: 'sentence-builder', game: 'Bridge the Data Sentence',
      headline: state.totalScore + ' pts',
      sub: 'every sentence bridged 🌉',
    });
  }
}

function restartGame() {
  state.totalScore = 0;
  startRound(0);
}

function isRoundFilled() {
  return state.sentences.every((s) => s.slots.every((w) => w !== null));
}

// ----- Rendering --------------------------------------------------

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) node.setAttribute(k, '');
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  const flat = [].concat(children).flat(Infinity);
  for (const c of flat) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function renderHeader() {
  const round = ROUNDS[state.roundIndex];
  const timeWarn = state.timeLeft <= 15 && state.status === 'playing';
  return el('div', { class: 'hdr' }, [
    el('div', { class: 'title' }, [
      el('span', { class: 'prompt', text: '>' }),
      'Bridge the Data Sentence',
      el('span', { class: 'series', text: `DataCruise Word Games · ${round.name}` }),
    ]),
    el('div', { class: 'hud' }, [
      el('div', { class: 'stat' }, [
        el('span', { class: 'lbl', text: 'Score' }),
        el('span', { class: 'val', text: String(state.totalScore) }),
      ]),
      el('div', { class: 'stat timer' }, [
        el('span', { class: 'lbl', text: 'Time' }),
        el('span', { class: 'val' + (timeWarn ? ' warn' : ''), text: `${state.timeLeft}s` }),
      ]),
      el('button', {
        class: 'mute-btn',
        title: isMuted() ? 'Unmute' : 'Mute',
        'aria-label': isMuted() ? 'Unmute' : 'Mute',
        text: isMuted() ? '♪̸' : '♪',
        onClick: () => { toggleMuted(); render(); },
      }),
    ]),
  ]);
}

function renderRow(s, idx) {
  const result = state.lastRoundResult;
  const reviewing = state.status === 'reviewing' && result;
  const isWrong = reviewing && !result.perRow[idx];
  const cls = reviewing ? (result.perRow[idx] ? 'row correct' : 'row wrong') : 'row';
  const line = el('div', { class: 'row-line' }, [
    el('span', { class: 'num', text: `${String(idx + 1).padStart(2, '0')}.` }),
    el('span', { class: 'fixed', text: s.first }),
    ...s.slots.map((w, i) => {
      const filled = !!w;
      const isSelected = filled && state.selectedWordId === w.id;
      const slotCls = 'slot '
        + (filled ? 'filled' : 'empty')
        + (state.selectedWordId && !filled ? ' target' : '')
        + (isSelected ? ' selected' : '');
      const children = filled
        ? [
            el('span', { class: 'slot-text', text: w.text }),
            el('button', {
              class: 'slot-clear',
              title: 'Clear this answer',
              'aria-label': 'Clear this answer',
              text: '×',
              onClick: (e) => { e.stopPropagation(); clearSlot(s.rowId, i); },
            }),
          ]
        : [];
      return el('span', {
        class: slotCls,
        onClick: () => onSlotClick(s.rowId, i),
      }, children);
    }),
    el('span', { class: 'fixed', text: s.last }),
  ]);
  const children = [line];
  if (isWrong) {
    const correctSentence = [
      el('span', { class: 'corr-label', text: 'Correct:' }),
      ' ',
      s.first, ' ',
      el('span', { class: 'corr-mid', text: s.middles[0] }),
      ' ',
      el('span', { class: 'corr-mid', text: s.middles[1] }),
      ' ', s.last, '.',
    ];
    children.push(el('div', { class: 'correction' }, correctSentence));
  }
  return el('div', { class: cls }, children);
}

function renderBank() {
  if (state.status !== 'playing') return null;
  const sel = state.selectedWordId ? findWord(state.selectedWordId) : null;
  const selFromSlot = sel && sel.in === 'slot';
  let hint;
  if (!sel) hint = 'Click a word, then click a slot. Tap a placed word to move or return it.';
  else if (selFromSlot) hint = 'Click another slot to move it · click the bank to send it back.';
  else hint = 'Click a slot to place it · tap the word again to cancel.';

  const bankClass = 'bank' + (selFromSlot ? ' return-target' : '');
  return el('div', {}, [
    el('div', { class: 'bank-label' }, [
      'Word Bank',
      el('span', { class: 'hint', text: hint }),
    ]),
    el(
      'div',
      { class: bankClass, onClick: (e) => { if (e.target.classList.contains('bank')) onBankClick(); } },
      state.bank.length === 0
        ? [el('span', { class: 'bank-empty', text: selFromSlot ? 'click here to return the selected word' : 'all placed — submit to check' })]
        : state.bank.map((w) =>
            el('span', {
              class: 'word' + (state.selectedWordId === w.id ? ' selected' : ''),
              text: w.text,
              onClick: (e) => { e.stopPropagation(); onWordClick(w.id); },
            })
          )
    ),
  ]);
}

function renderControls() {
  if (state.status === 'playing') {
    const ready = isRoundFilled();
    const anyPlaced = state.sentences.some((s) => s.slots.some((w) => w !== null));
    return el('div', { class: 'controls' }, [
      el('button', {
        class: 'btn secondary',
        text: 'Clear all',
        disabled: !anyPlaced,
        onClick: clearAll,
      }),
      el('button', {
        class: 'btn secondary',
        text: 'Reshuffle bank',
        onClick: () => { state.bank = shuffle(state.bank); sfx.shuffle(); render(); },
      }),
      el('button', {
        class: 'btn',
        text: 'Submit round',
        disabled: !ready,
        title: ready ? '' : 'Fill every slot before you can submit',
        onClick: () => submitRound(false),
      }),
    ]);
  }
  if (state.status === 'reviewing') {
    const lastRound = state.roundIndex + 1 >= ROUNDS.length;
    return el('div', { class: 'controls' }, [
      el('button', {
        class: 'btn',
        text: lastRound ? 'See final score' : 'Next round →',
        onClick: nextRound,
      }),
    ]);
  }
  return el('div', { class: 'controls' }, [
    el('button', { class: 'btn', text: 'Play again', onClick: restartGame }),
  ]);
}

function renderResult() {
  if (state.status === 'reviewing' && state.lastRoundResult) {
    const r = state.lastRoundResult;
    const win = r.correct === r.total;
    return el('div', { class: 'result' + (win ? ' win' : '') }, [
      `${r.correct} / ${r.total} sentences bridged · +`,
      el('strong', { text: `${r.points}` }),
      r.bonus > 0
        ? [' pts, with a ', el('strong', { text: `+${r.bonus}` }), ' time bonus.']
        : ' pts.',
    ]);
  }
  if (state.status === 'finished') {
    return el('div', { class: 'result win' }, [
      'Final score: ',
      el('strong', { text: String(state.totalScore) }),
      ' — bridges built across all rounds.',
    ]);
  }
  return null;
}

function renderReviewBanner() {
  if (state.status !== 'reviewing' || !state.lastRoundResult) return null;
  const r = state.lastRoundResult;
  const perfect = r.correct === r.total;
  const msg = perfect
    ? 'Every one of these is a true statement about data — and you got them all.'
    : "These aren't random sentences. Each one is a true statement about data — here are the ones you missed:";
  return el('div', { class: 'banner' + (perfect ? ' banner-win' : '') }, [msg]);
}

function render() {
  const round = ROUNDS[state.roundIndex];
  const body = el('div', { class: 'term-body' }, [
    renderHeader(),
    renderReviewBanner(),
    el(
      'div',
      { class: 'sentences' },
      state.sentences.map((s, i) => renderRow(s, i))
    ),
    renderBank(),
    renderControls(),
    renderResult(),
  ]);
  const term = el('div', { class: 'term' }, [
    el('div', { class: 'term-bar' }, [
      el('div', { class: 'dots' }, [
        el('span', { class: 'dot r' }),
        el('span', { class: 'dot y' }),
        el('span', { class: 'dot g' }),
      ]),
      el('span', { class: 'path', text: `~/datacruise/word-games/bridge — round ${state.roundIndex + 1}/${ROUNDS.length}` }),
    ]),
    body,
  ]);
  app.replaceChildren(term);
}

startRound(0);

if (PLATFORM === "site" && AD.enabled && AD.gameId) {

        case "SDK_REWARDED_WATCH_COMPLETE": if (_gmPending) _gmPending.earned = true; break;

function _gmResolve(ok) {
  if (!_gmPending) return;
  const g = _gmPending; _gmPending = null;
  clearTimeout(g.timer);
  if (typeof g.done === "function") g.done(!!ok);
}
function showRewardedAd(onReward) {

                     timer: setTimeout(() => _gmResolve(true), 25000) };
    try { sdk.showBanner(); } catch (e) { _gmResolve(true); }
    return;
  }
  setTimeout(() => done(true), 800);
}

/* ==== Rewarded-ad hook ==== */
function _handleWatchAdContinue() {
  if (!(state && state.status === 'reviewing' && state.lastRoundResult && state.lastRoundResult.correct < state.lastRoundResult.total)) return;
  showRewardedAd(() => {
    startRound(state.roundIndex);
  });
}

(function () {
  const seen = new WeakSet();
  const check = () => {
    if (!(state && state.status === 'reviewing' && state.lastRoundResult && state.lastRoundResult.correct < state.lastRoundResult.total)) return;
    const actions = document.querySelector(".controls");
    if (!actions || seen.has(actions)) return;
    if (actions.querySelector('[data-action="watch-ad-continue"]')) return;
    seen.add(actions);
    const btn = document.createElement("button");
    btn.className = "gold";
    btn.setAttribute("data-action", "watch-ad-continue");
    btn.textContent = "▶ WATCH AD → REPLAY ROUND";
    const refNode = actions.firstChild;
    actions.insertBefore(btn, refNode);
  };
  setInterval(check, 400);
}());

document.addEventListener("click", function (e) {
  const t = e.target.closest && e.target.closest("[data-action]");
  if (t && t.getAttribute("data-action") === "watch-ad-continue") {
    e.preventDefault();
    _handleWatchAdContinue();
  }
}, true);

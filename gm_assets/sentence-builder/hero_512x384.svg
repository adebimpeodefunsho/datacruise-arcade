<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="0.55" stop-color="#9265D8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="384" fill="url(#sky)"/>

  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="60" r="2"/>
    <circle cx="140" cy="46" r="1.5"/>
    <circle cx="380" cy="54" r="2.4"/>
    <circle cx="450" cy="84" r="2"/>
    <circle cx="60" cy="140" r="1.6"/>
    <circle cx="470" cy="160" r="1.4"/>
  </g>

  <!-- Sentence card -->
  <g transform="translate(256, 200)">
    <rect x="-220" y="-70" width="440" height="150" rx="16" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="3"/>
    <text x="-204" y="-46" font-family="Courier New, monospace" font-size="12" font-weight="900" fill="#6B3EB0" letter-spacing="1">$ bridge --sentence 1/5</text>

    <text x="-204" y="-14" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1A1A">A pie chart shows</text>
    <g transform="translate(-24, -20)">
      <rect x="0" y="-4" width="72" height="28" rx="6" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.2"/>
      <text x="36" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#1A1A1A">parts</text>
    </g>
    <text x="56" y="-14" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1A1A">of the whole.</text>

    <text x="-204" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1A1A">A line chart tracks change</text>
    <g transform="translate(68, 18)">
      <rect x="0" y="-4" width="58" height="28" rx="6" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.2"/>
      <text x="29" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#1A1A1A">over</text>
    </g>
    <text x="130" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1A1A">time.</text>

    <text x="-204" y="62" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1A1A">Bars can be sorted</text>
    <g transform="translate(0, 56)">
      <rect x="0" y="-4" width="48" height="28" rx="6" fill="#FFF" stroke="#1A1A1A" stroke-width="2.2" stroke-dasharray="4 3"/>
      <text x="24" y="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#B0B0B0">___</text>
    </g>
    <text x="56" y="62" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1A1A1A">height.</text>
  </g>

  <!-- Word bank -->
  <g transform="translate(256, 320)">
    <rect x="-220" y="-22" width="440" height="60" rx="12" fill="#1A1A1A" opacity="0.85"/>
    <text x="-204" y="-4" font-family="Courier New, monospace" font-size="11" font-weight="900" fill="#FFC500" letter-spacing="1">bank $</text>
    <g transform="translate(-148, 18)">
      <rect x="-40" y="-14" width="80" height="26" rx="6" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#FFF">shows</text>
    </g>
    <g transform="translate(-60, 18)">
      <rect x="-28" y="-14" width="56" height="26" rx="6" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2.2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1A1A1A">by</text>
    </g>
    <g transform="translate(16, 18)">
      <rect x="-30" y="-14" width="60" height="26" rx="6" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2.2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#FFF">into</text>
    </g>
    <g transform="translate(96, 18)">
      <rect x="-36" y="-14" width="72" height="26" rx="6" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2.2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#FFF">within</text>
    </g>
    <g transform="translate(176, 18)">
      <rect x="-28" y="-14" width="56" height="26" rx="6" fill="#9D62E0" stroke="#1A1A1A" stroke-width="2.2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#FFF">for</text>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(256, 64)">
    <rect x="-220" y="-36" width="440" height="76" rx="18" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#FFC500" letter-spacing="2">BRIDGE THE DATA SENTENCE</text>
    <text x="0" y="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #3</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="340" viewBox="0 0 512 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="340" fill="url(#sky)"/>

  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="50" r="1.8"/>
    <circle cx="140" cy="42" r="1.4"/>
    <circle cx="380" cy="50" r="2.2"/>
    <circle cx="450" cy="80" r="1.8"/>
  </g>

  <!-- Sentence card -->
  <g transform="translate(256, 170)">
    <rect x="-215" y="-60" width="430" height="130" rx="14" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="2.5"/>
    <text x="-200" y="-38" font-family="Courier New, monospace" font-size="11" font-weight="900" fill="#6B3EB0" letter-spacing="1">$ bridge --sentence 1/5</text>

    <text x="-200" y="-8" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1A1A1A">A pie chart shows</text>
    <g transform="translate(-30, -14)">
      <rect x="0" y="-4" width="68" height="26" rx="5" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
      <text x="34" y="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1A1A1A">parts</text>
    </g>
    <text x="46" y="-8" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1A1A1A">of the whole.</text>

    <text x="-200" y="28" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1A1A1A">A line chart tracks change</text>
    <g transform="translate(60, 22)">
      <rect x="0" y="-4" width="52" height="26" rx="5" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
      <text x="26" y="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1A1A1A">over</text>
    </g>
    <text x="118" y="28" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1A1A1A">time.</text>

    <text x="-200" y="60" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1A1A1A">Bars can be sorted</text>
    <g transform="translate(-20, 54)">
      <rect x="0" y="-4" width="44" height="26" rx="5" fill="#FFF" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="22" y="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#B0B0B0">___</text>
    </g>
    <text x="30" y="60" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1A1A1A">height.</text>
  </g>

  <!-- Word bank -->
  <g transform="translate(256, 280)">
    <rect x="-215" y="-20" width="430" height="52" rx="10" fill="#1A1A1A" opacity="0.8"/>
    <g transform="translate(-140, 8)">
      <rect x="-38" y="-14" width="76" height="24" rx="5" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFF">shows</text>
    </g>
    <g transform="translate(-56, 8)">
      <rect x="-26" y="-14" width="52" height="24" rx="5" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#1A1A1A">by</text>
    </g>
    <g transform="translate(16, 8)">
      <rect x="-28" y="-14" width="56" height="24" rx="5" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFF">into</text>
    </g>
    <g transform="translate(96, 8)">
      <rect x="-34" y="-14" width="68" height="24" rx="5" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFF">within</text>
    </g>
    <g transform="translate(174, 8)">
      <rect x="-26" y="-14" width="52" height="24" rx="5" fill="#9D62E0" stroke="#1A1A1A" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#FFF">for</text>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(256, 60)">
    <rect x="-220" y="-32" width="440" height="66" rx="18" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#FFC500" letter-spacing="2">BRIDGE THE DATA SENTENCE</text>
    <text x="0" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #3</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="0.55" stop-color="#9265D8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="384" fill="url(#sky)"/>

  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="60" r="2"/>
    <circle cx="140" cy="46" r="1.5"/>
    <circle cx="380" cy="54" r="2.4"/>
    <circle cx="450" cy="84" r="2"/>
    <circle cx="60" cy="140" r="1.6"/>
    <circle cx="470" cy="160" r="1.4"/>
  </g>

  <!-- SQL terminal (left) -->
  <g transform="translate(140, 220)">
    <rect x="-100" y="-90" width="200" height="180" rx="12" fill="#1A1A1A" stroke="#FFF7E2" stroke-width="2"/>
    <circle cx="-84" cy="-74" r="5.5" fill="#E84A8B"/>
    <circle cx="-68" cy="-74" r="5.5" fill="#FFC500"/>
    <circle cx="-52" cy="-74" r="5.5" fill="#2BB673"/>
    <text x="0" y="-70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B0B0B0">magni@datacruise</text>
    <text x="-90" y="-42" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFC500">SELECT object</text>
    <text x="-90" y="-22" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFF7E2">FROM shelf</text>
    <text x="-90" y="-2" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFF7E2">WHERE nature =</text>
    <text x="-90" y="18" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5DC1E8">  'twinkles at night'</text>
    <text x="-90" y="38" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFF7E2">AND color =</text>
    <text x="-90" y="58" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5DC1E8">  'winter dawn';</text>
  </g>

  <!-- Shelf (right) -->
  <g transform="translate(360, 226)">
    <rect x="-90" y="-96" width="180" height="192" rx="12" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="2.5"/>
    <g transform="translate(-58, -64)">
      <circle r="15" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(0, -64)">
      <path d="M -11 11 L -11 -8 L 0 -16 L 11 -8 L 11 11 Z" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(58, -64)">
      <circle r="20" fill="#FFC500" opacity="0.4"/>
      <polygon points="0,-14 4,-3 14,-3 6,3 10,13 0,7 -10,13 -6,3 -14,-3 -4,-3" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(-58, 0)">
      <rect x="-11" y="-13" width="22" height="18" fill="#8B5A2B" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(0, 0)">
      <circle r="13" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(58, 0)">
      <path d="M -11 -4 A 11 11 0 0 1 11 -4 L 8 13 L -8 13 Z" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(-58, 62)">
      <rect x="-10" y="-13" width="20" height="24" fill="#9D62E0" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(0, 62)">
      <polygon points="-11,9 11,9 0,-13" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(58, 62)">
      <ellipse rx="11" ry="13" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>
    </g>
  </g>

  <!-- Magni + glass -->
  <g transform="translate(100, 320)">
    <ellipse cx="-14" cy="-14" rx="14" ry="9" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="14" cy="-14" rx="14" ry="9" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="0" cy="8" rx="22" ry="26" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -20 -1 L 20 -1" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M -20 15 L 20 15" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="0" cy="-20" r="13" fill="#7A4F2E" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="-4" cy="-20" r="2.5" fill="#FFF"/>
    <circle cx="4" cy="-21" r="2.5" fill="#FFF"/>
    <circle cx="32" cy="18" r="11" fill="none" stroke="#1A1A1A" stroke-width="2.7"/>
    <line x1="39" y1="25" x2="49" y2="35" stroke="#1A1A1A" stroke-width="3.6" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g transform="translate(256, 64)">
    <rect x="-220" y="-36" width="440" height="76" rx="18" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#FFC500" letter-spacing="2">HUNT THE DATA TREASURE</text>
    <text x="0" y="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #5</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="0.55" stop-color="#9265D8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="70" r="2"/>
    <circle cx="140" cy="52" r="1.5"/>
    <circle cx="380" cy="62" r="2.5"/>
    <circle cx="450" cy="90" r="2"/>
    <circle cx="60" cy="150" r="1.5"/>
    <circle cx="470" cy="170" r="1.5"/>
  </g>

  <!-- SQL terminal card (left) -->
  <g transform="translate(140, 250)">
    <rect x="-100" y="-100" width="200" height="200" rx="12" fill="#1A1A1A" stroke="#FFF7E2" stroke-width="2"/>
    <!-- traffic-light dots -->
    <circle cx="-84" cy="-84" r="6" fill="#E84A8B"/>
    <circle cx="-66" cy="-84" r="6" fill="#FFC500"/>
    <circle cx="-48" cy="-84" r="6" fill="#2BB673"/>
    <text x="0" y="-80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#B0B0B0">magni@datacruise</text>
    <!-- SQL code lines -->
    <text x="-90" y="-52" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFC500">SELECT object</text>
    <text x="-90" y="-32" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFF7E2">FROM shelf</text>
    <text x="-90" y="-12" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFF7E2">WHERE nature =</text>
    <text x="-90" y="8" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5DC1E8">  'twinkles at night'</text>
    <text x="-90" y="28" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFF7E2">AND color =</text>
    <text x="-90" y="48" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#5DC1E8">  'winter dawn';</text>
    <text x="-90" y="78" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#2BB673">▶ 3 rows returned</text>
  </g>

  <!-- Shelf with objects (right) -->
  <g transform="translate(360, 260)">
    <rect x="-90" y="-100" width="180" height="200" rx="12" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Row 1 -->
    <g transform="translate(-58, -68)">
      <circle r="16" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
      <polygon points="-2,-14 2,-14 6,0 -6,0" fill="#1A1A1A"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F">key</text>
    </g>
    <g transform="translate(0, -68)">
      <path d="M -12 12 L -12 -8 L 0 -18 L 12 -8 L 12 12 Z" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F">tent</text>
    </g>
    <g transform="translate(58, -68)">
      <!-- Star (the treasure) with glow -->
      <circle r="22" fill="#FFC500" opacity="0.35"/>
      <polygon points="0,-15 4,-4 15,-4 6,3 10,14 0,7 -10,14 -6,3 -15,-4 -4,-4" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F" font-weight="900">★ star</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(-58, 0)">
      <rect x="-12" y="-14" width="24" height="18" fill="#8B5A2B" stroke="#1A1A1A" stroke-width="2"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F">book</text>
    </g>
    <g transform="translate(0, 0)">
      <circle r="14" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F">apple</text>
    </g>
    <g transform="translate(58, 0)">
      <path d="M -12 -4 A 12 12 0 0 1 12 -4 L 8 14 L -8 14 Z" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F">bell</text>
    </g>
    <!-- Row 3 -->
    <g transform="translate(-58, 66)">
      <rect x="-10" y="-14" width="20" height="24" fill="#9D62E0" stroke="#1A1A1A" stroke-width="2"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F">gift</text>
    </g>
    <g transform="translate(0, 66)">
      <polygon points="-12,10 12,10 0,-14" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F">flag</text>
    </g>
    <g transform="translate(58, 66)">
      <ellipse rx="12" ry="14" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>
      <text y="30" text-anchor="middle" font-size="8" font-family="Helvetica,sans-serif" fill="#5C2A0F">leaf</text>
    </g>
  </g>

  <!-- Magni bee bottom-left -->
  <g transform="translate(95, 450)">
    <ellipse cx="-15" cy="-15" rx="14" ry="9" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="15" cy="-15" rx="14" ry="9" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="0" cy="8" rx="24" ry="28" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -22 0 L 22 0" stroke="#1A1A1A" stroke-width="3.5"/>
    <path d="M -22 16 L 22 16" stroke="#1A1A1A" stroke-width="3.5"/>
    <circle cx="0" cy="-22" r="14" fill="#7A4F2E" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -5 -34 Q -10 -42 -7 -48" stroke="#1A1A1A" stroke-width="1.8" fill="none"/>
    <circle cx="-7" cy="-48" r="2.2" fill="#1A1A1A"/>
    <path d="M 5 -34 Q 10 -42 7 -48" stroke="#1A1A1A" stroke-width="1.8" fill="none"/>
    <circle cx="7" cy="-48" r="2.2" fill="#1A1A1A"/>
    <circle cx="-4" cy="-22" r="2.6" fill="#FFF"/>
    <circle cx="4" cy="-23" r="2.6" fill="#FFF"/>
    <!-- Magnifying glass -->
    <circle cx="34" cy="18" r="12" fill="none" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="42" y1="26" x2="52" y2="36" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g transform="translate(256, 90)">
    <rect x="-220" y="-42" width="440" height="86" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">HUNT THE</text>
    <text x="0" y="24" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">DATA TREASURE</text>
    <text x="0" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #5</text>
  </g>
</svg>

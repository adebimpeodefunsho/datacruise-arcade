<svg xmlns="http://www.w3.org/2000/svg" width="512" height="340" viewBox="0 0 512 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="340" fill="url(#sky)"/>

  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="50" r="1.8"/>
    <circle cx="140" cy="42" r="1.4"/>
    <circle cx="380" cy="50" r="2.2"/>
    <circle cx="450" cy="80" r="1.8"/>
    <circle cx="60" cy="120" r="1.6"/>
  </g>

  <!-- SQL terminal card (left) -->
  <g transform="translate(140, 190)">
    <rect x="-100" y="-80" width="200" height="160" rx="10" fill="#1A1A1A" stroke="#FFF7E2" stroke-width="2"/>
    <circle cx="-84" cy="-66" r="5" fill="#E84A8B"/>
    <circle cx="-70" cy="-66" r="5" fill="#FFC500"/>
    <circle cx="-56" cy="-66" r="5" fill="#2BB673"/>
    <text x="0" y="-62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#B0B0B0">magni@datacruise</text>
    <text x="-90" y="-38" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#FFC500">SELECT object</text>
    <text x="-90" y="-20" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#FFF7E2">FROM shelf</text>
    <text x="-90" y="-2" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#FFF7E2">WHERE nature =</text>
    <text x="-90" y="16" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#5DC1E8">  'twinkles at night'</text>
    <text x="-90" y="34" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#FFF7E2">AND color =</text>
    <text x="-90" y="52" font-family="Courier New, monospace" font-size="10" font-weight="700" fill="#5DC1E8">  'winter dawn';</text>
  </g>

  <!-- Shelf with objects (right) -->
  <g transform="translate(360, 200)">
    <rect x="-90" y="-90" width="180" height="180" rx="10" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="2.5"/>
    <g transform="translate(-58, -58)">
      <circle r="14" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(0, -58)">
      <path d="M -10 10 L -10 -8 L 0 -14 L 10 -8 L 10 10 Z" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(58, -58)">
      <circle r="20" fill="#FFC500" opacity="0.35"/>
      <polygon points="0,-13 4,-3 13,-3 5,3 8,12 0,6 -8,12 -5,3 -13,-3 -4,-3" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(-58, 0)">
      <rect x="-10" y="-12" width="20" height="16" fill="#8B5A2B" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(0, 0)">
      <circle r="12" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(58, 0)">
      <path d="M -10 -3 A 10 10 0 0 1 10 -3 L 7 12 L -7 12 Z" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(-58, 58)">
      <rect x="-9" y="-12" width="18" height="22" fill="#9D62E0" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(0, 58)">
      <polygon points="-10,8 10,8 0,-12" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(58, 58)">
      <ellipse rx="10" ry="12" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>
    </g>
  </g>

  <!-- Magni + magnifying glass -->
  <g transform="translate(90, 275)">
    <ellipse cx="-13" cy="-13" rx="13" ry="8" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.2"/>
    <ellipse cx="13" cy="-13" rx="13" ry="8" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.2"/>
    <ellipse cx="0" cy="8" rx="21" ry="25" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -19 0 L 19 0" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M -19 14 L 19 14" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="0" cy="-19" r="12" fill="#7A4F2E" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="-4" cy="-20" r="2.4" fill="#FFF"/>
    <circle cx="4" cy="-21" r="2.4" fill="#FFF"/>
    <circle cx="30" cy="16" r="10" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
    <line x1="37" y1="23" x2="46" y2="32" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g transform="translate(256, 60)">
    <rect x="-220" y="-32" width="440" height="66" rx="18" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#FFC500" letter-spacing="2">HUNT THE DATA TREASURE</text>
    <text x="0" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #5</text>
  </g>
</svg>

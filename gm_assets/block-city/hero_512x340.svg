<svg xmlns="http://www.w3.org/2000/svg" width="512" height="340" viewBox="0 0 512 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="340" fill="url(#sky)"/>

  <g opacity="0.6">
    <circle cx="70" cy="52" r="14" fill="#FFF"/>
    <circle cx="92" cy="50" r="18" fill="#FFF"/>
    <circle cx="114" cy="54" r="12" fill="#FFF"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="280" width="512" height="60" fill="#8B5A2B"/>
  <rect x="0" y="275" width="512" height="8" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>

  <!-- 4 bars -->
  <g transform="translate(80, 275)">
    <rect x="-24" y="-46" width="48" height="46" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-24" y="-92" width="48" height="46" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <g transform="translate(180, 275)">
    <rect x="-24" y="-46" width="48" height="46" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-24" y="-92" width="48" height="46" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-24" y="-138" width="48" height="46" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-24" y="-184" width="48" height="46" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <g transform="translate(322, 275)">
    <rect x="-24" y="-46" width="48" height="46" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>
  <g transform="translate(432, 275)">
    <rect x="-24" y="-46" width="48" height="46" fill="#9D62E0" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-24" y="-92" width="48" height="46" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>

  <!-- Bug-Bug on tallest bar -->
  <g transform="translate(180, 116)">
    <rect x="-18" y="-42" width="36" height="22" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <line x1="0" y1="-16" x2="0" y2="-22" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="10" rx="18" ry="22" fill="#D44A00" stroke="#1A1A1A" stroke-width="2.5"/>
    <line x1="-18" y1="10" x2="18" y2="10" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="-7" cy="0" r="2.5" fill="#1A1A1A"/>
    <circle cx="7" cy="-2" r="2.5" fill="#1A1A1A"/>
    <circle cx="0" cy="-14" r="9" fill="#1A1A1A"/>
    <circle cx="-3" cy="-16" r="2" fill="#FFF"/>
    <circle cx="3" cy="-17" r="2" fill="#FFF"/>
  </g>

  <!-- Title panel -->
  <g transform="translate(256, 60)">
    <rect x="-200" y="-32" width="400" height="66" rx="18" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="4" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#FFC500" letter-spacing="3">BLOCK CITY</text>
    <text x="0" y="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 2</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Clouds -->
  <g opacity="0.6">
    <circle cx="80" cy="60" r="18" fill="#FFF"/>
    <circle cx="106" cy="58" r="22" fill="#FFF"/>
    <circle cx="134" cy="64" r="16" fill="#FFF"/>
    <circle cx="410" cy="90" r="18" fill="#FFF"/>
    <circle cx="440" cy="86" r="22" fill="#FFF"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="440" width="512" height="72" fill="#8B5A2B"/>
  <rect x="0" y="435" width="512" height="10" fill="#2BB673" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Bar 1 -->
  <g transform="translate(80, 435)">
    <rect x="-30" y="-64" width="60" height="64" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-30" y="-128" width="60" height="64" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-30" y="-192" width="60" height="64" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="3"/>
  </g>
  <!-- Bar 2 (tallest) -->
  <g transform="translate(180, 435)">
    <rect x="-30" y="-64" width="60" height="64" fill="#2BB673" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-30" y="-128" width="60" height="64" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-30" y="-192" width="60" height="64" fill="#2BB673" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-30" y="-256" width="60" height="64" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>
  </g>
  <!-- Bar 3 (shortest) -->
  <g transform="translate(322, 435)">
    <rect x="-30" y="-64" width="60" height="64" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-30" y="-128" width="60" height="64" fill="#E84A8B" stroke="#1A1A1A" stroke-width="3"/>
  </g>
  <!-- Bar 4 -->
  <g transform="translate(432, 435)">
    <rect x="-30" y="-64" width="60" height="64" fill="#9D62E0" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-30" y="-128" width="60" height="64" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-30" y="-192" width="60" height="64" fill="#9D62E0" stroke="#1A1A1A" stroke-width="3"/>
  </g>

  <!-- Bug-Bug on top of tallest bar with a block -->
  <g transform="translate(180, 155)">
    <rect x="-24" y="-56" width="48" height="30" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="0" y1="-18" x2="0" y2="-30" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="14" rx="24" ry="30" fill="#D44A00" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="-24" y1="14" x2="24" y2="14" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="-10" cy="-2" r="3.5" fill="#1A1A1A"/>
    <circle cx="10" cy="-4" r="3.5" fill="#1A1A1A"/>
    <circle cx="-10" cy="24" r="3.5" fill="#1A1A1A"/>
    <circle cx="10" cy="22" r="3.5" fill="#1A1A1A"/>
    <circle cx="0" cy="-18" r="12" fill="#1A1A1A"/>
    <circle cx="-4" cy="-21" r="3" fill="#FFF"/>
    <circle cx="4" cy="-22" r="3" fill="#FFF"/>
    <circle cx="-4" cy="-22" r="1.5" fill="#1A1A1A"/>
    <circle cx="4" cy="-23" r="1.5" fill="#1A1A1A"/>
  </g>

  <!-- Title panel -->
  <g transform="translate(256, 78)">
    <rect x="-200" y="-42" width="400" height="84" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#FFC500" letter-spacing="3">BLOCK CITY</text>
    <text x="0" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 2</text>
  </g>
</svg>

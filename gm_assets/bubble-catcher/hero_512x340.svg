<svg xmlns="http://www.w3.org/2000/svg" width="512" height="340" viewBox="0 0 512 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="340" fill="url(#sky)"/>

  <g opacity="0.6">
    <circle cx="70" cy="46" r="14" fill="#FFF"/>
    <circle cx="92" cy="44" r="18" fill="#FFF"/>
    <circle cx="114" cy="48" r="12" fill="#FFF"/>
  </g>

  <!-- Chart slots panel -->
  <g transform="translate(28, 130)">
    <rect width="160" height="180" rx="10" fill="#FFFDF5" stroke="#1A1A1A" stroke-width="3"/>
    <text x="80" y="20" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#1A1A1A" letter-spacing="2">CATCH THESE</text>
    <circle cx="45" cy="65" r="18" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="95" cy="65" r="12" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="130" cy="65" r="14" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="45" cy="115" r="14" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="95" cy="115" r="18" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="45" cy="160" r="15" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="95" cy="160" r="10" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="130" cy="115" r="11" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>

  <!-- Falling bubbles -->
  <g>
    <circle cx="250" cy="130" r="14" fill="#5DC1E8" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="320" cy="180" r="20" fill="#FF6A1A" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="390" cy="150" r="12" fill="#2BB673" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="285" cy="220" r="14" fill="#FFC500" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="355" cy="240" r="17" fill="#E84A8B" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>

  <!-- Strings -->
  <g stroke="#1A1A1A" stroke-width="1.5" opacity="0.5">
    <line x1="245" y1="100" x2="245" y2="278"/>
    <line x1="290" y1="100" x2="290" y2="278"/>
    <line x1="335" y1="100" x2="335" y2="278"/>
    <line x1="380" y1="100" x2="380" y2="278"/>
    <line x1="425" y1="100" x2="425" y2="278"/>
  </g>

  <!-- Bug-Bug -->
  <g transform="translate(335, 290)">
    <ellipse cx="0" cy="7" rx="22" ry="26" fill="#D44A00" stroke="#1A1A1A" stroke-width="2.5"/>
    <line x1="-22" y1="7" x2="22" y2="7" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="-9" cy="-1" r="3" fill="#1A1A1A"/>
    <circle cx="9" cy="-2" r="3" fill="#1A1A1A"/>
    <circle cx="0" cy="-14" r="10" fill="#1A1A1A"/>
    <circle cx="-3" cy="-17" r="2.4" fill="#FFF"/>
    <circle cx="3" cy="-18" r="2.4" fill="#FFF"/>
    <line x1="14" y1="-4" x2="24" y2="-24" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g transform="translate(256, 60)">
    <rect x="-210" y="-32" width="420" height="66" rx="18" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="4" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">BUBBLE CATCHER</text>
    <text x="0" y="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 4</text>
  </g>
</svg>

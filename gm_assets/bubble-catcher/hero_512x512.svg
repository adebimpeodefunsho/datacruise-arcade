<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Clouds -->
  <g opacity="0.6">
    <circle cx="80" cy="60" r="18" fill="#FFF"/>
    <circle cx="106" cy="58" r="22" fill="#FFF"/>
    <circle cx="134" cy="64" r="16" fill="#FFF"/>
    <circle cx="410" cy="70" r="20" fill="#FFF"/>
    <circle cx="440" cy="66" r="22" fill="#FFF"/>
  </g>

  <!-- Left panel: bubble chart slots (targets) -->
  <g transform="translate(30, 210)">
    <rect width="180" height="230" rx="10" fill="#FFFDF5" stroke="#1A1A1A" stroke-width="3"/>
    <text x="90" y="22" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#1A1A1A" letter-spacing="2">CATCH THESE</text>
    <!-- Sample bubbles: filled + not-yet-filled -->
    <circle cx="45" cy="70" r="22" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="105" cy="70" r="14" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="150" cy="70" r="18" fill="#2BB673" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="45" cy="130" r="16" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="105" cy="130" r="22" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="45" cy="190" r="20" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="105" cy="190" r="12" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="150" cy="130" r="14" fill="#E84A8B" stroke="#1A1A1A" stroke-width="3"/>
  </g>

  <!-- Falling bubbles in the play area -->
  <g>
    <circle cx="280" cy="180" r="18" fill="#5DC1E8" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="360" cy="240" r="24" fill="#FF6A1A" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="440" cy="200" r="14" fill="#2BB673" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="320" cy="320" r="16" fill="#FFC500" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="400" cy="350" r="20" fill="#E84A8B" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="3"/>
  </g>

  <!-- Strings hanging down from ceiling (5 strings) -->
  <g stroke="#1A1A1A" stroke-width="1.5" opacity="0.5">
    <line x1="275" y1="150" x2="275" y2="410"/>
    <line x1="325" y1="150" x2="325" y2="410"/>
    <line x1="375" y1="150" x2="375" y2="410"/>
    <line x1="425" y1="150" x2="425" y2="410"/>
    <line x1="475" y1="150" x2="475" y2="410"/>
  </g>

  <!-- Bug-Bug at bottom, tugging a string -->
  <g transform="translate(375, 450)">
    <ellipse cx="0" cy="10" rx="28" ry="34" fill="#D44A00" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="-28" y1="10" x2="28" y2="10" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="-12" cy="-2" r="4" fill="#1A1A1A"/>
    <circle cx="12" cy="-4" r="4" fill="#1A1A1A"/>
    <circle cx="-12" cy="24" r="4" fill="#1A1A1A"/>
    <circle cx="12" cy="22" r="4" fill="#1A1A1A"/>
    <circle cx="0" cy="-20" r="14" fill="#1A1A1A"/>
    <circle cx="-5" cy="-24" r="3" fill="#FFF"/>
    <circle cx="5" cy="-25" r="3" fill="#FFF"/>
    <circle cx="-5" cy="-25" r="1.5" fill="#1A1A1A"/>
    <circle cx="5" cy="-26" r="1.5" fill="#1A1A1A"/>
    <!-- Arm reaching for string -->
    <line x1="18" y1="-4" x2="30" y2="-30" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Title panel -->
  <g transform="translate(256, 90)">
    <rect x="-210" y="-40" width="420" height="80" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#FFC500" letter-spacing="2">BUBBLE CATCHER</text>
    <text x="0" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 4</text>
  </g>
</svg>

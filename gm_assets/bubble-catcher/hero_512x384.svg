<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="384" fill="url(#sky)"/>

  <g opacity="0.6">
    <circle cx="70" cy="52" r="15" fill="#FFF"/>
    <circle cx="92" cy="50" r="19" fill="#FFF"/>
    <circle cx="114" cy="54" r="13" fill="#FFF"/>
    <circle cx="418" cy="70" r="16" fill="#FFF"/>
    <circle cx="440" cy="66" r="13" fill="#FFF"/>
  </g>

  <!-- Chart slots panel -->
  <g transform="translate(28, 150)">
    <rect width="170" height="210" rx="10" fill="#FFFDF5" stroke="#1A1A1A" stroke-width="3"/>
    <text x="85" y="22" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#1A1A1A" letter-spacing="2">CATCH THESE</text>
    <circle cx="45" cy="70" r="20" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="100" cy="70" r="13" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="140" cy="70" r="16" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="45" cy="130" r="15" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="100" cy="130" r="20" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="45" cy="185" r="18" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="100" cy="185" r="11" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="140" cy="130" r="13" fill="#E84A8B" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>

  <!-- Falling bubbles -->
  <g>
    <circle cx="265" cy="150" r="16" fill="#5DC1E8" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="335" cy="200" r="22" fill="#FF6A1A" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="410" cy="170" r="13" fill="#2BB673" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="300" cy="250" r="15" fill="#FFC500" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="370" cy="275" r="19" fill="#E84A8B" fill-opacity="0.9" stroke="#1A1A1A" stroke-width="2.5"/>
  </g>

  <!-- Strings -->
  <g stroke="#1A1A1A" stroke-width="1.5" opacity="0.5">
    <line x1="255" y1="120" x2="255" y2="315"/>
    <line x1="300" y1="120" x2="300" y2="315"/>
    <line x1="345" y1="120" x2="345" y2="315"/>
    <line x1="390" y1="120" x2="390" y2="315"/>
    <line x1="435" y1="120" x2="435" y2="315"/>
  </g>

  <!-- Bug-Bug -->
  <g transform="translate(345, 335)">
    <ellipse cx="0" cy="8" rx="24" ry="30" fill="#D44A00" stroke="#1A1A1A" stroke-width="2.5"/>
    <line x1="-24" y1="8" x2="24" y2="8" stroke="#1A1A1A" stroke-width="2.2"/>
    <circle cx="-10" cy="-2" r="3.5" fill="#1A1A1A"/>
    <circle cx="10" cy="-3" r="3.5" fill="#1A1A1A"/>
    <circle cx="0" cy="-16" r="12" fill="#1A1A1A"/>
    <circle cx="-4" cy="-19" r="2.6" fill="#FFF"/>
    <circle cx="4" cy="-20" r="2.6" fill="#FFF"/>
    <line x1="16" y1="-4" x2="26" y2="-26" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g transform="translate(256, 64)">
    <rect x="-210" y="-36" width="420" height="76" rx="18" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="4" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#FFC500" letter-spacing="2">BUBBLE CATCHER</text>
    <text x="0" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 4</text>
  </g>

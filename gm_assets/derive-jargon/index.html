  <style>
/* ============================================================
   DataCruise Word Games — Derive the Data Jargon
   Terminal / hacker aesthetic
   ============================================================ */

:root {
  --bg-0: #06080c;
  --bg-1: #0a0e14;
  --bg-2: #11161f;
  --bg-3: #1a212e;
  --border: #1f2937;
  --border-hi: #2a3445;

  --neon-green: #00ff9c;
  --neon-cyan:  #00f0ff;
  --neon-magenta: #ff2e92;
  --neon-yellow: #ffd700;

  --text:   #c9d1d9;
  --text-dim: #8b949e;
  --text-faint: #4a5260;

  --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'Consolas', monospace;

  --shadow-glow-green: 0 0 12px rgba(0, 255, 156, 0.45), 0 0 30px rgba(0, 255, 156, 0.15);
  --shadow-glow-cyan:  0 0 12px rgba(0, 240, 255, 0.45), 0 0 30px rgba(0, 240, 255, 0.15);
  --shadow-glow-mag:   0 0 12px rgba(255, 46, 146, 0.45), 0 0 30px rgba(255, 46, 146, 0.15);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(ellipse at top, rgba(0, 240, 255, 0.06), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(255, 46, 146, 0.05), transparent 60%),
    var(--bg-0);
  min-height: 100vh;
  min-height: 100dvh;
}

/* ---- CRT scanline overlay ---- */
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0) 0px,
    rgba(0, 0, 0, 0) 2px,
    rgba(0, 0, 0, 0.12) 3px,
    rgba(0, 0, 0, 0) 4px
  );
  mix-blend-mode: multiply;
  opacity: 0.5;
}

#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ============================================================
   Terminal window frame
   ============================================================ */

.term {
  width: 100%;
  max-width: 720px;
  background: var(--bg-1);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  box-shadow:
    0 0 0 1px rgba(0, 240, 255, 0.08),
    0 20px 60px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}

.term-bar {
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-dim);
}

.term-bar .dots {
  display: flex;
  gap: 6px;
}
.term-bar .dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #2a3445;
}
.term-bar .dot.r { background: #ff5f56; }
.term-bar .dot.y { background: #ffbd2e; }
.term-bar .dot.g { background: #27c93f; }

.term-bar .path {
  font-family: var(--mono);
  letter-spacing: 0.02em;
}
.term-bar .path .prompt { color: var(--neon-green); }
.term-bar .path .sep    { color: var(--text-faint); }
.term-bar .path .cmd    { color: var(--neon-cyan); }

.term-bar .path { flex: 1; }

.mute-btn {
  background: transparent;
  border: 1px solid var(--border-hi);
  color: var(--text-dim);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 13px;
  cursor: pointer;
  line-height: 1;
  margin-left: auto;
  transition: all 0.15s ease;
}
.mute-btn:hover {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
}

.term-body {
  padding: 26px 22px 28px;
}

/* ============================================================
   Title / brand line
   ============================================================ */

.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 12px;
  flex-wrap: wrap;
}

.brand-title {
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--neon-cyan);
  text-transform: uppercase;
}

.brand-title .pipe { color: var(--text-faint); margin: 0 8px; }

.brand-meta {
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ============================================================
   Splash screen
   ============================================================ */

.splash {
  text-align: center;
  padding: 14px 4px 4px;
}

.splash h1 {
  font-family: var(--mono);
  font-weight: 700;
  font-size: clamp(28px, 6vw, 44px);
  margin: 14px 0 8px;
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
  letter-spacing: 0.02em;
}

.splash h1 .punc { color: var(--neon-magenta); }
.splash h1 .cursor { display: inline-block; animation: blink 1s steps(1) infinite; color: var(--neon-cyan); margin-left: 4px; }

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.splash .tagline {
  color: var(--text-dim);
  font-size: 14px;
  margin: 0 auto 24px;
  max-width: 480px;
  line-height: 1.55;
}

.splash .tagline .hl { color: var(--neon-cyan); }

.splash .mascot {
  margin: 18px auto 8px;
  width: 160px;
  height: 160px;
  filter: drop-shadow(0 0 18px rgba(255, 196, 60, 0.4));
}

.how-to {
  text-align: left;
  background: var(--bg-2);
  border: 1px dashed var(--border-hi);
  border-radius: 6px;
  padding: 14px 18px;
  margin: 18px auto;
  max-width: 520px;
  font-size: 13px;
  color: var(--text-dim);
}

.how-to .head {
  color: var(--neon-cyan);
  font-weight: 700;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
  font-size: 11px;
  text-transform: uppercase;
}

.how-to ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.how-to li {
  padding: 3px 0;
  display: flex;
  gap: 10px;
}

.how-to li::before {
  content: ">";
  color: var(--neon-green);
  font-weight: 700;
}

.how-to .key {
  color: var(--neon-yellow);
}

/* ============================================================
   Buttons
   ============================================================ */

.btn {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 12px 26px;
  background: transparent;
  border: 1px solid var(--neon-green);
  color: var(--neon-green);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
  text-shadow: 0 0 8px rgba(0, 255, 156, 0.4);
}

.btn:hover, .btn:focus-visible {
  background: rgba(0, 255, 156, 0.1);
  box-shadow: var(--shadow-glow-green);
  outline: none;
  transform: translateY(-1px);
}

.btn:active { transform: translateY(0); }

.btn.cyan {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
}
.btn.cyan:hover, .btn.cyan:focus-visible {
  background: rgba(0, 240, 255, 0.1);
  box-shadow: var(--shadow-glow-cyan);
}

.btn.mag {
  border-color: var(--neon-magenta);
  color: var(--neon-magenta);
  text-shadow: 0 0 8px rgba(255, 46, 146, 0.4);
}
.btn.mag:hover, .btn.mag:focus-visible {
  background: rgba(255, 46, 146, 0.1);
  box-shadow: var(--shadow-glow-mag);
}

.btn.ghost {
  border-color: var(--border-hi);
  color: var(--text-dim);
  text-shadow: none;
}
.btn.ghost:hover {
  border-color: var(--text-dim);
  color: var(--text);
  background: rgba(255, 255, 255, 0.03);
  box-shadow: none;
}

/* Splash: two-button start row */
.start-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 18px 0 6px;
}

.daily-num {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  font-size: 11px;
  border: 1px solid currentColor;
  border-radius: 3px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.daily-tag {
  margin: 6px 0 12px;
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: center;
}

/* Share block on daily result */
.share-block {
  margin: 20px auto 18px;
  max-width: 520px;
  padding: 16px 18px;
  border: 1px dashed var(--border-hi);
  border-radius: 6px;
  background: var(--bg-2);
  text-align: center;
}

.share-head {
  font-size: 11px;
  color: var(--neon-cyan);
  letter-spacing: 0.16em;
  font-weight: 700;
  margin-bottom: 10px;
}

.share-text {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  margin: 0 0 12px;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
  text-align: left;
}

.share-hint {
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.06em;
}

.reveal-term.big {
  font-size: clamp(28px, 6vw, 40px);
  margin: 10px 0 14px;
}

.over h2.correct {
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
}

.over h2.wrong {
  color: var(--neon-magenta);
  text-shadow: var(--shadow-glow-mag);
}

.daily-over { padding-top: 4px; }

.hud-cell .val.small {
  font-size: 12px;
  letter-spacing: 0.04em;
}

.hud.daily {
  grid-template-columns: 1fr 1fr 1fr;
}

/* ============================================================
   HUD (score, streak, lives, timer)
   ============================================================ */

.hud {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.hud-cell {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  font-size: 11px;
}

.hud-cell .lbl {
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 10px;
}

.hud-cell .val {
  color: var(--neon-cyan);
  font-size: 18px;
  font-weight: 700;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.35);
}

.hud-cell.score .val { color: var(--neon-green); text-shadow: 0 0 6px rgba(0, 255, 156, 0.35); }
.hud-cell.streak .val { color: var(--neon-yellow); text-shadow: 0 0 6px rgba(255, 215, 0, 0.35); }
.hud-cell.lives .val  { color: var(--neon-magenta); text-shadow: 0 0 6px rgba(255, 46, 146, 0.35); }

.hud-cell.lives .val.warn { animation: pulse 0.6s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Timer bar */
.timer-row {
  margin: 0 0 16px;
}

.timer-bar {
  height: 6px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}

.timer-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
  transition: width 0.1s linear, background 0.3s ease;
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
}

.timer-bar-fill.warn {
  background: linear-gradient(90deg, var(--neon-yellow), var(--neon-magenta));
  animation: pulse 0.5s ease-in-out infinite;
}

/* ============================================================
   Rebus puzzle area
   ============================================================ */

.prompt-line {
  font-size: 12px;
  color: var(--text-faint);
  margin-bottom: 8px;
  letter-spacing: 0.06em;
}
.prompt-line .gp { color: var(--neon-green); }
.prompt-line .gc { color: var(--neon-cyan); }

.rebus {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
  margin: 8px 0 22px;
}

.rebus-icon {
  background: var(--bg-2);
  border: 1px solid var(--border-hi);
  border-radius: 6px;
  padding: 14px 8px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  min-height: 170px;
}

.rebus-icon::before {
  content: attr(data-label);
  position: absolute;
  top: 6px;
  left: 8px;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.rebus-icon pre {
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.15;
  margin: 0;
  text-align: center;
  white-space: pre;
  color: var(--neon-cyan);
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
  letter-spacing: 0;
}

.rebus-icon.b pre {
  color: var(--neon-magenta);
  text-shadow: 0 0 6px rgba(255, 46, 146, 0.4);
}

.rebus-plus {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: var(--neon-green);
  font-weight: 700;
  text-shadow: var(--shadow-glow-green);
}

/* ============================================================
   Typed answer input + Hint
   ============================================================ */

.hint {
  margin: 4px 0 10px;
  padding: 10px 14px;
  border-radius: 4px;
  border: 1px dashed var(--border-hi);
  font-size: 13px;
  color: var(--text-dim);
  background: rgba(255, 215, 0, 0.03);
  line-height: 1.45;
}

.hint.placeholder {
  font-style: italic;
  color: var(--text-faint);
  background: transparent;
}

.hint.show {
  border-style: solid;
  border-color: rgba(255, 215, 0, 0.4);
  color: var(--text);
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.08);
}

.hint .hint-label {
  color: var(--neon-yellow);
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-right: 6px;
}

.kbd {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--border-hi);
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--neon-yellow);
  background: var(--bg-2);
}

.answer-form {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--neon-cyan);
  border-radius: 4px;
  padding: 10px 14px;
  margin: 4px 0 12px;
  box-shadow: 0 0 14px rgba(0, 240, 255, 0.18);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}

.answer-form:focus-within {
  border-color: var(--neon-green);
  box-shadow: var(--shadow-glow-green);
}

.input-prompt {
  color: var(--neon-green);
  font-weight: 700;
  font-size: 18px;
  text-shadow: 0 0 6px rgba(0, 255, 156, 0.5);
  flex-shrink: 0;
}

.answer-input {
  flex: 1 1 auto;
  background: transparent;
  border: none;
  outline: none;
  color: var(--neon-cyan);
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  padding: 4px 0;
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.35);
  letter-spacing: 0.02em;
  min-width: 0;
}

.answer-input::placeholder {
  color: var(--text-faint);
  font-weight: 400;
  text-shadow: none;
  font-style: italic;
}

.answer-form .caret {
  color: var(--neon-cyan);
  font-size: 18px;
  animation: blink 1s steps(1) infinite;
  flex-shrink: 0;
}

.quit-row {
  margin-top: 8px;
  display: flex;
  justify-content: flex-end;
}

.btn.tiny {
  padding: 6px 14px;
  font-size: 11px;
  letter-spacing: 0.08em;
}

/* ============================================================
   Reveal block (after submit / timeout)
   ============================================================ */

.reveal {
  margin: 6px 0 4px;
  padding: 18px 18px 16px;
  border-radius: 6px;
  border: 1px solid var(--border-hi);
  background: var(--bg-2);
  text-align: center;
}

.reveal.correct {
  border-color: var(--neon-green);
  box-shadow: var(--shadow-glow-green);
  background:
    linear-gradient(180deg, rgba(0, 255, 156, 0.08), rgba(0, 255, 156, 0.02)),
    var(--bg-2);
  animation: pop-in 0.35s ease-out;
}

.reveal.wrong {
  border-color: var(--neon-magenta);
  box-shadow: var(--shadow-glow-mag);
  background:
    linear-gradient(180deg, rgba(255, 46, 146, 0.08), rgba(255, 46, 146, 0.02)),
    var(--bg-2);
  animation: pop-in 0.35s ease-out;
}

@keyframes pop-in {
  from { transform: scale(0.97); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

.reveal-head {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.reveal.correct .reveal-head {
  color: var(--neon-green);
  text-shadow: 0 0 6px rgba(0, 255, 156, 0.35);
}

.reveal.wrong .reveal-head {
  color: var(--neon-magenta);
  text-shadow: 0 0 6px rgba(255, 46, 146, 0.35);
}

.reveal .user-ans {
  display: inline-block;
  padding: 1px 8px;
  border: 1px solid var(--neon-magenta);
  border-radius: 3px;
  color: var(--neon-magenta);
  font-family: var(--mono);
  font-weight: 700;
  margin: 0 4px;
  text-transform: none;
  letter-spacing: 0;
  text-shadow: none;
}

.reveal-term {
  font-size: clamp(22px, 5vw, 32px);
  font-weight: 700;
  color: var(--neon-yellow);
  text-shadow: 0 0 14px rgba(255, 215, 0, 0.5);
  letter-spacing: 0.04em;
  margin: 2px 0 10px;
}

.reveal-meaning {
  font-size: 13px;
  color: var(--text);
  line-height: 1.55;
  max-width: 540px;
  margin: 0 auto;
}

/* ============================================================
   Answer tiles (legacy — kept for compatibility, no longer used)
   ============================================================ */

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.ans {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  text-align: left;
  padding: 14px 14px 14px 38px;
  background: var(--bg-2);
  border: 1px solid var(--border-hi);
  border-radius: 4px;
  color: var(--text);
  cursor: pointer;
  position: relative;
  transition: all 0.12s ease;
  letter-spacing: 0.02em;
}

.ans::before {
  content: attr(data-key);
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--neon-cyan);
  font-weight: 700;
  font-size: 13px;
  width: 18px;
  text-align: center;
  border: 1px solid var(--neon-cyan);
  border-radius: 3px;
  line-height: 16px;
  padding: 0;
}

.ans:hover, .ans:focus-visible {
  border-color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.06);
  outline: none;
  box-shadow: var(--shadow-glow-cyan);
}

.ans.correct {
  border-color: var(--neon-green);
  background: rgba(0, 255, 156, 0.12);
  color: var(--neon-green);
  box-shadow: var(--shadow-glow-green);
  animation: flash-correct 0.5s ease-out;
}
.ans.correct::before {
  border-color: var(--neon-green);
  color: var(--neon-green);
}

.ans.wrong {
  border-color: var(--neon-magenta);
  background: rgba(255, 46, 146, 0.12);
  color: var(--neon-magenta);
  box-shadow: var(--shadow-glow-mag);
  animation: shake 0.45s ease-out;
}
.ans.wrong::before {
  border-color: var(--neon-magenta);
  color: var(--neon-magenta);
}

.ans.dim {
  opacity: 0.4;
  pointer-events: none;
}

.ans:disabled {
  cursor: default;
}

@keyframes flash-correct {
  0%   { background: rgba(0, 255, 156, 0.45); }
  100% { background: rgba(0, 255, 156, 0.12); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* ============================================================
   Feedback strip
   ============================================================ */

.feedback {
  margin-top: 18px;
  padding: 12px 14px;
  border-radius: 4px;
  font-size: 13px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  min-height: 44px;
  color: var(--text-dim);
}

.feedback.show-correct {
  border-color: var(--neon-green);
  color: var(--neon-green);
  text-shadow: 0 0 6px rgba(0, 255, 156, 0.3);
}
.feedback.show-wrong {
  border-color: var(--neon-magenta);
  color: var(--neon-magenta);
}

.feedback .term {
  color: var(--neon-yellow);
  font-weight: 700;
}

.feedback .meaning {
  display: block;
  margin-top: 6px;
  color: var(--text-dim);
  font-size: 12px;
  text-shadow: none;
}

.actions-row {
  margin-top: 16px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

/* ============================================================
   Game over screen
   ============================================================ */

.over {
  text-align: center;
  padding: 8px 4px;
}

.over h2 {
  font-size: 30px;
  color: var(--neon-magenta);
  text-shadow: var(--shadow-glow-mag);
  letter-spacing: 0.04em;
  margin: 6px 0 4px;
}

.over .subtitle {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 22px;
}

.over .final-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px auto 22px;
  max-width: 480px;
}

.over .stat {
  background: var(--bg-2);
  border: 1px solid var(--border-hi);
  border-radius: 6px;
  padding: 14px 8px;
}

.over .stat .num {
  font-size: 28px;
  font-weight: 700;
  color: var(--neon-green);
  text-shadow: var(--shadow-glow-green);
}
.over .stat.cyan .num   { color: var(--neon-cyan);   text-shadow: var(--shadow-glow-cyan); }
.over .stat.yellow .num { color: var(--neon-yellow); text-shadow: 0 0 12px rgba(255, 215, 0, 0.45); }

.over .stat .lbl {
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: 4px;
}

.over .rank {
  font-size: 15px;
  color: var(--neon-cyan);
  margin-bottom: 18px;
  letter-spacing: 0.04em;
}
.over .rank .badge {
  color: var(--neon-yellow);
  font-weight: 700;
}

/* ============================================================
   Small / mobile
   ============================================================ */

@media (max-width: 540px) {
  body { font-size: 14px; }
  .term-body { padding: 18px 14px 22px; }

  .hud { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .hud-cell { padding: 6px 6px; }
  .hud-cell .val { font-size: 15px; }
  .hud-cell .lbl { font-size: 9px; }

  .rebus { grid-template-columns: 1fr auto 1fr; gap: 6px; }
  .rebus-icon { min-height: 150px; padding: 22px 4px 8px; }
  .rebus-icon pre { font-size: 12px; }
  .rebus-plus { font-size: 22px; }

  .answers { grid-template-columns: 1fr; }
  .ans { font-size: 13px; padding: 12px 12px 12px 36px; }

  .answer-input { font-size: 16px; }
  .input-prompt { font-size: 16px; }
  .answer-form .caret { font-size: 16px; }
  .reveal { padding: 14px 12px 12px; }
  .reveal-term { font-size: 22px; }
  .reveal-meaning { font-size: 12px; }

  .splash h1 { font-size: 30px; }
  .splash .mascot { width: 130px; height: 130px; }

  .over .final-stats { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  .scanlines { display: none; }
}

/* Mobile fit — trim padding so the whole round fits without scrolling */
@media (max-width: 820px) {
  html, body { overflow-x: hidden; }
  #app { padding: 6px; align-items: flex-start; }
  .term-body { padding: 12px 14px 14px; }
  .splash .mascot { margin: 8px auto 4px; width: 116px; height: 116px; }
}

// Shuffle a small array (Fisher–Yates).
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Normalize an answer for comparison — strip everything but a–z and 0–9.
//   "A/B Testing!"  →  "abtesting"
//   "HEAT MAP"      →  "heatmap"
function normalizeAnswer(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

// Returns true if `input` matches any acceptable spelling of `term`.
function checkAnswer(input, term) {
  const norm = normalizeAnswer(input);
  if (!norm) return false;
  const accepted = (term.answers && term.answers.length ? term.answers : [term.term]);
  return accepted.some(a => normalizeAnswer(a) === norm);
}

// Derive the Data Jargon — synthesized SFX (Web Audio, no assets).
// Terminal/chiptune feel — square + triangle waves, short envelopes.
// Mute state persists in localStorage.

let ctx = null;
let muted = readMuted();

function readMuted() {
  try { return localStorage.getItem('datacruise.jargon.muted') === '1'; }
  catch { return false; }
}

function writeMuted() {
  try { localStorage.setItem('datacruise.jargon.muted', muted ? '1' : '0'); }
  catch { /* ignore */ }
}

function getCtx() {
  if (muted) return null;
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function tone({ freq, dur = 0.10, type = 'square', vol = 0.14, slide = 0, attack = 0.004, when = 0 }) {
  const c = getCtx();
  if (!c) return;
  const t0 = c.currentTime + when;
  const t1 = t0 + dur;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) {
    const endFreq = Math.max(20, freq + slide);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t1);
  }
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, t1);
  osc.connect(gain).connect(c.destination);
  osc.start(t0);
  osc.stop(t1 + 0.02);
}

function noiseBurst({ dur = 0.08, vol = 0.10, when = 0, cutoff = 1500 }) {
  const c = getCtx();
  if (!c) return;
  const t0 = c.currentTime + when;
  const samples = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, samples, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < samples; i++) data[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource();
  src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = cutoff;
  const gain = c.createGain();
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter).connect(gain).connect(c.destination);
  src.start(t0);
  src.stop(t0 + dur + 0.02);
}

// Pick a slightly randomized "tick" frequency so typing doesn't sound monotone.
function keyFreq() {
  // Around 1.4–1.8 kHz, like a soft mechanical keyboard
  return 1400 + Math.floor(Math.random() * 400);
}

const sfx = {
  // Per-character key click
  key() {
    tone({ freq: keyFreq(), dur: 0.018, type: 'square', vol: 0.05 });
  },
  // Hint reveal — short ascending arpeggio
  hint() {
    tone({ freq: 660, dur: 0.10, type: 'triangle', vol: 0.14 });

  },
  // Wrong — descending sawtooth + soft noise
  wrong() {

  timeout() {

  // Streak milestone
  streak() {
    tone({ freq: 988, dur: 0.08, type: 'square', vol: 0.13 });

function isMuted() { return muted; }

function toggleMuted() {
  muted = !muted;
  writeMuted();
  if (muted && ctx) {
    // Silence anything currently scheduled by suspending immediately.
    try { ctx.suspend(); } catch {}
  } else if (!muted && ctx) {
    try { ctx.resume(); } catch {}
  }
  return muted;
}

// Daily Puzzle helpers — one puzzle per day, deterministic, shareable.


const STORAGE_KEY = 'datacruise.jargon.daily';
const DAILY_EPOCH = new Date('2026-05-12T00:00:00Z'); // launch day → puzzle #1

// Today as YYYY-MM-DD in local time
function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Puzzle number since launch (1-indexed, never repeats until bank exhausts).
function puzzleNumberFor(date = new Date()) {
  const oneDay = 24 * 60 * 60 * 1000;
  const days = Math.floor((date.getTime() - DAILY_EPOCH.getTime()) / oneDay);
  return Math.max(1, days + 1);
}

// Deterministic puzzle for the given date.
function puzzleFor(date = new Date()) {
  const n = puzzleNumberFor(date);
  const idx = (n - 1) % TERMS.length;
  return { puzzle: TERMS[idx], number: n, dateKey: todayKey(date) };
}

// Read any saved record of today's attempt.
function readSavedAttempt(dateKey) {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (obj && obj.dateKey === dateKey) return obj;
  } catch { /* ignore */ }
  return null;
}

function writeSavedAttempt(record) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
  } catch { /* ignore */ }
}

// Build the share string the player can copy/paste anywhere.
// Single-attempt daily — one row: 🟩 solved, 🟥 missed.
function buildShareText({ number, dateKey, result, hintUsed }) {
  const head = `Derive the Data Jargon #${number} — ${dateKey}`;
  const row = result === 'correct' ? '🟩' : '🟥';
  const status = result === 'correct'
    ? (hintUsed ? 'solved (with hint 💡)' : 'solved ✓')
    : (hintUsed ? 'missed (used 💡)' : 'missed ✗');
  return [
    head,
    row,
    status,
    'datacruise.wordpress.com/data-quizzes'
  ].join('\n');
}

    score: 0,

    bestStreak: 0,
    lives: CONFIG.startingLives,
    roundIndex: 0,
    deck: [],
    current: null,
    revealMeaning: false,
    lastResult: null,           // 'correct' | 'wrong' | 'timeout'
    lastPointsEarned: 0,
    correctCount: 0,
    hintsUsedTotal: 0,
    dailyMeta: null             // { number, dateKey, result, attempted, hintUsed, shareText }
  };
}

function startGame(s) {
  s.mode = 'classic';
  s.score = 0;
  s.streak = 0;
  s.bestStreak = 0;
  s.lives = CONFIG.startingLives;
  s.roundIndex = 0;
  s.correctCount = 0;
  s.hintsUsedTotal = 0;
  s.lastResult = null;
  s.lastPointsEarned = 0;
  s.dailyMeta = null;
  s.deck = shuffle(TERMS).slice(0, CONFIG.roundsPerGame);
  s.screen = 'round';
  nextRound(s);
}

function startDailyGame(s, now = new Date()) {
  const { puzzle, number, dateKey } = puzzleFor(now);
  const saved = readSavedAttempt(dateKey);
  s.mode = 'daily';
  s.score = 0;
  s.streak = 0;
  s.bestStreak = 0;
  s.lives = 1;
  s.roundIndex = 0;
  s.correctCount = 0;
  s.hintsUsedTotal = 0;
  s.lastResult = null;
  s.lastPointsEarned = 0;
  s.deck = [puzzle];
  s.dailyMeta = { number, dateKey, puzzle: puzzle.term };

  if (saved) {
    // Already played today — jump straight to the result screen.
    s.dailyMeta = {
      number: saved.number || number,
      dateKey,
      puzzle: puzzle.term,
      result: saved.result,
      attempted: saved.attempted || '',
      hintUsed: !!saved.hintUsed,
      shareText: saved.shareText || buildShareText({
        number, dateKey, result: saved.result,
        hintUsed: !!saved.hintUsed
      })
    };
    s.lastResult = saved.result;
    s.current = null;
    s.screen = 'gameover';
    return;
  }

  s.screen = 'round';
  nextRound(s);
}

function nextRound(s) {
  if (s.mode === 'classic' && (s.lives <= 0 || s.roundIndex >= s.deck.length)) {
    s.screen = 'gameover';
    s.current = null;
    return;
  }
  if (s.mode === 'daily' && s.roundIndex >= s.deck.length) {
    s.screen = 'gameover';
    s.current = null;
    return;
  }
  const puzzle = s.deck[s.roundIndex];
  const seconds = s.mode === 'daily' ? CONFIG.dailySeconds : CONFIG.roundSeconds;
  s.current = {
    puzzle,
    timeLeftMs: seconds * 1000,
    locked: false,
    inputValue: '',
    hintUsed: false,
    submittedValue: ''
  };
  s.lastResult = null;
  s.lastPointsEarned = 0;
  s.revealMeaning = false;
}

function useHint(s) {
  const c = s.current;
  if (!c || c.locked || c.hintUsed) return;
  c.hintUsed = true;
  s.hintsUsedTotal += 1;
}

function submitAnswer(s, raw) {
  const c = s.current;
  if (!c || c.locked) return;
  const text = String(raw || '').trim();
  c.locked = true;
  c.submittedValue = text;
  const correct = !!text && checkAnswer(text, c.puzzle);
  if (correct) {
    const secondsLeft = Math.max(0, c.timeLeftMs / 1000);
    const speedBonus = Math.round(secondsLeft * CONFIG.speedBonusPerSecond);
    s.streak += 1;
    if (s.streak > s.bestStreak) s.bestStreak = s.streak;
    const streakBonus = (s.streak >= 2 ? (s.streak - 1) * CONFIG.streakBonus : 0);
    let earned = CONFIG.basePoints + speedBonus + streakBonus;
    if (c.hintUsed) earned = Math.max(0, earned - CONFIG.hintPenalty);
    s.score += earned;
    s.lastPointsEarned = earned;
    s.lastResult = 'correct';
    s.correctCount += 1;
  } else {
    s.streak = 0;
    s.lives -= 1;
    s.lastResult = 'wrong';
    s.lastPointsEarned = 0;
  }
  s.revealMeaning = true;

  if (s.mode === 'daily') persistDailyResult(s);
}

function timeout(s) {
  const c = s.current;
  if (!c || c.locked) return;
  c.locked = true;
  c.submittedValue = c.inputValue || '';
  s.streak = 0;
  s.lives -= 1;
  s.lastResult = 'timeout';
  s.lastPointsEarned = 0;
  s.revealMeaning = true;

  if (s.mode === 'daily') persistDailyResult(s);
}

function persistDailyResult(s) {
  const meta = s.dailyMeta;
  const c = s.current;
  if (!meta || !c) return;
  const result = (s.lastResult === 'correct') ? 'correct' : 'wrong';
  const shareText = buildShareText({
    number: meta.number,
    dateKey: meta.dateKey,
    result,
    hintUsed: !!c.hintUsed
  });
  const record = {
    dateKey: meta.dateKey,
    number: meta.number,
    result,
    attempted: c.submittedValue || '',
    hintUsed: !!c.hintUsed,
    shareText,
    savedAt: Date.now()
  };
  writeSavedAttempt(record);
  s.dailyMeta = {
    ...meta,
    result,
    attempted: record.attempted,
    hintUsed: record.hintUsed,
    shareText
  };
}

function advance(s) {
  s.roundIndex += 1;
  nextRound(s);
}

function rankFor(score) {
  if (score >= 1500) return { name: 'CHIEF DATA WIZARD',    color: 'yellow' };
  if (score >= 1100) return { name: 'SENIOR ANALYST',        color: 'green'  };
  if (score >= 700)  return { name: 'DATA APPRENTICE',       color: 'cyan'   };
  if (score >= 400)  return { name: 'JUNIOR DECODER',        color: 'cyan'   };
  return { name: 'ROOKIE — keep cruising', color: 'green' };
}

/* ==== main.js ==== */
// Derive the Data Jargon — entry point.
// Typed-input flow + classic / daily modes + sound effects.


const state = createState();
let timerHandle = null;
let advanceHandle = null;

function clearTimer() {
  if (timerHandle) {
    clearInterval(timerHandle);
    timerHandle = null;
  }
}

function clearAdvance() {
  if (advanceHandle) {
    clearTimeout(advanceHandle);
    advanceHandle = null;
  }
}

function totalSecondsForCurrent() {
  return state.mode === 'daily' ? CONFIG.dailySeconds : CONFIG.roundSeconds;
}

function startTimer() {
  clearTimer();
  const tick = CONFIG.tickMs;
  const total = totalSecondsForCurrent();
  timerHandle = setInterval(() => {
    if (!state.current || state.current.locked) return;
    state.current.timeLeftMs -= tick;
    if (state.current.timeLeftMs <= 0) {
      state.current.timeLeftMs = 0;
      clearTimer();
      timeout(state);
      sfx.timeout();
      draw();
      scheduleAutoAdvance();
    } else {
      updateTimerBar(state.current.timeLeftMs, total);
    }
  }, tick);
}

function scheduleAutoAdvance() {
  clearAdvance();
  // Daily mode: don't auto-advance — show result screen via explicit Next click.
  if (state.mode === 'daily') return;
  const ms = (state.lastResult === 'correct')
    ? CONFIG.revealMsCorrect
    : CONFIG.revealMsWrong;
  advanceHandle = setTimeout(() => {
    advanceHandle = null;
    if (state.screen === 'round') {
      advance(state);
      draw();
      if (state.screen === 'round') startTimer();
      else if (state.screen === 'gameover') {
        if (state.lives <= 0 || state.correctCount < state.deck.length / 2) sfx.gameover();
        else sfx.win();
      }
    }
  }, ms);
}

const handlers = {
  onStart: () => {
    clearAdvance();
    startGame(state);
    draw();
    startTimer();
  },
  onStartDaily: () => {
    clearAdvance();
    startDailyGame(state);
    draw();
    // If we jumped straight to result (already played today), no timer needed.
    if (state.screen === 'round') startTimer();
  },
  onSubmit: (text) => {
    if (!state.current || state.current.locked) return;
    clearTimer();
    sfx.submit();
    submitAnswer(state, text);
    if (state.lastResult === 'correct') sfx.correct();
    else sfx.wrong();
    draw();
    scheduleAutoAdvance();
  },
  onHint: () => {
    if (!state.current || state.current.locked || state.current.hintUsed) return;
    sfx.hint();
    useHint(state);
    draw();
  },
  onNext: () => {
    clearAdvance();
    advance(state);
    draw();
    if (state.screen === 'round') startTimer();
    else if (state.screen === 'gameover' && state.mode === 'classic') {
      if (state.lives <= 0 || state.correctCount < state.deck.length / 2) sfx.gameover();
      else sfx.win();
    }
  },
  onKeyTick: () => {
    sfx.key();
  },
  onQuit: () => {
    clearTimer();
    clearAdvance();
    state.screen = 'gameover';
    state.current = null;
    draw();
  },
  onHome: () => {
    clearTimer();
    clearAdvance();
    state.screen = 'splash';
    state.mode = 'classic';
    draw();
  },
  onToggleMute: () => {
    toggleMuted();
    // Update the mute icon without a full re-render by toggling text content.
    const btn = document.getElementById('btn-mute');
    if (btn) btn.textContent = isMuted() ? '🔇' : '🔊';
  }
};

function draw() {
  if (state.screen === 'splash') renderSplash(state, handlers);
  else if (state.screen === 'round') renderRound(state, handlers);
  else if (state.screen === 'gameover') renderGameOver(state, handlers);

  // Fire the shareable result once, the first draw after entering game-over.
  if (state.screen === 'gameover') {
    if (!draw._over) {
      draw._over = true;
      const solved = state.correctCount, totalQ = (state.deck && state.deck.length) || 10;
      const pct = totalQ ? solved / totalQ : 0;
      window.DataCruiseResult && DataCruiseResult.ready({
        slug: 'derive-jargon', game: 'Derive the Data Jargon',
        headline: state.score + ' pts',
        sub: solved + '/' + totalQ + ' words decoded 🔍',
        stars: pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : pct > 0 ? 1 : 0, starsMax: 3,
      });
    }
  } else {
    draw._over = false;
  }
}

// Keyboard:
//   - Splash / GameOver: Enter or Space → start (unless focus is in an input)
//   - Round (unlocked): Enter is handled by the form submit
//   - Round (locked):   Enter or Space → next round immediately
window.addEventListener('keydown', (e) => {
  if (state.screen === 'round' && state.current && state.current.locked) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      handlers.onNext();
    }
  } else if (state.screen === 'splash' && (e.key === 'Enter' || e.key === ' ')) {
    if (!isTextInputFocused()) {
      e.preventDefault();
      handlers.onStart();
    }
  } else if (state.screen === 'gameover' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    handlers.onStart();
  }
});

function isTextInputFocused() {
  const el = document.activeElement;
  return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
}

draw();

  })(document, "script", "gamemonetize-sdk");
}
function _gmResolve(ok) {
  if (!_gmPending) return;
  const g = _gmPending; _gmPending = null;
  clearTimeout(g.timer);
  if (typeof g.done === "function") g.done(!!ok);
}
function showRewardedAd(onReward) {
  const done = (ok) => { if (ok && typeof onReward === "function") onReward(); };
  if (_gmReady && typeof sdk !== "undefined" && sdk && typeof sdk.showBanner === "function") {

/* ==== Rewarded-ad hook ==== */
function _handleWatchAdContinue() {
  if (!(state && state.screen === 'gameover' && state.mode === 'classic' && (state.lives || 0) <= 0)) return;

            state.screen = 'round';

(function () {
  const seen = new WeakSet();
  const check = () => {
    if (!(state && state.screen === 'gameover' && state.mode === 'classic' && (state.lives || 0) <= 0)) return;
    const actions = document.querySelector(".end-actions, .card .actions, .game-over-actions, .actions-row");
    if (!actions || seen.has(actions)) return;
    if (actions.querySelector('[data-action="watch-ad-continue"]')) return;
    seen.add(actions);
    const btn = document.createElement("button");
    btn.className = "gold";
    btn.setAttribute("data-action", "watch-ad-continue");
    btn.textContent = "▶ WATCH AD → +1 LIFE";
    const refNode = actions.firstChild;
    actions.insertBefore(btn, refNode);
  };
  setInterval(check, 400);
}());

document.addEventListener("click", function (e) {
  const t = e.target.closest && e.target.closest("[data-action]");

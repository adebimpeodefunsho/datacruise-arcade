<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B78FE8"/>
      <stop offset="0.55" stop-color="#9265D8"/>
      <stop offset="1" stop-color="#6B3EB0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Stars sparkle -->
  <g fill="#FFF7E2" opacity="0.85">
    <circle cx="70" cy="70" r="2"/>
    <circle cx="140" cy="50" r="1.5"/>
    <circle cx="380" cy="60" r="2.5"/>
    <circle cx="450" cy="90" r="2"/>
    <circle cx="180" cy="120" r="1.5"/>
    <circle cx="60" cy="150" r="2"/>
    <circle cx="470" cy="170" r="1.5"/>
    <circle cx="30" cy="220" r="1.5"/>
    <circle cx="490" cy="240" r="2"/>
    <circle cx="20" cy="330" r="1.5"/>
  </g>

  <!-- Rebus tiles: ▲ + BOX + PLOT = "▲ Boxplot" -->
  <g transform="translate(256, 250)">
    <rect x="-210" y="-64" width="420" height="128" rx="18" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Triangle -->
    <polygon points="-160,-16 -136,-16 -148,-38" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <text x="-148" y="18" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#1A1A1A">TRIANGLE</text>
    <!-- Plus -->
    <text x="-80" y="-6" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#6B3EB0">+</text>
    <!-- Box -->
    <rect x="-30" y="-36" width="60" height="40" fill="#5DC1E8" stroke="#1A1A1A" stroke-width="2.5"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#1A1A1A">BOX</text>
    <text x="0" y="24" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="12" font-weight="900" fill="#1A1A1A">BOX</text>
    <!-- Plus -->
    <text x="60" y="-6" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#6B3EB0">+</text>
    <!-- Plot -->
    <g transform="translate(140, -18)">
      <rect x="-40" y="-16" width="80" height="42" fill="#2BB673" stroke="#1A1A1A" stroke-width="2.5"/>
      <circle cx="-24" cy="10" r="2.5" fill="#FFF"/>
      <circle cx="-12" cy="4" r="2.5" fill="#FFF"/>
      <circle cx="4" cy="-6" r="2.5" fill="#FFF"/>
      <circle cx="18" cy="12" r="2.5" fill="#FFF"/>
      <circle cx="28" cy="0" r="2.5" fill="#FFF"/>
    </g>
    <text x="140" y="24" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="12" font-weight="900" fill="#1A1A1A">PLOT</text>
  </g>

  <!-- Answer blanks -->
  <g transform="translate(256, 356)">
    <rect x="-176" y="-24" width="352" height="48" rx="12" fill="#1A1A1A"/>
    <text x="0" y="8" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#FFC500" letter-spacing="6">▲ B O X _ L O T</text>
  </g>

  <!-- Timer/lives -->
  <g transform="translate(256, 410)">
    <text x="-70" y="4" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#FFC500">❤ ❤ ❤</text>
    <text x="70" y="4" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#FFF7E2">R 3/10</text>
  </g>

  <!-- Magni (bee) mascot bottom-left -->
  <g transform="translate(90, 445)">
    <!-- Wings -->
    <ellipse cx="-16" cy="-16" rx="16" ry="10" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.5"/>
    <ellipse cx="16" cy="-16" rx="16" ry="10" fill="#FFF" opacity="0.55" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="8" rx="26" ry="30" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Stripes -->
    <path d="M -22 0 L 22 0" stroke="#1A1A1A" stroke-width="4"/>
    <path d="M -22 16 L 22 16" stroke="#1A1A1A" stroke-width="4"/>
    <!-- Head (round brown) -->
    <circle cx="0" cy="-24" r="16" fill="#7A4F2E" stroke="#1A1A1A" stroke-width="3"/>
    <!-- Antennae -->
    <path d="M -6 -38 Q -12 -46 -8 -52" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="-8" cy="-52" r="2.5" fill="#1A1A1A"/>
    <path d="M 6 -38 Q 12 -46 8 -52" fill="none" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="8" cy="-52" r="2.5" fill="#1A1A1A"/>
    <!-- Eyes -->
    <circle cx="-5" cy="-24" r="3" fill="#FFF"/>
    <circle cx="5" cy="-25" r="3" fill="#FFF"/>
    <circle cx="-5" cy="-25" r="1.5" fill="#1A1A1A"/>
    <circle cx="5" cy="-26" r="1.5" fill="#1A1A1A"/>
    <!-- Little smile -->
    <path d="M -4 -20 Q 0 -17 4 -20" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
    <!-- Stinger -->
    <polygon points="-6,38 6,38 0,50" fill="#1A1A1A"/>
  </g>

  <!-- Title panel -->
  <g transform="translate(256, 90)">
    <rect x="-220" y="-42" width="440" height="86" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">DERIVE THE</text>
    <text x="0" y="22" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#FFC500" letter-spacing="2">DATA JARGON</text>
    <text x="0" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE WORD GAMES · #1</text>
  </g>
</svg>

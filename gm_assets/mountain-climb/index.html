  <style>
/* Bug-Bug's Mountain Climb — v4 orange palette, cozy with white plot */

* { box-sizing: border-box; }

:root {
  --bg-top: #E8F2F4;
  --bg-mid: #FCEFD6;
  --bg-bot: #FFF6E4;

  --card-top: #FFD58A;
  --card-bot: #FF9F3D;

  --ribbon-top: #FF8A6B;
  --ribbon-bot: #E55564;

  --text-strong: #2C3E50;
  --text-warm: #5C2A0F;
  --text-fade: #7A4A0F;

  --line-grad: #A82B1A;
  --summit-line: #A82B1A;
  --gridline: #E0CFA8;
  --plot-bg: #FFFFFF;

  --rest-top: #C9DEEE;
  --rest-bot: #A8C4D9;
  --climb-top: #FFD27A;
  --climb-bot: #FFA84A;
  --sprint-top: #86E3B9;
  --sprint-bot: #3FB07A;

  --shadow: 0 6px 12px rgba(122, 58, 15, 0.28);
  --shadow-sm: 0 2px 4px rgba(63, 74, 92, 0.22);

  --card-radius: 22px;
  --max-width: 1400px;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: "Fredoka", "Quicksand", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  color: var(--text-strong);
  background:
    radial-gradient(circle at 80% 0%, #FFD58A 0%, transparent 50%),
    linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bot) 100%);
  min-height: 100vh;
}

button { font-family: inherit; cursor: pointer; }

.defs-only { width: 0; height: 0; position: absolute; }

#app {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 24px 20px 40px;
}

/* ============== TITLE SCREEN ============== */

.title-screen {
  display: grid;
  place-items: center;
  min-height: 86vh;
}

.title-card {
  background: linear-gradient(180deg, var(--card-top), var(--card-bot));
  border-radius: 32px;
  box-shadow: var(--shadow);
  padding: 48px 56px;
  max-width: 560px;
  text-align: center;
  color: var(--text-strong);
}

.title-bug {
  width: 120px;
  height: 110px;
  margin: 0 auto 8px;
  display: block;
}

.title-heading {
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 1.5px;
  margin: 8px 0 4px;
  line-height: 1.1;
  color: var(--text-strong);
}

.title-subtitle {
  margin: 0 0 24px;
  color: var(--text-warm);
  font-weight: 600;
  font-size: 14px;
}

.primary-btn {
  background: linear-gradient(180deg, #86E3B9, #3FB07A);
  color: #FFFDF7;
  border: none;
  padding: 18px 44px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1.5px;
  border-radius: 24px;
  box-shadow: 0 8px 16px rgba(63, 176, 122, 0.45);
  transition: transform 80ms ease, box-shadow 80ms ease;
}

.primary-btn:hover { transform: translateY(-2px); }
.primary-btn:active { transform: translateY(1px); box-shadow: 0 4px 8px rgba(63, 176, 122, 0.45); }

.ghost-btn {
  background: #FFFDF7;
  color: var(--text-warm);
  border: 2px solid var(--text-warm);
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 800;
  border-radius: 18px;
  letter-spacing: 1px;
}

.ghost-btn code { font-family: "JetBrains Mono", "Menlo", monospace; font-size: 12px; }

.title-best {
  margin: 16px 0 0;
  color: var(--text-warm);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.best-stars {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.best-star {
  font-size: 28px;
  line-height: 1;
  display: inline-block;
  transition: transform 200ms ease;
}
.best-star.filled {
  /* Bright yellow emoji + glow for achieved star slots */
  filter: drop-shadow(0 0 6px rgba(255, 201, 77, 0.7));
}
.best-star.empty {
  /* Visibly dim 'not yet earned' slot — distinguishable from filled at
     a glance so the player can see their progress toward 3 stars.
     Dark gold-grey, partial opacity. */
  color: #8b7355;
  opacity: 0.5;
  font-weight: 900;
}

.title-howto {
  margin-top: 24px;
  text-align: left;
  background: #FFFDF7;
  border-radius: 16px;
  padding: 12px 18px;
}

.title-howto summary { cursor: pointer; font-weight: 800; color: var(--text-strong); }
.title-howto ul { margin: 8px 0 0 0; padding-left: 18px; color: var(--text-warm); line-height: 1.6; font-size: 14px; }

/* ============== GAME SCREEN ============== */

.game-screen { display: grid; gap: 16px; }

.card {
  background: linear-gradient(180deg, var(--card-top), var(--card-bot));
  border-radius: var(--card-radius);
  box-shadow: var(--shadow);
}

/* ----- Status bar ----- */

.status-bar {
  display: grid;
  grid-template-columns: 2fr 1fr 1.4fr 1fr 1.2fr;
  align-items: center;
  gap: 16px;
  padding: 14px 22px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-bug { width: 56px; height: 42px; }

.brand h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 1.2px;
  color: var(--text-strong);
}

.brand p {
  margin: 2px 0 0;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-warm);
}

.brand code {
  background: #FFFDF7;
  padding: 1px 6px;
  border-radius: 6px;
  font-family: "JetBrains Mono", "Menlo", monospace;
  font-size: 11px;
}

.day-pill {
  background: linear-gradient(180deg, var(--ribbon-top), var(--ribbon-bot));
  color: #FFFDF7;
  border-radius: 18px;
  padding: 10px 18px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.day-pill .label { font-size: 10px; font-weight: 900; letter-spacing: 2px; display: block; color: #FFE8D6; }
.day-pill strong { font-size: 22px; font-weight: 900; }

.stat { text-align: center; color: var(--text-warm); }
.stat .label { font-size: 10px; font-weight: 900; letter-spacing: 2px; display: block; margin-bottom: 4px; }
.stat-altitude strong { font-size: 22px; font-weight: 900; color: var(--line-grad); }

.hearts { display: flex; gap: 4px; justify-content: center; }
.hearts .heart { width: 28px; height: 24px; }

.stat-progress { color: #FFFDF7; }
.stat-progress .label { color: var(--text-warm); }
.progress-bar { width: 120px; height: 14px; border-radius: 7px; background: #FFFDF7; margin: 4px auto 4px; overflow: hidden; }
.progress-bar .fill { height: 100%; background: linear-gradient(180deg, var(--sprint-top), var(--sprint-bot)); transition: width 280ms ease; }
.stat-progress strong { font-size: 16px; font-weight: 900; color: var(--text-warm); }

/* ----- Game main grid (chart + side column) ----- */

.game-main {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
  gap: 16px;
}

@media (max-width: 980px) {
  .status-bar { grid-template-columns: 1fr 1fr; }
  .game-main { grid-template-columns: 1fr; }
}

/* ----- Chart card ----- */

.chart-card { padding: 22px 26px 18px; }

.chart-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.chart-head h2 { margin: 0; font-size: 22px; font-weight: 900; color: var(--text-strong); }
.chart-head p { margin: 4px 0 0; font-size: 13px; color: var(--text-warm); font-weight: 600; }

.avg-pill {
  background: #FFFDF7;
  border-radius: 18px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-warm);
  white-space: nowrap;
}

.chart-wrap { width: 100%; }
.chart { width: 100%; height: auto; display: block; }

.plot-bg { fill: var(--plot-bg); }
.grid-line { stroke: var(--gridline); stroke-width: 1.2; opacity: 0.85; }
.summit-line { stroke: var(--summit-line); stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; }
.summit-label { font-size: 12px; font-weight: 900; fill: var(--text-fade); letter-spacing: 2px; }

.y-tick { font-size: 12px; font-weight: 700; fill: var(--text-warm); }

.climb-line { fill: none; stroke: var(--line-grad); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 0 rgba(122,42,15,0.15)); }

.day-marker.done circle { fill: #FFFDF7; stroke: var(--line-grad); stroke-width: 4; filter: drop-shadow(0 2px 2px rgba(122,42,15,0.3)); }
.day-marker .dot-gain { font-size: 12px; font-weight: 900; fill: var(--line-grad); }
.day-marker .dot-action { font-size: 16px; }

.day-marker.current .pulse-ring { fill: none; stroke: var(--line-grad); stroke-width: 2.5; stroke-dasharray: 3 4; animation: pulse 1.4s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { opacity: 0.4; r: 18; }
  50% { opacity: 1; r: 22; }
}

.future-dot { fill: #FFFDF7; stroke: #C9A87A; stroke-width: 2; stroke-dasharray: 2 3; opacity: 0.6; }

.day-label { font-size: 13px; font-weight: 700; fill: var(--text-warm); }
.day-label.current { fill: var(--line-grad); font-weight: 900; }
.day-label.future { opacity: 0.45; }
.day-label.past { opacity: 0.85; }

.x-axis-title { font-size: 11px; font-weight: 700; fill: var(--text-warm); letter-spacing: 2px; }

/* ----- Forecast card ----- */

.forecast-card { padding: 18px 22px; }
.forecast-card h3 { margin: 0 0 14px; font-size: 12px; font-weight: 900; letter-spacing: 2px; color: var(--text-warm); }
.forecast-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }

.weather-tile {
  background: #FFF1C2;
  border: 2px solid #F4B83A;
  border-radius: 16px;
  padding: 14px 8px 10px;
  text-align: center;
}
.weather-tile.weather-sunny { background: #FFF1C2; border-color: #F4B83A; color: #9A6A1F; }
.weather-tile.weather-cloudy { background: #E8ECF3; border-color: #A5B0C2; color: #4B5567; }
.weather-tile.weather-storm { background: #E2E7EF; border-color: #7E8DA0; color: #3F4A5C; }
.weather-tile.empty { background: #FFFDF7; border-color: #D9C7A6; color: var(--text-warm); }

.weather-tile svg { width: 60px; height: 60px; }
.weather-tile .label { font-size: 11px; font-weight: 900; letter-spacing: 2px; display: block; margin-top: 4px; }
.weather-tile strong { font-size: 14px; font-weight: 900; display: block; margin-top: 2px; }
.weather-tile p { margin: 4px 0 0; font-size: 11px; font-weight: 700; }

.forecast-arrow { font-size: 22px; font-weight: 900; color: #FFFDF7; }

/* ----- Action card ----- */

.action-card { padding: 18px 22px; display: grid; gap: 10px; }
.action-card h3 { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 2px; color: var(--text-warm); }
.action-card .action-prompt { margin: 0 0 6px; font-size: 18px; font-weight: 900; color: var(--text-strong); }

.action-btn {
  display: grid;
  grid-template-columns: 50px 1fr auto;
  align-items: center;
  gap: 4px 12px;
  padding: 14px 18px;
  border: none;
  border-radius: 20px;
  text-align: left;
  color: #FFFDF7;
  font-family: inherit;
  font-weight: 700;
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: transform 80ms ease, box-shadow 80ms ease, opacity 120ms ease;
}

.action-btn:hover:not([disabled]) { transform: translateY(-2px); }
.action-btn:active:not([disabled]) { transform: translateY(1px); }

.action-btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
  filter: grayscale(0.3);
}

.action-btn .emoji { font-size: 30px; line-height: 1; }
.action-btn .label { font-size: 20px; font-weight: 900; grid-row: 1; grid-column: 2; }
.action-btn .meta { font-size: 12px; font-weight: 700; opacity: 0.95; grid-row: 2; grid-column: 2; }

.action-rest { background: linear-gradient(180deg, var(--rest-top), var(--rest-bot)); color: var(--text-strong); }
.action-rest .meta { color: #3F4A5C; }
.action-climb { background: linear-gradient(180deg, var(--climb-top), var(--climb-bot)); }
.action-sprint { background: linear-gradient(180deg, var(--sprint-top), var(--sprint-bot)); box-shadow: 0 6px 14px rgba(63, 176, 122, 0.45); }

.badge-best {
  display: inline-block;
  margin-left: 8px;
  background: #FFE564;
  color: var(--text-warm);
  font-size: 10px;
  font-weight: 900;
  padding: 2px 10px;
  border-radius: 10px;
  letter-spacing: 1.5px;
  vertical-align: middle;
}

.action-hint {
  margin: 4px 0 0;
  font-size: 12px;
  font-weight: 700;
  color: #FFFDF7;
  text-align: center;
  font-style: italic;
}

/* ----- Tip footer ----- */

.tip-card { padding: 16px 22px; display: grid; grid-template-columns: 1.6fr 1fr; align-items: center; gap: 18px; }
@media (max-width: 780px) { .tip-card { grid-template-columns: 1fr; } }
.tip-card .label { font-size: 11px; font-weight: 900; letter-spacing: 2px; color: var(--text-warm); display: block; margin-bottom: 4px; }
.tip-text { margin: 0; font-size: 16px; font-weight: 900; color: var(--text-strong); }
.tip-sub { margin: 4px 0 0; font-size: 13px; color: var(--text-warm); font-weight: 600; }
.recent .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip {
  background: #FFE5B2;
  border: 1.5px solid #E5A024;
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 800;
  color: var(--text-fade);
}
.chip.dim { opacity: 0.5; }

/* ============== END SCREEN ============== */

.end-screen {
  display: grid;
  place-items: center;
  padding: 24px 0;
}

.end-card {
  padding: 32px 40px;
  max-width: 880px;
  text-align: center;
}

.end-headline {
  margin: 0;
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--text-strong);
}
.end-headline.won { color: var(--text-strong); }
.end-headline.lost { color: var(--text-warm); }

.end-stars { font-size: 32px; margin: 8px 0 4px; letter-spacing: 8px; }
.end-sub { margin: 0 0 20px; font-size: 16px; color: var(--text-warm); font-weight: 700; }

.end-recap {
  list-style: none;
  padding: 0;
  margin: 18px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.end-recap li {
  background: #FFFDF7;
  border-radius: 14px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-warm);
}

.end-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }

/* ============== SOUND TOGGLE + SUCCESS MESSAGE ============== */

.mute-toggle {
  background: #FFFDF7;
  border: 2px solid var(--text-warm);
  width: 44px;
  height: 44px;
  font-size: 22px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  transition: transform 80ms ease;
}
.mute-toggle:hover { transform: translateY(-1px); }
.mute-toggle:active { transform: translateY(1px); }

/* Floating in the corner of the title or end card */
.mute-toggle-floating {
  position: absolute;
  top: 16px;
  right: 16px;
}
.title-card, .end-card { position: relative; }

/* Sits inside the game header next to the progress bar */
.mute-toggle-header {
  justify-self: end;
  align-self: center;
}

.end-success {
  margin: 0 0 14px;
  padding: 12px 22px;
  background: #FFE564;
  border: 2px solid #E5A024;
  border-radius: 16px;
  display: inline-block;
  font-size: 17px;
  font-weight: 900;
  color: var(--text-warm);
  box-shadow: var(--shadow-sm);
}

/* Header grid: brand | day | stamina | altitude | progress | mute */
.status-bar {
  grid-template-columns: 1.7fr 0.7fr 1.4fr 1fr 1.2fr auto;
}
@media (max-width: 980px) {
  .status-bar { grid-template-columns: 1fr 1fr auto; }
  .mute-toggle-header { grid-column: span 1; }
}

/* ========================================================
   New stamina pip display (replaces hearts)
======================================================== */
.stamina-display {
  display: flex;
  align-items: baseline;
  gap: 4px;
  flex-wrap: wrap;
}
.stamina-num {
  font-size: 22px;
  font-weight: 900;
  color: var(--text-strong);
  line-height: 1;
}
.stamina-of {
  font-size: 12px;
  color: var(--text-warm);
  font-weight: 700;
}
.stamina-pips {
  display: flex;
  gap: 2px;
  margin-top: 4px;
  flex-basis: 100%;
}
.stamina-pip {
  width: 10px;
  height: 14px;
  border: 1.5px solid #0e0e10;
  border-radius: 3px;
}
.stamina-pip.filled { background: #ff6a00; }
.stamina-pip.spent { background: #fff; opacity: 0.35; }

/* ========================================================
   Sprint counter — two lightning bolts
======================================================== */
.sprint-counter {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.sprint-num {
  font-size: 22px;
  font-weight: 900;
  color: var(--text-strong);
  line-height: 1;
}
.sprint-bolts { display: flex; gap: 2px; font-size: 18px; line-height: 1; }
.sprint-bolt.used { opacity: 0.2; filter: grayscale(1); }
.sprint-bolt.available { animation: pulse-bolt 1.8s ease-in-out infinite; }
@keyframes pulse-bolt {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
  50% { transform: scale(1.12); filter: drop-shadow(0 0 4px rgba(255, 200, 80, 0.6)); }
}

/* ========================================================
   10-day forecast strip
======================================================== */
.forecast-strip {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 12px 18px;
  margin: 0 0 16px;
  flex-wrap: wrap;
}
.forecast-label {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--text-warm);
  flex-shrink: 0;
}
.forecast-days {
  display: flex;
  gap: 6px;
  flex: 1;
  min-width: 0;
}
.forecast-day {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 4px;
  border-radius: 8px;
  border: 2px solid var(--text-strong);
  background: #fff;
  font-size: 12px;
  font-weight: 800;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.forecast-day .forecast-num { font-size: 10px; color: var(--text-warm); }
.forecast-day .forecast-icon { font-size: 20px; line-height: 1; }
.forecast-day.forecast-sunny  { background: #fff3d6; }
.forecast-day.forecast-cloudy { background: #f0f1f5; }
.forecast-day.forecast-storm  { background: #dde0eb; opacity: 0.75; }
.forecast-day.past {
  opacity: 0.45;
  filter: grayscale(0.4);
}
.forecast-day.current {
  transform: scale(1.18);
  z-index: 1;
  box-shadow: 0 4px 0 0 var(--text-strong);
  border-width: 3px;
}
.forecast-day.future { /* default */ }
.forecast-legend {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: var(--text-warm);
  font-weight: 700;
  flex-shrink: 0;
}
.legend-item { display: inline-flex; align-items: center; gap: 3px; }
.legend-icon { font-size: 14px; }

@media (max-width: 700px) {
  .forecast-strip { gap: 10px; padding: 10px 12px; }
  .forecast-label { flex-basis: 100%; }
  .forecast-legend { flex-basis: 100%; justify-content: center; }
  .forecast-day { padding: 4px 2px; }
  .forecast-day .forecast-icon { font-size: 16px; }
}

/* ========================================================
   Today card — replaces old today/tomorrow forecast card
======================================================== */
.today-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px;
  gap: 4px;
  text-align: center;
}
.today-card svg { width: 70px; height: 70px; }
.today-label {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--text-warm);
}
.today-name {
  font-size: 22px;
  font-weight: 900;
  color: var(--text-strong);
  margin-top: 2px;
}
.today-hint {
  margin: 0;
  font-size: 13px;
  color: var(--text-warm);
}
.today-card.weather-sunny  { background: linear-gradient(180deg, #fff3d6, #fff8f1); }
.today-card.weather-cloudy { background: linear-gradient(180deg, #f0f1f5, #fff8f1); }
.today-card.weather-storm  { background: linear-gradient(180deg, #d9deeb, #fff8f1); }

/* ========================================================
   How-to-play body (title screen)
======================================================== */
.howto-body {
  margin-top: 12px;
  text-align: left;
  font-size: 14px;
  line-height: 1.55;
  color: var(--text-warm);
}
.howto-body h4 {
  margin: 14px 0 6px;
  font-size: 13px;
  font-weight: 900;
  color: var(--text-strong);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.howto-body p { margin: 0 0 8px; }
.howto-body strong { color: var(--text-strong); }
.howto-body em { font-style: italic; }
.howto-body ul {
  list-style: none;
  margin: 4px 0 0;
  padding: 0;
}
.howto-body li {
  padding: 4px 0;
}
.howto-weather li { display: flex; align-items: center; gap: 8px; }
.howto-icon { font-size: 18px; flex-shrink: 0; }
.howto-actions li, .howto-math li {
  padding-left: 4px;
}
.howto-goal {
  background: #ffe0b3;
  border: 2px solid var(--text-strong);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 10px !important;
}
.howto-hook {
  background: #fff3d6;
  border: 2px solid var(--text-strong);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 12px !important;
}
.howto-tip {
  background: #e8f4ea;
  border: 2px solid var(--text-strong);
  border-radius: 10px;
  padding: 10px 14px;
  margin-top: 14px !important;
  font-size: 13px;
}

/* ========================================================
   Pick-a-card area
======================================================== */
.cards-card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 18px;
}
.cards-card h3 {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--text-warm);
}
.cards-prompt {
  margin: 0 0 14px;
  font-size: 14px;
  color: var(--text-warm);
}
.cards-description {
  margin: 8px 0 14px;
  font-size: 14px;
  color: var(--text-strong);
  line-height: 1.5;
}
.reveal-headline {
  display: inline-block;
  margin: 6px 0 6px;
  font-weight: 900;
  padding: 6px 12px;
  border-radius: 999px;
  border: 2px solid var(--text-strong);
  font-size: 13px;
  letter-spacing: 0.05em;
}
.reveal-headline.safe   { background: #d8f3dc; color: #1b4332; }
.reveal-headline.hazard { background: #ffd6d6; color: #7f1d1d; }

.card-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 4px 0 12px;
}

/* ----- Face-down card (clickable) ----- */
.pick-card.face-down {
  appearance: none;
  background: none;
  padding: 0;
  font: inherit;
  cursor: pointer;
  border: none;
}
.pick-card.face-down .card-back {
  aspect-ratio: 3 / 4;
  border-radius: 14px;
  border: 3px solid var(--text-strong);
  background: linear-gradient(160deg, #2a2d44, #0f1124);
  box-shadow: 0 5px 0 0 var(--text-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.pick-card.face-down .card-back::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 2px dashed rgba(255, 255, 255, 0.2);
  border-radius: 10px;
}
.pick-card.face-down:hover .card-back {
  transform: translateY(-3px);
  box-shadow: 0 8px 0 0 var(--text-strong);
}
.pick-card.face-down:active .card-back {
  transform: translateY(2px);
  box-shadow: 0 2px 0 0 var(--text-strong);
}
.card-back-q {
  font-size: 56px;
  font-weight: 900;
  color: #ffc94d;
  text-shadow: 0 0 18px rgba(255, 201, 77, 0.5);
  font-family: ui-rounded, system-ui, sans-serif;
}

/* ----- Revealed card ----- */
.pick-card.revealed .card-front {
  aspect-ratio: 3 / 4;
  border-radius: 14px;
  border: 3px solid var(--text-strong);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 6px;
  box-shadow: 0 4px 0 0 var(--text-strong);
  animation: card-flip-in 0.3s ease-out;
  transform-origin: center;
}
.pick-card.revealed.is-safe   .card-front { background: linear-gradient(180deg, #ecfdf5, #d1fae5); }
.pick-card.revealed.is-hazard .card-front { background: linear-gradient(180deg, #fef2f2, #fecaca); }
.pick-card.revealed.is-picked .card-front {
  outline: 4px solid #ffc94d;
  outline-offset: 2px;
  transform: scale(1.04);
  z-index: 1;
}
.pick-card.revealed.is-other .card-front {
  opacity: 0.7;
  filter: saturate(0.7);
}
@keyframes card-flip-in {
  from { transform: rotateY(90deg); opacity: 0; }
  to   { transform: rotateY(0deg);  opacity: 1; }
}
.pick-card.revealed.is-picked .card-front {
  animation: card-flip-picked 0.5s ease-out;
}
@keyframes card-flip-picked {
  0%   { transform: rotateY(90deg) scale(0.9); opacity: 0; }
  60%  { transform: rotateY(0deg)  scale(1.1); opacity: 1; }
  100% { transform: rotateY(0deg)  scale(1.04); opacity: 1; }
}
.card-icon {
  font-size: 32px;
  line-height: 1;
}
.card-label {
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  color: var(--text-strong);
  line-height: 1.2;
  padding: 0 2px;
}
.card-badge {
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: 999px;
  border: 2px solid var(--text-strong);
  margin-top: 2px;
}
.pick-card.revealed.is-safe   .card-badge { background: #34d399; color: #022c22; }
.pick-card.revealed.is-hazard .card-badge { background: #f87171; color: #450a0a; }

.continue-btn {
  width: 100%;
  margin-top: 4px;
}

/* Stamina hearts (3 hearts, fewer than the old pip display) */
.stamina-hearts {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}
.stamina-heart { font-size: 20px; line-height: 1; }
.stamina-heart.lost { filter: grayscale(1); opacity: 0.4; }

/* Hazard markers on the chart */
.day-marker.done.hazard circle {
  fill: #fef2f2;
  stroke: #b91c1c;
  stroke-width: 3;
}
.day-marker.done.safe circle {
  fill: #ecfdf5;
  stroke: #047857;
  stroke-width: 3;
}
.dot-icon { font-size: 16px; }
.dot-gain.hazard {
  fill: #b91c1c;
  font-weight: 900;
}
.dot-gain.safe {
  fill: #047857;
  font-weight: 900;
}
.y-axis-title {
  font-size: 14px;
  font-weight: 900;
  fill: var(--text-warm);
  letter-spacing: 0.05em;
}

/* Forecast: show pick result on past days */
.forecast-day .forecast-pick {
  position: absolute;
  top: -6px;
  right: -6px;
  font-size: 11px;
  background: #fff;
  border: 1.5px solid #0e0e10;
  border-radius: 999px;
  padding: 1px 4px;
  line-height: 1;
}
.forecast-day .forecast-pick.hazard { background: #fecaca; }
.forecast-day .forecast-pick.safe   { background: #d1fae5; }
.forecast-day { position: relative; }

/* Footer chip variants */
.chip.chip-safe   { background: #d1fae5; border-color: #047857; color: #022c22; }
.chip.chip-hazard { background: #fecaca; border-color: #b91c1c; color: #450a0a; }

@media (max-width: 600px) {
  .card-row { gap: 6px; }
  .card-back-q { font-size: 40px; }
  .card-icon { font-size: 26px; }
  .card-label { font-size: 10px; }
}

/* Today card — sleeping vs active variant */
.today-card.sleeping {
  background: linear-gradient(180deg, #2e324a, #1c1f33);
  color: #fff;
  border-color: #0e0e10;
}
.today-card.sleeping .today-label { color: #b9bdd5; }
.today-card.sleeping .today-name  { color: #fff; }
.today-card.sleeping .today-hint  { color: #c4c8e0; }
.today-sleep-icon {
  font-size: 64px;
  line-height: 1;
  margin: 6px 0;
  animation: gentle-bob 2.6s ease-in-out infinite;
}
@keyframes gentle-bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* Forecast tiles — sleep days look subdued */
.forecast-day.forecast-cloudy { background: #e8eaf2; }
.forecast-day.forecast-storm  { background: #d9deeb; }
.forecast-day.forecast-cloudy .forecast-icon,
.forecast-day.forecast-storm  .forecast-icon {
  opacity: 0.85;
}

/* ========================================================
   Slide-back animation (on loss)
   The dashed line draws itself from the final position back
   to (day 1, 0). Bug-Bug fades in at the start point.
======================================================== */
.slide-back-line {
  fill: none;
  stroke: #b91c1c;
  stroke-width: 3;
  stroke-dasharray: 8 6;
  stroke-linecap: round;
  opacity: 0.85;
  /* Animate a stroke-dashoffset reveal */
  stroke-dashoffset: 1200;
  animation: slide-draw 1.4s ease-out 0.3s forwards;
}
@keyframes slide-draw {
  to { stroke-dashoffset: 0; }
}

.slide-back-bug {
  opacity: 0;
  animation: slide-bug-in 0.4s ease-out 1.55s forwards;
}
@keyframes slide-bug-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.slide-back-label {
  fill: #b91c1c;
  font-weight: 800;
  font-size: 16px;
}

/* Victory trophy — pops in over Bug-Bug's final landing dot on a win */
.victory-trophy {
  transform-box: fill-box;
  transform-origin: center;
  animation: trophy-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
}
@keyframes trophy-pop {
  0%   { opacity: 0; }
  60%  { opacity: 1; }
  100% { opacity: 1; }
}

/* Altitude badge under the victory trophy */
.victory-altitude-badge .badge-bg {
  fill: #ffc94d;
  stroke: #0e0e10;
  stroke-width: 2.5;
}
.victory-altitude-badge .badge-text {
  fill: #0e0e10;
  font-weight: 900;
  font-size: 14px;
  font-family: ui-rounded, system-ui, sans-serif;
}

/* Stamina-out callout — bug stays put, banner appears at top of chart */
.stamina-out-callout {
  animation: callout-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
}
@keyframes callout-pop {
  0%   { opacity: 0; transform-origin: center; }
  100% { opacity: 1; }
}
.stamina-out-callout .callout-bg {
  fill: #7f1d1d;
  stroke: #0e0e10;
  stroke-width: 3;
  filter: drop-shadow(0 4px 0 rgba(14, 14, 16, 0.4));
}
.stamina-out-callout .callout-text {
  fill: #fff;
  font-weight: 900;
  font-size: 16px;
  letter-spacing: 0.04em;
  font-family: ui-rounded, system-ui, sans-serif;
}

.stuck-bug {
  animation: stuck-fade 0.4s ease-out 0.1s both;
}
@keyframes stuck-fade {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* Exhausted-finish trophy variant — slightly faded + softer badge */
.victory-trophy.exhausted {
  opacity: 0.85;
}
.victory-trophy.exhausted .badge-bg {
  fill: #f4a261;
}
.victory-trophy.exhausted .badge-text {
  fill: #5a1f00;
}

/* Half-star badge on the end screen */
.exhausted-badge {
  display: inline-block;
  background: #f4a261;
  color: #5a1f00;
  font-weight: 900;
  letter-spacing: 0.06em;
  padding: 6px 14px;
  border-radius: 999px;
  border: 2.5px solid var(--text-strong);
  box-shadow: 0 3px 0 0 var(--text-strong);
  font-size: 14px;
}

/* ============================================================
   Mobile fit — whole game visible on phones without scroll/zoom.
   Root cause of the old "zoomed-out" look: the line-chart SVG (and
   the 5-column status bar) were wider than the phone, which expanded
   the layout viewport and shrank everything. Below we clamp width to
   the viewport, make the chart responsive, and compress vertical
   spacing so the header, chart and cards all fit at once.
   ============================================================ */
@media (max-width: 820px) {
  html, body { overflow-x: hidden; max-width: 100vw; }
  #app { padding: 8px; align-items: flex-start; max-width: 100vw; overflow-x: hidden; }
  .game-screen { gap: 6px; }
  .game-screen, .status-bar, .forecast-strip, .game-main,
  .chart-card, .side, .cards-card, .today-card { min-width: 0; max-width: 100%; }

  /* Compact header — the "to summit" progress bar is redundant with the chart.
     Extra top padding keeps the title/stamina clear of the fixed
     Arcade (top-left) and Share (top-right) buttons. */
  .status-bar { grid-template-columns: 1.4fr auto auto; gap: 4px 8px; padding: 50px 10px 8px; }
  .status-bar > * { min-width: 0; }
  .stat-progress, .stat.stat-progress { display: none; }
  .brand h1 { font-size: 13px; line-height: 1.05; }
  .brand-bug { width: 34px; height: 26px; }
  .brand p, .brand-sub { display: none; }
  .day-pill { transform: none; padding: 5px 10px; }

  .forecast-strip { padding: 5px 8px; gap: 3px; margin-bottom: 0; }
  .forecast-day { padding: 3px 2px; }
  .forecast-day .forecast-icon { font-size: 14px; }

  /* Responsive chart: fill width, capped height */
  .game-main { grid-template-columns: 1fr; }
  .chart-card { padding: 8px 12px 4px; }
  .chart-card svg { width: 100%; height: auto; max-height: 86px; }

  .today-card { padding: 6px 10px; gap: 2px; }
  .today-card svg { width: 38px; height: 38px; }
  .today-name { font-size: 16px; }
  .today-hint { display: none; }
  .today-sleep-icon { font-size: 36px; margin: 2px 0; }

  .cards-card { padding: 10px 12px; }
  .tip-card { display: none; }
}

/* ==== rng.js ==== */
// Seeded RNG (Mulberry32) + 4-char base36 seed codes.
// Deterministic — same seed code = same weather sequence + same dice rolls.

/** Convert any string to a 32-bit seed. */
function seedFromString(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^ (h >>> 16)) >>> 0;
}

/** Mulberry32 PRNG. Returns a function that yields floats in [0, 1). */
function mulberry32(seed) {
  let s = seed >>> 0;
  return function next() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Generate a 4-char base36 share code, e.g. "A7K9". */
function generateSeedCode() {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/1/I/O for legibility
  let s = "";
  for (let i = 0; i < 4; i++) {
    s += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return s;
}

/** Integer in [min, max] inclusive, using a 0–1 random source. */
function intBetween(rng, min, max) {
  return min + Math.floor(rng() * (max - min + 1));
}

// Sound effects via Web Audio API — no asset files, fully synthesised.
// Browsers require a user gesture before audio plays; we lazy-init the
// AudioContext on the first call (which is always inside a click handler).

let ctx = null;
let masterGain = null;
let muted = false;

function ensureCtx() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;
    masterGain.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function setMuted(m) {
  muted = !!m;
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
}

function isMuted() {
  return muted;
}

// ADSR helper. Sets up a clean attack/decay/sustain/release envelope on a GainNode.
function envelope(gain, t0, peak, attack, decay, sustain, sustainLevel, release) {
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0 + attack);
  gain.gain.linearRampToValueAtTime(sustainLevel, t0 + attack + decay);
  gain.gain.setValueAtTime(sustainLevel, t0 + attack + decay + sustain);
  gain.gain.linearRampToValueAtTime(0, t0 + attack + decay + sustain + release);
}

function noiseBuffer(c, durationSec) {
  const buffer = c.createBuffer(1, Math.floor(c.sampleRate * durationSec), c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return buffer;
}

// ---------------- Rest: snoring ----------------
// Two slow breaths — low sawtooth swept up then back down, with a low-pass filter
// to round it off. ~1.3 s total.
function playRest() {
  const c = ensureCtx();
  if (!c) return;
  const t = c.currentTime;

  const osc = c.createOscillator();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(70, t);
  osc.frequency.linearRampToValueAtTime(115, t + 0.35);
  osc.frequency.linearRampToValueAtTime(70, t + 0.65);
  osc.frequency.linearRampToValueAtTime(115, t + 0.95);
  osc.frequency.linearRampToValueAtTime(70, t + 1.25);

  const filter = c.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(240, t);
  filter.frequency.linearRampToValueAtTime(360, t + 0.5);
  filter.frequency.linearRampToValueAtTime(240, t + 1.25);
  filter.Q.value = 4;

  const gain = c.createGain();
  envelope(gain, t, 0.22, 0.08, 0.12, 0.85, 0.15, 0.2);

  osc.connect(filter).connect(gain).connect(masterGain);
  osc.start(t);
  osc.stop(t + 1.45);
}

// ---------------- Climb: footsteps ----------------
// Two short noise crunches band-passed around 250 Hz.
function playClimb() {
  const c = ensureCtx();
  if (!c) return;
  const t = c.currentTime;
  for (let i = 0; i < 2; i++) {
    const start = t + i * 0.16;
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 0.1);

    const filter = c.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 230;
    filter.Q.value = 1.2;

    const gain = c.createGain();
    envelope(gain, start, 0.5, 0.005, 0.05, 0.0, 0.0, 0.05);

    src.connect(filter).connect(gain).connect(masterGain);
    src.start(start);
    src.stop(start + 0.12);
  }
}

// ---------------- Sprint: whoosh + quick steps ----------------
// Filter-swept noise plus three rapid steps. ~0.55 s.
function playSprint() {
  const c = ensureCtx();
  if (!c) return;
  const t = c.currentTime;

  // Whoosh — band-pass noise swept up then back down.
  const src = c.createBufferSource();
  src.buffer = noiseBuffer(c, 0.55);

  const filter = c.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(280, t);
  filter.frequency.linearRampToValueAtTime(1800, t + 0.28);
  filter.frequency.linearRampToValueAtTime(400, t + 0.55);
  filter.Q.value = 4;

  const gain = c.createGain();
  envelope(gain, t, 0.4, 0.05, 0.12, 0.18, 0.3, 0.15);

  src.connect(filter).connect(gain).connect(masterGain);
  src.start(t);
  src.stop(t + 0.6);

  // Rapid step trio
  for (let i = 0; i < 3; i++) {
    const s2 = t + 0.05 + i * 0.1;
    const stepSrc = c.createBufferSource();
    stepSrc.buffer = noiseBuffer(c, 0.06);
    const stepFilter = c.createBiquadFilter();
    stepFilter.type = "bandpass";
    stepFilter.frequency.value = 280;
    stepFilter.Q.value = 1;
    const stepGain = c.createGain();
    envelope(stepGain, s2, 0.35, 0.003, 0.03, 0.0, 0.0, 0.03);
    stepSrc.connect(stepFilter).connect(stepGain).connect(masterGain);
    stepSrc.start(s2);
    stepSrc.stop(s2 + 0.08);
  }
}

// ---------------- Stamina drain: descending sine ----------------
function playStaminaDrain() {
  const c = ensureCtx();
  if (!c) return;
  const t = c.currentTime + 0.05; // slight delay so it stacks after the action sound

  const osc = c.createOscillator();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(620, t);
  osc.frequency.exponentialRampToValueAtTime(160, t + 0.45);

  const gain = c.createGain();
  envelope(gain, t, 0.22, 0.02, 0.05, 0.2, 0.2, 0.18);

  osc.connect(gain).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.55);
}

// ---------------- Stamina gain: bright two-note sparkle ----------------
function playStaminaGain() {
  const c = ensureCtx();
  if (!c) return;
  const t = c.currentTime + 0.05;

  const notes = [520, 780, 1040]; // C E A-ish — bright, ascending
  notes.forEach((freq, i) => {
    const start = t + i * 0.07;
    const osc = c.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, start);

    const gain = c.createGain();
    envelope(gain, start, 0.28, 0.005, 0.05, 0.05, 0.18, 0.12);

    osc.connect(gain).connect(masterGain);
    osc.start(start);
    osc.stop(start + 0.32);
  });
}

// ---------------- Win: ascending arpeggio + tag ----------------
function playWin() {
  const c = ensureCtx();
  if (!c) return;
  const t = c.currentTime;

  // C major + extension: C E G C high E high G
  const notes = [262, 330, 392, 523, 659, 784];
  notes.forEach((freq, i) => {
    const start = t + i * 0.12;
    const osc = c.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, start);

    const gain = c.createGain();
    envelope(gain, start, 0.32, 0.02, 0.05, 0.1, 0.28, 0.25);

    osc.connect(gain).connect(masterGain);
    osc.start(start);
    osc.stop(start + 0.5);
  });

  // Triumph chord at the end
  const tagStart = t + notes.length * 0.12 + 0.05;
  [523, 659, 784].forEach((freq) => {
    const osc = c.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, tagStart);
    const gain = c.createGain();
    envelope(gain, tagStart, 0.26, 0.02, 0.05, 0.4, 0.25, 0.3);
    osc.connect(gain).connect(masterGain);
    osc.start(tagStart);
    osc.stop(tagStart + 0.85);
  });
}

// ---------------- Lose: minor descending ----------------
function playLose() {
  const c = ensureCtx();
  if (!c) return;
  const t = c.currentTime;

  const notes = [392, 349, 311, 262]; // G F Eb C — sad walk down
  notes.forEach((freq, i) => {
    const start = t + i * 0.2;
    const osc = c.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, start);

    const gain = c.createGain();
    envelope(gain, start, 0.3, 0.03, 0.08, 0.2, 0.25, 0.22);

    osc.connect(gain).connect(masterGain);
    osc.start(start);
    osc.stop(start + 0.7);
  });
}


/* ==== state.js ==== */
// State machine for Bug-Bug's Mountain Climb.
// Pure functions only — no DOM, no side effects.
//
// Mechanic (Series 1, v4 — "Pick a card" hazard guessing):
//   - 7 days. Bug-Bug starts with 3 stamina.
//   - Each day shows 3 face-down cards. One is a hazard; two are safe.
//     Player taps one — it flips and reveals what was inside. The other
//     two also reveal so the player can see what they missed.
//   - Safe pick: nothing bad happens. Bug-Bug climbs +50m.
//   - Hazard pick: -1 stamina. Bug-Bug still climbs +50m (the chart
//     is uniform; the drama is in the cards).
//   - If stamina drops to 0, the climb ends immediately and the line
//     chart slides back to (day 1, 0m) — effort wasted.
//   - If Bug-Bug completes day 7 with ≥1 stamina, the summit is reached.
//
// Stars: 1 (1 stamina left), 2 (2 left), 3 (3 left — no hazards picked).


// ---------- Game balance ----------

const SUMMIT = 350;            // 7 perfect-safe days × 50m
const TOTAL_DAYS = 7;
const STARTING_STAMINA = 4;
const MAX_STAMINA = STARTING_STAMINA;
const SAFE_GAIN = 50;          // altitude gain on a safe pick
const HAZARD_DIP = 20;         // altitude lost on a hazard pick (clamped at 0)

// ---------- Choice pool ----------
// For each weather, a pool of safe and hazard cards. Each day picks
// 2 safe + 1 hazard at random and shuffles them.

const CHOICES = {
  sunny: {
    safe: [
      { icon: "💧", label: "Drink from the spring", description: "A cool sip — Bug-Bug feels refreshed." },
      { icon: "🍃", label: "Walk through the shade", description: "Smart route. No sunburn." },
      { icon: "🥾", label: "Steady pace on the rocks", description: "Even footing — energy preserved." },
      { icon: "🌳", label: "Rest under a tree", description: "A quiet pause keeps the head clear." },
    ],
    hazard: [
      { icon: "🔥", label: "Run uphill in the heat", description: "Heatstroke! Bug-Bug staggers." },
      { icon: "🥵", label: "Skip the water break", description: "Dehydrated! Bug-Bug feels dizzy." },
      { icon: "☀️", label: "Climb without shade", description: "Sunburn! Bug-Bug winces in pain." },
    ],
  },
  cloudy: {
    safe: [
      { icon: "🗺️", label: "Check the map", description: "Stayed on the right path." },
      { icon: "🌥️", label: "Follow the marked trail", description: "Trusted the markers. Solid choice." },
      { icon: "🪨", label: "Stick to the cliff face", description: "Hugged the safe wall." },
      { icon: "🧭", label: "Trust the compass", description: "Pointed true north — kept on track." },
    ],
    hazard: [
      { icon: "🌫️", label: "Wander into the fog", description: "Lost! Bug-Bug wastes hours wandering." },
      { icon: "🪵", label: "Take the unmarked shortcut", description: "Dead end! Backtracking is exhausting." },
      { icon: "🦅", label: "Chase the strange bird", description: "Distracted! Bug-Bug strays from the path." },
    ],
  },
  storm: {
    safe: [
      { icon: "🏚️", label: "Shelter in the cave", description: "Snug and safe from the storm." },
      { icon: "⛺", label: "Pitch a tent", description: "Dry and warm. Riding it out." },
      { icon: "🧗", label: "Crouch low and wait", description: "Smart — kept low, stayed safe." },
      { icon: "🪨", label: "Hide behind a boulder", description: "Solid cover from the wind." },
    ],
    hazard: [
      { icon: "🚪", label: "Open the mysterious door", description: "It was a trap! Bug-Bug tumbles." },
      { icon: "⚡", label: "Brave the lightning", description: "Struck! Bug-Bug's fur stands on end." },
      { icon: "🌊", label: "Cross the rising river", description: "Swept downstream! Bug-Bug barely escapes." },
    ],
  },
};

// ---------- Weather sequences ----------
// 10 handcrafted 7-day sequences with mixed weather.

const WEATHER_POOL = [
  ["sunny",  "cloudy", "storm",  "sunny",  "cloudy", "sunny",  "storm" ],
  ["cloudy", "sunny",  "sunny",  "storm",  "cloudy", "sunny",  "storm" ],
  ["sunny",  "storm",  "cloudy", "sunny",  "storm",  "cloudy", "sunny" ],
  ["storm",  "sunny",  "cloudy", "storm",  "sunny",  "cloudy", "sunny" ],
  ["sunny",  "cloudy", "storm",  "cloudy", "sunny",  "storm",  "sunny" ],
  ["cloudy", "sunny",  "sunny",  "storm",  "cloudy", "storm",  "sunny" ],
  ["storm",  "cloudy", "sunny",  "cloudy", "storm",  "sunny",  "sunny" ],
  ["sunny",  "sunny",  "storm",  "cloudy", "sunny",  "storm",  "cloudy"],
  ["cloudy", "storm",  "sunny",  "cloudy", "sunny",  "storm",  "sunny" ],
  ["sunny",  "cloudy", "storm",  "sunny",  "storm",  "cloudy", "sunny" ],
];

// ---------- State factory ----------

/**
 * Create a fresh GameState for a given 4-char seed code.
 * @param {string} seedCode
 */
function createGame(seedCode) {
  const rng = mulberry32(seedFromString(seedCode));
  const sequenceIndex = Math.floor(rng() * WEATHER_POOL.length);
  const weather = WEATHER_POOL[sequenceIndex].slice();

  // Pre-roll 7 days of choices. Each day: 1 safe + 2 hazards from the
  // pool for that weather, then shuffle so the safe card isn't always
  // in the same slot.
  const dailyChoices = weather.map((w) => {
    const safePool = CHOICES[w].safe.slice();
    const hazardPool = CHOICES[w].hazard.slice();
    const safe = pickAndRemove(safePool, rng);
    const hazard1 = pickAndRemove(hazardPool, rng);
    const hazard2 = pickAndRemove(hazardPool, rng);
    const cards = [
      { ...safe, type: "safe" },
      { ...hazard1, type: "hazard" },
      { ...hazard2, type: "hazard" },
    ];
    shuffleInPlace(cards, rng);
    return cards;
  });

  return {
    phase: "playing",
    seed: seedCode,
    sequenceIndex,
    day: 1,
    altitude: 0,
    peakAltitude: 0,
    stamina: STARTING_STAMINA,
    weather,
    dailyChoices,
    revealedToday: null, // null | { pickedIndex }
    history: [],
    outcome: null,
    stars: 0,
    lastResult: null,
  };
}

function pickAndRemove(arr, rng) {
  const i = Math.floor(rng() * arr.length);
  return arr.splice(i, 1)[0];
}

function shuffleInPlace(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---------- Queries ----------

function todayWeather(state) {
  return state.weather[state.day - 1] || null;
}

function todayCards(state) {
  return state.dailyChoices[state.day - 1] || null;
}

/** Convenience: is the player allowed to pick a card right now? */
function canPick(state) {
  return state.phase === "playing" && state.revealedToday === null;
}

/** Convenience: should the player click Continue to advance the day? */
function canContinue(state) {
  return state.phase === "playing" && state.revealedToday !== null;
}

function summitFraction(state) {
  return Math.min(1, state.altitude / SUMMIT);
}

// ---------- Transitions ----------

/**
 * Player picks a card by index (0, 1, or 2). The pick is recorded but
 * the day doesn't advance yet — the player needs to click Continue to
 * see the next day's cards.
 */
function pickCard(state, index) {
  if (!canPick(state)) return state;
  if (index < 0 || index > 2) return state;
  const cards = todayCards(state);
  if (!cards) return state;
  return {
    ...state,
    revealedToday: {
      pickedIndex: index,
      pickedCard: cards[index],
      wasHazard: cards[index].type === "hazard",
    },
  };
}

/**
 * After the cards are revealed, the player clicks Continue. This applies
 * the picked card's effect (stamina change, altitude gain) and advances
 * the day. If stamina hits zero, the game ends in a loss.
 */
function advanceDay(state) {
  if (!canContinue(state)) return state;
  const wasHazard = state.revealedToday.wasHazard;
  const pickedCard = state.revealedToday.pickedCard;
  const pickedIndex = state.revealedToday.pickedIndex;

  const staminaDelta = wasHazard ? -1 : 0;
  const newStamina = Math.max(0, state.stamina + staminaDelta);
  const altDelta = wasHazard ? -HAZARD_DIP : SAFE_GAIN;
  const newAltitude = Math.max(0, state.altitude + altDelta);
  const newDay = state.day + 1;

  const dayResult = {
    day: state.day,
    weather: todayWeather(state),
    cards: todayCards(state),
    pickedIndex,
    pickedCard,
    wasHazard,
    staminaBefore: state.stamina,
    staminaAfter: newStamina,
    altitudeBefore: state.altitude,
    altitudeAfter: newAltitude,
  };

  const next = {
    ...state,
    day: newDay,
    altitude: newAltitude,
    peakAltitude: Math.max(state.peakAltitude, newAltitude),
    stamina: newStamina,
    revealedToday: null,
    history: state.history.concat([dayResult]),
    lastResult: dayResult,
  };

  // Hand off to finishGame if either game-end condition has been hit.
  if (newStamina <= 0 || newDay > TOTAL_DAYS) {
    return finishGame(next);
  }
  return next;
}

/**
 * Resolve game outcome. Three terminal states:
 *
 *   1. Stamina ≤ 0 BEFORE day 7 is complete   → outcome "lose"
 *   2. Stamina ≤ 0 AT day 7 (last day)         → outcome "win",
 *                                                 exhaustedFinish=true,
 *                                                 stars=0 (½-star vibe)
 *   3. Day > 7 with stamina remaining          → outcome "win", stars 1-3
 */
function finishGame(state) {
  if (state.phase === "ended") return state; // already finalised
  const completedAllDays = state.day > TOTAL_DAYS;
  const stamina = state.stamina;

  if (stamina <= 0 && !completedAllDays) {
    return {
      ...state,
      phase: "ended",
      outcome: "lose",
      stars: 0,
      exhaustedFinish: false,
    };
  }

  if (stamina <= 0 && completedAllDays) {
    return {
      ...state,
      phase: "ended",
      outcome: "win",
      stars: 0,
      exhaustedFinish: true,
    };
  }

  if (completedAllDays && stamina > 0) {
    const hazardsHit = STARTING_STAMINA - stamina;
    let stars = 1;
    if (hazardsHit === 0) stars = 3;
    else if (hazardsHit === 1) stars = 2;
    return {
      ...state,
      phase: "ended",
      outcome: "win",
      stars,
      exhaustedFinish: false,
    };
  }

  return state;
}

// ---------- Title screen ----------

function renderTitle(bestStars) {
  // Two distinct states for the 'Best:' indicator:
  //
  //   - Before any game has been played (bestStars === 0):
  //     show three bright yellow ⭐⭐⭐ as the goal / brand element.
  //
  //   - After at least one game (bestStars >= 1):
  //     show the slot pattern — earned slots are bright filled ⭐
  //     (with glow), unearned slots are visibly dimmer so the player
  //     can see their actual progress toward 3.
  let stars = '';
  if (bestStars === 0) {
    stars = '<span class="best-star filled">⭐</span>'.repeat(3);
  } else {
    for (let i = 0; i < 3; i++) {
      const filled = i < bestStars;
      stars += `<span class="best-star ${filled ? 'filled' : 'empty'}">${filled ? '⭐' : '☆'}</span>`;
    }
  }
  return `
    <div class="screen title-screen">
      <div class="title-card">
        ${muteButton("mute-toggle-floating")}
        <svg class="title-bug" viewBox="-60 -50 120 110">
          ${gradientDefs()}
          ${bug(1.4)}
        </svg>
        <h1 class="title-heading">BUG-BUG'S<br/>MOUNTAIN CLIMB</h1>
        <p class="title-subtitle">A hazard-guessing climb game · DataCruise Arcade</p>
        <button class="primary-btn" data-action="start">▶ PLAY</button>
        <p class="title-best">Best: <span class="best-stars">${stars}</span></p>
        <details class="title-howto" open>
          <summary>How to play (click to expand)</summary>
          <div class="howto-body">
            <p class="howto-goal"><strong>🏔 Goal:</strong> Survive <strong>${TOTAL_DAYS} days</strong> on the mountain with stamina still in the tank.</p>

            <p class="howto-hook"><strong>The Twist:</strong> Each day you'll see <strong>3 face-down cards</strong>. <strong>Two are hazards</strong>, only <strong>one is safe</strong>. Pick one. All three flip.</p>

            <h4>What each pick does</h4>
            <ul class="howto-actions">
              <li>✅ <strong>Safe card</strong> — Bug-Bug climbs <strong>up</strong>.</li>
              <li>⚠️ <strong>Hazard card</strong> — Bug-Bug <strong>slips and dips</strong> down the mountain, and loses 1 stamina.</li>
            </ul>

            <p>Bug-Bug has <strong>${STARTING_STAMINA} stamina</strong>. Run out of stamina and the climb is over.</p>

            <h4>Each weather brings its own hazards</h4>
            <ul class="howto-weather">
              <li><span class="howto-icon">☀️</span> <strong>Sunny</strong> — heatstroke, dehydration, sunburn.</li>
              <li><span class="howto-icon">☁️</span> <strong>Cloudy</strong> — fog, wrong turns, distractions.</li>
              <li><span class="howto-icon">⛈️</span> <strong>Stormy</strong> — lightning, rivers, mysterious doors.</li>
            </ul>

            <p class="howto-tip"><strong>💡 Why it matters:</strong> Hazards dip the line chart down. Run out of stamina early and the climb stops right where Bug-Bug stands — no slide back, but no trophy either. Survive all 7 days to plant the trophy at your final altitude. Make it to day 7 even on empty stamina and you still earn a half-star "exhausted finish".</p>
          </div>
        </details>
      </div>
    </div>`;
}

// ---------- Game screen ----------

function renderGame(state) {
  return `
    <div class="screen game-screen">
      <svg class="defs-only" aria-hidden="true">${gradientDefs()}</svg>
      ${headerBar(state)}
      ${forecastStrip(state)}
      <main class="game-main">
        ${chartCard(state)}
        <aside class="side">
          ${todayCard(state)}
          ${cardsArea(state)}
        </aside>
      </main>
      ${tipFooter(state)}
    </div>`;
}

function headerBar(state) {
  const pct = Math.round(summitFraction(state) * 100);
  return `
    <header class="status-bar card">
      <div class="brand">
        <svg viewBox="-32 -24 64 48" class="brand-bug">${bug(0.7)}</svg>
        <div>
          <h1>BUG-BUG'S MOUNTAIN CLIMB</h1>
          <p>DataCruise Arcade · Series 1</p>
        </div>
      </div>
      <div class="day-pill">
        <span class="label">DAY</span>
        <strong>${state.day} / ${TOTAL_DAYS}</strong>
      </div>
      <div class="stat stat-stamina">
        <span class="label">STAMINA</span>
        ${renderStaminaHearts(state.stamina)}
      </div>
      <div class="stat stat-altitude">
        <span class="label">ALTITUDE</span>
        <strong>▲ ${state.altitude}m</strong>
      </div>
      <div class="stat stat-progress">
        <span class="label">TO SUMMIT</span>
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <strong>${pct}%</strong>
      </div>

}

function renderStaminaHearts(stamina) {
  let hearts = "";
  for (let i = 0; i < MAX_STAMINA_VISUAL; i++) {
    const active = i < stamina;
    hearts += `<span class="stamina-heart ${active ? "alive" : "lost"}">${active ? "❤️" : "🖤"}</span>`;
  }
  return `<div class="stamina-display">
    <strong class="stamina-num">${stamina}</strong>
    <span class="stamina-of">/ ${STARTING_STAMINA}</span>
    <div class="stamina-hearts">${hearts}</div>
  </div>`;
}

const MAX_STAMINA_VISUAL = STARTING_STAMINA;

function forecastStrip(state) {
  let tiles = "";
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const w = state.weather[d - 1];
    const cfg = WEATHER_GLYPH[w];
    const cls =
      d === state.day && state.phase === "playing" ? "current"
      : d < state.day ? "past"
      : "future";
    // If the day is past, indicate whether it was a hazard pick.
    let extra = "";
    if (cls === "past") {
      const h = state.history[d - 1];
      if (h && h.wasHazard) extra = `<span class="forecast-pick hazard">⚠️</span>`;
      else if (h) extra = `<span class="forecast-pick safe">✓</span>`;
    }
    tiles += `
      <div class="forecast-day forecast-${w} ${cls}" title="Day ${d} — ${cfg.label} (${cfg.hint})">
        <span class="forecast-num">${d}</span>
        <span class="forecast-icon">${cfg.icon}</span>
        ${extra}
      </div>`;
  }
  return `
    <section class="forecast-strip card">
      <span class="forecast-label">${TOTAL_DAYS}-DAY FORECAST</span>
      <div class="forecast-days">${tiles}</div>
      <span class="forecast-legend">
        <span class="legend-item"><span class="legend-icon">✓</span>safe</span>
        <span class="legend-item"><span class="legend-icon">⚠️</span>hazard</span>
      </span>
    </section>`;
}

function chartCard(state) {
  return `
    <section class="chart-card card">
      <header class="chart-head">
        <div>
          <h2>The climb so far</h2>
          <p>Every survived day plots the next point.</p>
        </div>
        <span class="avg-pill">Summit: <strong>${SUMMIT}m</strong></span>
      </header>
      ${chartSVG(state)}
    </section>`;
}

function chartSVG(state) {
  const VB_W = 960, VB_H = 500;
  const X0 = 140, X1 = 910;     // X0 widened to make room for the Y-axis title
  const Y0 = 60, Y1 = 460;
  const Y_PER_M = (Y1 - Y0) / 400; // 400m mapped to plot height (room above summit)

  const xFor = (day) => X0 + ((day - 1) / (TOTAL_DAYS - 1)) * (X1 - X0);
  const yFor = (m) => Y1 - m * Y_PER_M;

  let yTicks = "";
  for (let m = 0; m <= 400; m += 50) {
    yTicks += `<text x="${X0 - 12}" y="${yFor(m) + 4}" text-anchor="end" class="y-tick">${m}</text>`;
    yTicks += `<line x1="${X0}" y1="${yFor(m)}" x2="${X1}" y2="${yFor(m)}" class="grid-line"/>`;
  }

  // Y-axis title (rotated 90°)
  const yAxisTitle = `
    <text x="${X0 - 70}" y="${(Y0 + Y1) / 2}" text-anchor="middle"
          transform="rotate(-90 ${X0 - 70} ${(Y0 + Y1) / 2})"
          class="y-axis-title">Altitude (m)</text>`;

  const summitY = yFor(SUMMIT);
  const summitLine = `
    <line x1="${X0}" y1="${summitY}" x2="${X1}" y2="${summitY}" class="summit-line"/>
    <text x="${X1 + 24}" y="${summitY + 5}" text-anchor="start" class="summit-label">🏔 SUMMIT</text>`;

  let path = "";
  let dots = "";
  state.history.forEach((d, i) => {
    const x = xFor(d.day);
    const y = yFor(d.altitudeAfter);
    path += (i === 0 ? `M${xFor(1)} ${yFor(0)} L` : "L") + ` ${x} ${y} `;
    const icon = d.pickedCard.icon;
    const dotCls = d.wasHazard ? "hazard" : "safe";
    const altDelta = d.altitudeAfter - d.altitudeBefore;
    const deltaLabel = d.wasHazard
      ? `${altDelta < 0 ? "" : "+"}${altDelta}m · −1❤️`
      : `+${altDelta}m`;
    dots += `
      <g class="day-marker done ${dotCls}">
        <circle cx="${x}" cy="${y}" r="13"/>
        <text x="${x}" y="${y + 5}" text-anchor="middle" class="dot-icon">${icon}</text>
        <text x="${x}" y="${y - 22}" text-anchor="middle" class="dot-gain ${dotCls}">${deltaLabel}</text>
      </g>`;
  });

  // Victory trophy — appears at Bug-Bug's final landing dot on a win,
  // with the total altitude reached labelled underneath. Higher
  // landings carry the trophy + label higher up the chart.
  // Exhausted finishes (stamina 0 on day 7) still show a trophy but
  // with a wilted / faded variant.
  let victoryTrophy = "";
  if (state.phase === "ended" && state.outcome === "win" && state.history.length > 0) {
    const last = state.history[state.history.length - 1];
    const x = xFor(last.day);
    const y = yFor(last.altitudeAfter);
    const cls = state.exhaustedFinish ? "victory-trophy exhausted" : "victory-trophy";
    victoryTrophy = `
      <g class="${cls}" transform="translate(${x} ${y - 50})">
        ${trophy(1.0)}
        <g class="victory-altitude-badge" transform="translate(0 32)">
          <rect x="-44" y="-14" width="88" height="26" rx="13" class="badge-bg"/>
          <text x="0" y="5" text-anchor="middle" class="badge-text">▲ ${state.altitude}m</text>
        </g>
      </g>`;
  }

  // On loss (stamina exhausted), Bug-Bug stays where they ran out.
  // A callout near the top of the chart says "No more stamina to continue".
  let staminaOut = "";
  if (state.phase === "ended" && state.outcome === "lose" && state.history.length > 0) {
    const last = state.history[state.history.length - 1];
    const bugX = xFor(last.day);
    const bugY = yFor(last.altitudeAfter);
    const calloutX = (X0 + X1) / 2;
    const calloutY = Y0 + 36;
    staminaOut = `
      <g class="stuck-bug" transform="translate(${bugX} ${bugY - 28})">
        ${bug(0.85)}
      </g>
      <g class="stamina-out-callout" transform="translate(${calloutX} ${calloutY})">
        <rect x="-176" y="-22" width="352" height="44" rx="22" class="callout-bg"/>
        <text x="0" y="6" text-anchor="middle" class="callout-text">💔 No more stamina to continue</text>
      </g>`;
  }

  let currentMarker = "";
  if (state.phase === "playing") {
    const x = xFor(state.day);
    const y = yFor(state.altitude);
    currentMarker = `
      <g class="day-marker current">
        <circle cx="${x}" cy="${y}" r="20" class="pulse-ring"/>
        <g transform="translate(${x} ${y - 22})">${bug(0.85)}</g>
      </g>`;
  }

  let futureDots = "";
  for (let d = state.day + (state.phase === "playing" ? 1 : 0); d <= TOTAL_DAYS; d++) {
    const x = xFor(d);
    futureDots += `<circle cx="${x}" cy="${yFor(0)}" r="6" class="future-dot"/>`;
  }

  let dayLabels = "";
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const x = xFor(d);
    const cls = d === state.day && state.phase === "playing" ? "day-label current" : (d < state.day ? "day-label past" : "day-label future");
    dayLabels += `<text x="${x}" y="${Y1 + 32}" text-anchor="middle" class="${cls}">${d}</text>`;
  }

  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${VB_W} ${VB_H}" class="chart" role="img" aria-label="Mountain climb chart">
        <rect x="${X0 - 20}" y="${Y0 - 20}" width="${X1 - X0 + 40}" height="${Y1 - Y0 + 40}" rx="14" class="plot-bg"/>
        ${yTicks}
        ${yAxisTitle}
        ${summitLine}
        ${path ? `<path d="${path.trim()}" class="climb-line"/>` : ""}
        ${futureDots}
        ${dots}
        ${staminaOut}
        ${victoryTrophy}
        ${currentMarker}
        ${dayLabels}
        <text x="${(X0 + X1) / 2}" y="${Y1 + 56}" text-anchor="middle" class="x-axis-title">Day</text>
      </svg>
    </div>`;
}

function todayCard(state) {
  const w = todayWeather(state);
  if (!w) return "";
  const cfg = WEATHER_GLYPH[w];
  return `
    <section class="today-card card weather-${w}">
      <span class="today-label">TODAY · DAY ${state.day}</span>
      <svg viewBox="-40 -40 80 80" aria-hidden="true">${cfg.fn(1)}</svg>
      <strong class="today-name">${cfg.label}</strong>
      <p class="today-hint">${cfg.hint}</p>
    </section>`;
}

function cardsArea(state) {
  const cards = todayCards(state);
  const revealed = state.revealedToday;

  if (!revealed) {
    // Three face-down cards, click to pick.
    return `
      <section class="cards-card card">
        <h3>PICK A CARD</h3>
        <p class="cards-prompt">Two are hazards. Only one is safe. Trust your luck.</p>
        <div class="card-row">
          ${cards.map((_, i) => faceDownCard(i)).join("")}
        </div>
      </section>`;
  }

  // Cards revealed — show all three, picked one highlighted.
  const pickedCard = revealed.pickedCard;
  const wasHazard = revealed.wasHazard;
  const headline = wasHazard
    ? `<span class="reveal-headline hazard">⚠️ HAZARD — altitude −20m, stamina ${state.stamina} → ${state.stamina - 1}</span>`
    : `<span class="reveal-headline safe">✅ SAFE — altitude +50m</span>`;
  return `
    <section class="cards-card card">
      <h3>${wasHazard ? "OUCH" : "PHEW"}</h3>
      ${headline}
      <p class="cards-description">${pickedCard.icon} <strong>${pickedCard.label}</strong> — ${pickedCard.description}</p>
      <div class="card-row revealed-row">
        ${cards.map((c, i) => revealedCard(c, i === revealed.pickedIndex)).join("")}
      </div>
      <button class="primary-btn continue-btn" data-action="continue">Continue Climbing →</button>
    </section>`;
}

function faceDownCard(index) {
  return `
    <button class="pick-card face-down" data-action="pick:${index}" aria-label="Pick card ${index + 1}">
      <div class="card-back">
        <span class="card-back-q">?</span>
      </div>
    </button>`;
}

function revealedCard(card, isPicked) {
  const isHazard = card.type === "hazard";
  return `
    <div class="pick-card revealed ${isHazard ? "is-hazard" : "is-safe"} ${isPicked ? "is-picked" : "is-other"}">
      <div class="card-front">
        <span class="card-icon">${card.icon}</span>
        <span class="card-label">${card.label}</span>
        <span class="card-badge">${isHazard ? "⚠️ HAZARD" : "✓ SAFE"}</span>
      </div>
    </div>`;
}

function tipFooter(state) {
  const recent = state.history.slice(-5).map((d) => {
    const safe = d.wasHazard ? "⚠️" : "✓";
    return `<span class="chip ${d.wasHazard ? "chip-hazard" : "chip-safe"}">${safe} ${d.pickedCard.icon}</span>`;
  }).join("");

  let tipText;
  if (state.stamina === 1) {
    tipText = "⚠️ One stamina left! The next hazard ends the climb.";
  } else if (state.day > TOTAL_DAYS) {
    tipText = "Summit reached!";
  } else if (state.lastResult && state.lastResult.wasHazard) {
    tipText = "That stung. Trust your luck and keep climbing.";
  } else if (state.lastResult) {
    tipText = "Safe pick! Keep going.";
  } else {
    tipText = "Pick a card to start the climb.";
  }

  return `
    <footer class="tip-card card">
      <div class="tip">
        <span class="label">STRATEGY TIP</span>
        <p class="tip-text">${tipText}</p>
        <p class="tip-sub">Each day brings new hazards. Stamina lost is gone for good.</p>
      </div>
      <div class="recent">
        <span class="label">DAYS SO FAR</span>
        <div class="chips">${recent || `<span class="chip dim">—</span>`}</div>
      </div>
    </footer>`;
}

// ---------- End screen ----------

function renderEnd(state) {
  const won = state.outcome === "win";
  const exhausted = won && state.exhaustedFinish === true;

  let headline;
  if (exhausted) {
    headline = "💪 EXHAUSTED FINISH";
  } else if (won) {
    headline = state.stars === 3
      ? "🏆 PERFECT CLIMB — 3 STARS"
      : state.stars === 2
        ? "✨ SUMMIT REACHED — 2 STARS"
        : "🚩 SUMMIT (BARELY)";
  } else {
    headline = "💔 OUT OF STAMINA";
  }

  let sub;
  if (exhausted) {
    sub = `Bug-Bug pushed all the way to <strong>${state.altitude}m</strong>, then collapsed at the finish line. You technically made it!`;
  } else if (won) {
    sub = `You survived all ${TOTAL_DAYS} days and finished at <strong>${state.altitude}m</strong> with <strong>${state.stamina} stamina</strong> left.`;
  } else {
    sub = `Bug-Bug ran out of stamina on day ${state.day - 1} at <strong>${state.altitude}m</strong>. The climb ends here.`;
  }

  let stars;
  if (exhausted) {
    stars = `<span class="exhausted-badge">💪 ½★ FINISH</span>`;
  } else if (won) {
    stars = "⭐".repeat(state.stars) + "☆".repeat(3 - state.stars);
  } else {
    stars = "";
  }

  const counts = countOutcomes(state.history);

  let successMessage;
  if (exhausted) {
    successMessage = `<p class="end-success">Half star earned. Bug-Bug collapsed at the summit — try again for a full ⭐ run.</p>`;
  } else if (won) {
    successMessage = `<p class="end-success">🎉 You hooked the line chart at both ends. Stars: ${state.stars} of 3.</p>`;
  } else {
    successMessage = `<p class="end-success">Try again — the cards and weather shuffle every game.</p>`;
  }
  return `
    <div class="screen end-screen">
      <svg class="defs-only" aria-hidden="true">${gradientDefs()}</svg>
      <div class="end-card card">
        ${muteButton("mute-toggle-floating")}
        <h1 class="end-headline ${won ? "won" : "lost"}">${headline}</h1>
        <p class="end-stars">${stars}</p>
        ${successMessage}
        <p class="end-sub">${sub}</p>
        ${chartSVG(state)}
        <ul class="end-recap">
          <li>✓ Safe picks: <strong>${counts.safe}</strong></li>
          <li>⚠️ Hazards triggered: <strong>${counts.hazard}</strong></li>
          <li>❤️ Stamina remaining: <strong>${state.stamina} / ${STARTING_STAMINA}</strong></li>
        </ul>
        <div class="end-actions">
          <button class="primary-btn" data-action="new-game">🆕 NEW CLIMB</button>
          <button class="ghost-btn" data-action="replay-seed">↻ REPLAY GAME</button>
        </div>
      </div>
    </div>`;
}

function countOutcomes(history) {
  return history.reduce((acc, d) => {
    if (d.wasHazard) acc.hazard++;
    else acc.safe++;
    return acc;
  }, { safe: 0, hazard: 0 });
}


/* ==== Synthesised namespace objects for `import * as X` ==== */
const audio = { setMuted, isMuted, playRest, playClimb, playSprint, playStaminaDrain, playStaminaGain, playWin, playLose };

/* ==== main.js ==== */
// Bootstrap. Holds the single game state, handles clicks, renders.


const STORAGE_KEY = "datacruise.mountainclimb.v1";
const MUTE_KEY = "datacruise.mountainclimb.muted";
const app = document.getElementById("app");

let state = null;
let bestStars = readBestStars();
audio.setMuted(readMuted());

renderInitial();

document.addEventListener("click", onClick);

// ---------- initial render ----------

function renderInitial() {
  app.innerHTML = renderTitle(bestStars);
}

// ---------- click router ----------

function onClick(e) {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.getAttribute("data-action");
  if (target.hasAttribute("disabled")) return;

  if (action === "start") {
    state = createGame(generateSeedCode());
    render();
    return;
  }
  if (action === "new-game") {
    state = createGame(generateSeedCode());
    render();
    return;
  }
  if (action === "replay-seed") {
    if (state && state.seed) {
      state = createGame(state.seed);
      render();
    }
    return;
  }
  if (action === "toggle-mute") {
    const next = !audio.isMuted();
    audio.setMuted(next);
    writeMuted(next);
    render();
    return;
  }
  if (action.startsWith("pick:")) {
    const index = Number.parseInt(action.slice("pick:".length), 10);
    if (!Number.isInteger(index)) return;
    const prevState = state;
    state = pickCard(state, index);
    if (state !== prevState && state.revealedToday) {
      // Play sound based on pick outcome
      if (state.revealedToday.wasHazard) audio.playStaminaDrain();
      else audio.playStaminaGain();
    }
    render();
    return;
  }
  if (action === "continue") {
    const prevState = state;
    state = advanceDay(state);
    if (state !== prevState) {
      audio.playClimb();
      if (state.phase === "ended") {
        setTimeout(() => {
          if (state.outcome === "win") audio.playWin();
          else audio.playLose();
        }, 320);
        // Exhausted finish counts as a win narratively but doesn't
        // update the best-ever star tracker (so a real 1+ star run
        // can still beat it).
        if (state.outcome === "win" && !state.exhaustedFinish && state.stars > bestStars) {
          bestStars = state.stars;
          writeBestStars(bestStars);
        }
        // Mirror the game's own end-screen wording exactly (see renderEnd):
        // loss reports "day {state.day - 1}" and the altitude in metres.
        var mcWon = state.outcome === "win";
        var mcExhausted = mcWon && state.exhaustedFinish === true;
        window.DataCruiseResult && DataCruiseResult.ready({
          slug: "mountain-climb", game: "Mountain Climb",
          headline: mcExhausted
            ? "EXHAUSTED FINISH 💪"
            : state.altitude + "m" + (mcWon ? " 🏔️" : ""),
          sub: mcExhausted
            ? "collapsed at the summit — you made it!"
            : mcWon
              ? "summit reached · " + state.stamina + " stamina left"
              : "out of stamina on day " + (state.day - 1),
          stars: state.stars, starsMax: 3,
        });
      }
    }
    render();
    return;
  }
}

// ---------- render ----------

function render() {
  if (!state || state.phase === "title") {
    app.innerHTML = renderTitle(bestStars);
    return;
  }
  if (state.phase === "playing") {
    app.innerHTML = renderGame(state);
    return;
  }
  if (state.phase === "ended") {
    app.innerHTML = renderEnd(state);
    return;
  }
}

// ---------- storage ----------

function readBestStars() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return 0;
    const parsed = JSON.parse(raw);
    return Math.max(0, Math.min(3, parsed.bestStars || 0));
  } catch {
    return 0;
  }
}

function writeBestStars(n) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ bestStars: n }));
  } catch {
    // ignore
  }
}

function readMuted() {
  try {
    return localStorage.getItem(MUTE_KEY) === "true";
  } catch {
    return false;
  }
}

function writeMuted(m) {
  try {
    localStorage.setItem(MUTE_KEY, m ? "true" : "false");
  } catch {
    // ignore
  }
}

// ---------- URL seed support ----------

(function initFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const seed = params.get("seed");
  if (seed && /^[A-Z0-9]{2,8}$/.test(seed)) {
    state = createGame(seed);
    render();
  }
})();



/* ==== GameMonetize SDK bootstrap ==== */
const PLATFORM = "site";
const AD = { enabled: true, gameId: "aq4rhv7si1o2z5xao0pfqqfmgmxzezwp" };
let _gmReady = false, _gmPending = null;
// Enable GameMonetize test-ad mode on localhost / dev origins so ads actually
// serve during local verification. Real domains (GameMonetize's player,
// arcade.datacruise.app, etc.) get the production ad stack instead.
const _gmIsLocalOrigin = /^(127\.0\.0\.1|localhost|0\.0\.0\.0|::1)$/.test(location.hostname);
if (PLATFORM === "site" && AD.enabled && AD.gameId) {
  window.SDK_OPTIONS = {
    gameId: AD.gameId,
    testing: _gmIsLocalOrigin,
    debug: _gmIsLocalOrigin,
    onEvent: function (a) {
      switch (a && a.name) {
        case "SDK_READY":                   _gmReady = true; break;
        case "SDK_GAME_PAUSE":               if (_gmPending) _gmPending.adShown = true; break;
        case "SDK_REWARDED_WATCH_COMPLETE": if (_gmPending) _gmPending.earned = true; break;
        case "SDK_GAME_START":              _gmResolve(true); break;
        case "SDK_ERROR":                   _gmResolve(false); break;
      }
    }
  };
  (function (d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = "https://api.gamemonetize.com/sdk.js";
    fjs.parentNode.insertBefore(js, fjs);
  })(document, "script", "gamemonetize-sdk");
}
function _gmResolve(ok) {
  if (!_gmPending) return;
  const g = _gmPending; _gmPending = null;
  clearTimeout(g.timer);
  if (typeof g.done === "function") g.done(!!ok);
}
function showRewardedAd(onReward) {
  const done = (ok) => { if (ok && typeof onReward === "function") onReward(); };
  if (_gmReady && typeof sdk !== "undefined" && sdk && typeof sdk.showBanner === "function") {
    _gmPending = { done, earned: false, adShown: false,
                     timer: setTimeout(() => _gmResolve(true), 25000) };
    try { sdk.showBanner(); } catch (e) { _gmResolve(true); }
    return;
  }
  setTimeout(() => done(true), 800);
}

/* ==== Rewarded-ad hook ==== */
function _handleWatchAdContinue() {
  if (!(state && state.phase === 'ended' && state.outcome === 'lose')) return;
  showRewardedAd(() => {
    state.phase = 'playing';
            state.outcome = null;
            state.stamina = Math.max(2, state.stamina);
            state.finishedAtMs = 0;
            app.innerHTML = renderGame(state);
  });
}

(function () {
  const seen = new WeakSet();
  const check = () => {
    if (!(state && state.phase === 'ended' && state.outcome === 'lose')) return;
    const actions = document.querySelector(".end-actions, .card .actions, .game-over-actions, .actions-row");
    if (!actions || seen.has(actions)) return;
    if (actions.querySelector('[data-action="watch-ad-continue"]')) return;
    seen.add(actions);
    const btn = document.createElement("button");
    btn.className = "gold";
    btn.setAttribute("data-action", "watch-ad-continue");
    btn.textContent = "▶ WATCH AD → REFILL STAMINA";
    const refNode = actions.firstChild;
    actions.insertBefore(btn, refNode);
  };
  setInterval(check, 400);
}());

document.addEventListener("click", function (e) {
  const t = e.target.closest && e.target.closest("[data-action]");
  if (t && t.getAttribute("data-action") === "watch-ad-continue") {
    e.preventDefault();
    _handleWatchAdContinue();
  }
}, true);

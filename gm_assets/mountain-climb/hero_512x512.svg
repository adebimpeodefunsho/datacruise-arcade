<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C2A0F"/>
      <stop offset="1" stop-color="#3A1A05"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="430" cy="110" r="42" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>
  <g stroke="#FFC500" stroke-width="4" stroke-linecap="round">
    <line x1="430" y1="52" x2="430" y2="30"/>
    <line x1="430" y1="192" x2="430" y2="170"/>
    <line x1="490" y1="110" x2="472" y2="110"/>
    <line x1="388" y1="110" x2="370" y2="110"/>
    <line x1="472" y1="70" x2="460" y2="82"/>
    <line x1="400" y1="138" x2="388" y2="150"/>
  </g>

  <!-- Clouds -->
  <g opacity="0.7">
    <circle cx="80" cy="90" r="18" fill="#FFF"/>
    <circle cx="106" cy="88" r="22" fill="#FFF"/>
    <circle cx="134" cy="94" r="16" fill="#FFF"/>
  </g>

  <!-- Mountain silhouette -->
  <path d="M 0 490 L 0 380 L 90 300 L 160 340 L 240 240 L 320 300 L 380 260 L 460 320 L 512 300 L 512 490 Z"
        fill="url(#mtn)" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Snowy peaks -->
  <path d="M 220 260 L 240 240 L 260 260 L 245 268 Z" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M 65 320 L 90 300 L 115 320 L 92 328 Z" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Climb line chart on the mountain face -->
  <g transform="translate(0,0)">
    <polyline points="20,470 65,430 120,400 175,375 230,340 290,300 340,270 400,240"
              fill="none" stroke="#FFC500" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#FFC500" stroke="#1A1A1A" stroke-width="2">
      <circle cx="20" cy="470" r="6"/>
      <circle cx="65" cy="430" r="6"/>
      <circle cx="120" cy="400" r="6"/>
      <circle cx="175" cy="375" r="6"/>
      <circle cx="230" cy="340" r="6"/>
      <circle cx="290" cy="300" r="6"/>
      <circle cx="340" cy="270" r="6"/>
    </g>
  </g>

  <!-- Trophy on summit -->
  <g transform="translate(240,210)">
    <path d="M -18 0 L 18 0 L 15 24 L -15 24 Z" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M -22 -6 L 22 -6 L 20 0 L -20 0 Z" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-10" y="24" width="20" height="4" fill="#1A1A1A"/>
    <rect x="-14" y="28" width="28" height="4" rx="1" fill="#1A1A1A"/>
    <path d="M -22 -6 Q -32 6 -22 14" stroke="#1A1A1A" stroke-width="2.5" fill="none"/>
    <path d="M 22 -6 Q 32 6 22 14" stroke="#1A1A1A" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Bug-Bug climbing (near the top of the chart line) -->
  <g transform="translate(400,242)">
    <ellipse cx="0" cy="8" rx="18" ry="22" fill="#D44A00" stroke="#1A1A1A" stroke-width="2.5"/>
    <line x1="-18" y1="8" x2="18" y2="8" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="-8" cy="-2" r="2.5" fill="#1A1A1A"/>
    <circle cx="8" cy="-4" r="2.5" fill="#1A1A1A"/>
    <circle cx="-8" cy="18" r="2.5" fill="#1A1A1A"/>
    <circle cx="8" cy="16" r="2.5" fill="#1A1A1A"/>
    <circle cx="0" cy="-14" r="10" fill="#1A1A1A"/>
    <circle cx="-3" cy="-16" r="2" fill="#FFF"/>
    <circle cx="4" cy="-17" r="2" fill="#FFF"/>
    <circle cx="-3" cy="-17" r="1" fill="#1A1A1A"/>
    <circle cx="4" cy="-18" r="1" fill="#1A1A1A"/>
    <line x1="-6" y1="-24" x2="-9" y2="-32" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="6" y1="-24" x2="9" y2="-32" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="-9" cy="-32" r="2" fill="#1A1A1A"/>
    <circle cx="9" cy="-32" r="2" fill="#1A1A1A"/>
  </g>

  <!-- Title panel -->
  <g transform="translate(256,90)">
    <rect x="-190" y="-40" width="380" height="80" rx="18" fill="#1A1A1A" opacity="0.92"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#FFC500" letter-spacing="2">MOUNTAIN CLIMB</text>
    <text x="0" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 1</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C2A0F"/>
      <stop offset="1" stop-color="#3A1A05"/>
    </linearGradient>
  </defs>
  <rect width="512" height="384" fill="url(#sky)"/>

  <circle cx="440" cy="70" r="34" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>

  <g opacity="0.6">
    <circle cx="70" cy="58" r="14" fill="#FFF"/>
    <circle cx="92" cy="56" r="18" fill="#FFF"/>
    <circle cx="114" cy="60" r="12" fill="#FFF"/>
  </g>

  <!-- Mountain -->
  <path d="M 0 384 L 0 280 L 90 210 L 160 250 L 240 160 L 320 210 L 380 180 L 460 230 L 512 220 L 512 384 Z"
        fill="url(#mtn)" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M 220 180 L 240 160 L 260 180 L 245 188 Z" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Climb chart -->
  <polyline points="20,360 60,325 110,296 165,268 220,238 275,205 330,185"
            fill="none" stroke="#FFC500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFC500" stroke="#1A1A1A" stroke-width="1.8">
    <circle cx="20" cy="360" r="5.5"/>
    <circle cx="60" cy="325" r="5.5"/>
    <circle cx="110" cy="296" r="5.5"/>
    <circle cx="165" cy="268" r="5.5"/>
    <circle cx="220" cy="238" r="5.5"/>
    <circle cx="275" cy="205" r="5.5"/>
  </g>

  <!-- Trophy -->
  <g transform="translate(240,135)">
    <path d="M -14 0 L 14 0 L 12 18 L -12 18 Z" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M -17 -5 L 17 -5 L 15 0 L -15 0 Z" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="-8" y="18" width="16" height="3" fill="#1A1A1A"/>
    <rect x="-11" y="21" width="22" height="3" rx="1" fill="#1A1A1A"/>
  </g>

  <!-- Bug-Bug -->
  <g transform="translate(330,162)">
    <ellipse cx="0" cy="7" rx="15" ry="19" fill="#D44A00" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="-15" y1="7" x2="15" y2="7" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="-6" cy="-2" r="2.2" fill="#1A1A1A"/>
    <circle cx="6" cy="-3" r="2.2" fill="#1A1A1A"/>
    <circle cx="0" cy="-13" r="8.5" fill="#1A1A1A"/>
    <circle cx="-2" cy="-15" r="1.6" fill="#FFF"/>
    <circle cx="3" cy="-16" r="1.6" fill="#FFF"/>
  </g>

  <!-- Title panel -->
  <g transform="translate(256,64)">
    <rect x="-200" y="-36" width="400" height="76" rx="18" fill="#1A1A1A" opacity="0.92"/>
    <text x="0" y="4" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#FFC500" letter-spacing="2">MOUNTAIN CLIMB</text>
    <text x="0" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 1</text>
  </g>
</svg>

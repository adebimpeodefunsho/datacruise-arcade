<svg xmlns="http://www.w3.org/2000/svg" width="512" height="340" viewBox="0 0 512 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C2A0F"/>
      <stop offset="1" stop-color="#3A1A05"/>
    </linearGradient>
  </defs>
  <rect width="512" height="340" fill="url(#sky)"/>

  <circle cx="440" cy="66" r="30" fill="#FFC500" stroke="#1A1A1A" stroke-width="3"/>

  <g opacity="0.6">
    <circle cx="70" cy="52" r="14" fill="#FFF"/>
    <circle cx="90" cy="50" r="18" fill="#FFF"/>
    <circle cx="110" cy="54" r="12" fill="#FFF"/>
  </g>

  <!-- Mountain -->
  <path d="M 0 340 L 0 250 L 90 190 L 160 220 L 240 148 L 320 190 L 380 170 L 460 210 L 512 200 L 512 340 Z"
        fill="url(#mtn)" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M 220 168 L 240 148 L 260 168 L 245 174 Z" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Climb chart -->
  <polyline points="20,320 60,290 110,265 165,240 220,215 275,190 330,175"
            fill="none" stroke="#FFC500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFC500" stroke="#1A1A1A" stroke-width="1.8">
    <circle cx="20" cy="320" r="5"/>
    <circle cx="60" cy="290" r="5"/>
    <circle cx="110" cy="265" r="5"/>
    <circle cx="165" cy="240" r="5"/>
    <circle cx="220" cy="215" r="5"/>
    <circle cx="275" cy="190" r="5"/>
  </g>

  <!-- Trophy -->
  <g transform="translate(240,125)">
    <path d="M -14 0 L 14 0 L 12 18 L -12 18 Z" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M -17 -5 L 17 -5 L 15 0 L -15 0 Z" fill="#FFC500" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="-8" y="18" width="16" height="3" fill="#1A1A1A"/>
    <rect x="-11" y="21" width="22" height="3" rx="1" fill="#1A1A1A"/>
  </g>

  <!-- Bug-Bug -->
  <g transform="translate(330,152)">
    <ellipse cx="0" cy="6" rx="14" ry="18" fill="#D44A00" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="-14" y1="6" x2="14" y2="6" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="-6" cy="-2" r="2" fill="#1A1A1A"/>
    <circle cx="6" cy="-3" r="2" fill="#1A1A1A"/>
    <circle cx="0" cy="-12" r="8" fill="#1A1A1A"/>
    <circle cx="-2" cy="-14" r="1.5" fill="#FFF"/>
    <circle cx="3" cy="-15" r="1.5" fill="#FFF"/>
  </g>

  <!-- Title panel -->
  <g transform="translate(256,60)">
    <rect x="-200" y="-32" width="400" height="70" rx="18" fill="#1A1A1A" opacity="0.92"/>
    <text x="0" y="4" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#FFC500" letter-spacing="2">MOUNTAIN CLIMB</text>
    <text x="0" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 1</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>

  <g opacity="0.6">
    <circle cx="80" cy="60" r="18" fill="#FFF"/>
    <circle cx="106" cy="58" r="22" fill="#FFF"/>
    <circle cx="134" cy="64" r="16" fill="#FFF"/>
    <circle cx="410" cy="70" r="20" fill="#FFF"/>
    <circle cx="440" cy="66" r="22" fill="#FFF"/>
  </g>

  <!-- Question panel -->
  <g transform="translate(256, 220)">
    <rect x="-210" y="-64" width="420" height="128" rx="18" fill="#FFF7E2" stroke="#1A1A1A" stroke-width="3"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#5C2A0F" letter-spacing="2">Q3 · WHICH CHART SHOWS TREND?</text>
    <!-- Answer choices -->
    <g transform="translate(-140, 8)">
      <rect x="-58" y="-22" width="116" height="60" rx="8" fill="#FF6A1A" stroke="#1A1A1A" stroke-width="2.5"/>
      <polyline points="-42,20 -22,4 -2,16 18,-8 38,6" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="-10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFF" letter-spacing="1">A</text>
    </g>
    <g transform="translate(0, 8)">
      <rect x="-58" y="-22" width="116" height="60" rx="8" fill="#FFF" stroke="#1A1A1A" stroke-width="2.5"/>
      <g transform="translate(-30, 10)">
        <rect x="0" y="0" width="12" height="24" fill="#FFC500" stroke="#1A1A1A" stroke-width="1.5"/>
        <rect x="16" y="-8" width="12" height="32" fill="#FFC500" stroke="#1A1A1A" stroke-width="1.5"/>
        <rect x="32" y="4" width="12" height="20" fill="#FFC500" stroke="#1A1A1A" stroke-width="1.5"/>
        <rect x="48" y="-4" width="12" height="28" fill="#FFC500" stroke="#1A1A1A" stroke-width="1.5"/>
      </g>
      <text x="0" y="-10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#1A1A1A" letter-spacing="1">B</text>
    </g>
    <g transform="translate(140, 8)">
      <rect x="-58" y="-22" width="116" height="60" rx="8" fill="#FFF" stroke="#1A1A1A" stroke-width="2.5"/>
      <g transform="translate(0, 12)">
        <circle r="20" fill="#1A1A1A"/>
        <path d="M 0 0 L 0 -18 A 18 18 0 0 1 15 8 Z" fill="#2BB673"/>
        <path d="M 0 0 L 15 8 A 18 18 0 0 1 -14 10 Z" fill="#5DC1E8"/>
        <path d="M 0 0 L -14 10 A 18 18 0 0 1 0 -18 Z" fill="#E84A8B"/>
      </g>
      <text x="0" y="-10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#1A1A1A" letter-spacing="1">C</text>
    </g>
  </g>

  <!-- Timer bar -->
  <g transform="translate(256, 310)">
    <rect x="-160" y="-8" width="320" height="16" rx="8" fill="#FFF" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="-158" y="-6" width="180" height="12" rx="6" fill="#FF6A1A"/>
    <text x="0" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#1A1A1A" letter-spacing="2">TIMER · 07s</text>
  </g>

  <!-- Bug-Bug scientist -->
  <g transform="translate(120, 400)">
    <!-- Lab coat -->
    <rect x="-32" y="10" width="64" height="60" rx="6" fill="#FFF" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="4 2"/>
    <ellipse cx="0" cy="6" rx="26" ry="30" fill="#D44A00" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="-26" y1="6" x2="26" y2="6" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="-11" cy="-4" r="3.5" fill="#1A1A1A"/>
    <circle cx="11" cy="-6" r="3.5" fill="#1A1A1A"/>
    <circle cx="0" cy="-22" r="13" fill="#1A1A1A"/>
    <circle cx="-4" cy="-25" r="3" fill="#FFF"/>
    <circle cx="4" cy="-26" r="3" fill="#FFF"/>
    <circle cx="-4" cy="-26" r="1.5" fill="#1A1A1A"/>
    <circle cx="4" cy="-27" r="1.5" fill="#1A1A1A"/>
    <!-- Clipboard -->
    <rect x="20" y="30" width="30" height="34" fill="#FFC500" stroke="#1A1A1A" stroke-width="2.5"/>
    <line x1="25" y1="38" x2="45" y2="38" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="25" y1="46" x2="45" y2="46" stroke="#1A1A1A" stroke-width="1.5"/>
    <line x1="25" y1="54" x2="40" y2="54" stroke="#1A1A1A" stroke-width="1.5"/>
  </g>

  <!-- Beaker -->
  <g transform="translate(400, 420)">
    <path d="M -20 -30 L -20 -20 L -28 30 L 28 30 L 20 -20 L 20 -30 Z" fill="#5DC1E8" fill-opacity="0.7" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="-24" y="-32" width="48" height="6" fill="#1A1A1A"/>
    <path d="M -20 10 L 20 10" stroke="#1A1A1A" stroke-width="1.5" opacity="0.4"/>
    <circle cx="-4" cy="18" r="4" fill="#FFF" opacity="0.7"/>
    <circle cx="10" cy="14" r="3" fill="#FFF" opacity="0.7"/>
  </g>

  <!-- Title panel -->
  <g transform="translate(256, 90)">
    <rect x="-210" y="-40" width="420" height="80" rx="20" fill="#1A1A1A" opacity="0.94"/>
    <text x="0" y="0" text-anchor="middle" font-family="Impact, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#FFC500" letter-spacing="2">DECISION LAB</text>
    <text x="0" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFF7E2" letter-spacing="3">DATACRUISE ARCADE · GAME 6</text>
  </g>
</svg>

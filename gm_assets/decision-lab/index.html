  <style>
/* ============================================================
   Bug-Bug's Decision Lab — styles
============================================================ */

:root {
  --bg:        #fff8f1;
  --ink:       #0e0e10;
  --ink-soft:  #3a3a40;
  --muted:     #6b6b73;
  --orange:    #ff6a00;
  --orange-dk: #d75200;
  --yellow:    #ffc94d;
  --green:     #34d399;
  --green-dk:  #047857;
  --red:       #dc2626;
  --red-dk:    #991b1b;
  --teal:      #0ea5a4;
  --lilac:     #a78bfa;
  --card:      #ffffff;
  --line:      #0e0e10;
  --shadow:    0 6px 0 0 var(--line);
  --radius:    14px;
  --font:      ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.45; }
button { font-family: inherit; }

.primary-btn {
  display: inline-block;
  padding: 12px 24px;
  background: var(--orange);
  color: #fff;
  border: 3px solid var(--line);
  border-radius: 999px;
  font-weight: 900;
  font-size: 16px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 80ms ease, box-shadow 80ms ease;
}
.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 0 var(--line); }
.primary-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 0 var(--line); }
.primary-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ===================== TITLE SCREEN ===================== */

.title-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.title-card {
  max-width: 640px;
  width: 100%;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 36px 32px;
  box-shadow: 0 8px 0 0 var(--line);
  text-align: center;
}
.title-logo { width: 100px; height: 80px; margin-bottom: 12px; }
.title-heading {
  margin: 0 0 8px;
  font-size: clamp(28px, 6vw, 44px);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.05;
}
.title-subtitle { margin: 0 0 22px; color: var(--ink-soft); font-size: 15px; }

.title-howto {
  margin-top: 22px;
  text-align: left;
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 14px;
}
.title-howto summary { cursor: pointer; font-weight: 900; color: var(--ink); padding: 4px 0; }
.howto-body { margin-top: 10px; color: var(--ink-soft); line-height: 1.55; }
.howto-body h4 { margin: 16px 0 6px; font-size: 13px; font-weight: 900; color: var(--ink); letter-spacing: 0.05em; text-transform: uppercase; }
.howto-goal { background: #ffe0b3; border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px !important; }
.howto-rounds { padding-left: 22px; margin: 4px 0 0; }
.howto-rounds li { padding: 6px 0; }
.howto-round-desc { color: var(--muted); }
.howto-threshold { display: inline-block; background: var(--yellow); border: 2px solid var(--line); padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 800; margin-left: 6px; }
.howto-flow { list-style: none; padding: 0; margin: 4px 0 0; }
.howto-flow li { padding: 4px 0; }
.howto-tip { background: #e8f4ea; border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 14px !important; font-size: 13px; }

/* ===================== ROUND INTRO ===================== */

.round-intro-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.round-intro-card {
  max-width: 560px;
  width: 100%;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 36px 32px;
  box-shadow: 0 8px 0 0 var(--line);
  text-align: center;
}
.round-badge {
  display: inline-block;
  background: var(--orange);
  color: #fff;
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-weight: 900;
  letter-spacing: 0.1em;
  font-size: 12px;
  margin-bottom: 16px;
}
.round-name { margin: 0 0 8px; font-size: 32px; font-weight: 900; letter-spacing: -0.01em; }
.round-desc { color: var(--ink-soft); font-size: 15px; margin: 0 0 24px; }
.round-stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
.round-stat {
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 12px 16px;
  min-width: 110px;
}
.round-stat .label { display: block; font-size: 10px; font-weight: 900; color: var(--muted); letter-spacing: 0.12em; }
.round-stat strong { display: block; font-size: 22px; font-weight: 900; margin-top: 4px; }

/* ===================== GAME SCREEN ===================== */

.game-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.status-bar {
  display: grid;
  grid-template-columns: 1.8fr 0.7fr 0.9fr 1.2fr 0.7fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 18px;
  background: var(--card);
  border-bottom: 3px solid var(--line);
}
.mute-btn {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 999px;
  font-size: 18px;
  padding: 6px 10px;
  cursor: pointer;
  line-height: 1;
}
.mute-btn:hover { background: var(--bg); }
.status-bar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.status-bar .brand-logo { width: 36px; height: 28px; }
.status-bar .brand h1 { margin: 0; font-size: 15px; font-weight: 900; letter-spacing: 0.02em; }
.status-bar .brand p { margin: 0; font-size: 11px; color: var(--muted); }
.header-stat .label { display: block; font-size: 9px; font-weight: 900; color: var(--muted); letter-spacing: 0.12em; }
.header-stat strong { display: block; font-size: 18px; font-weight: 900; margin-top: 2px; }
.header-stat .dim { color: var(--muted); font-weight: 600; }
.header-timer.urgent strong { color: var(--red); animation: pulse-red 1s ease-in-out infinite; }
@keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

/* Main split layout */
.game-main {
  flex: 1;
  display: grid;
  grid-template-columns: 1.7fr 0.8fr;
  gap: 18px;
  padding: 18px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

/* ===================== LEFT: BIG SCREEN ===================== */

.big-screen {
  position: relative;
}
.screen-bezel {
  background: #1c1f33;
  border: 6px solid var(--line);
  border-radius: 20px;
  padding: 14px;
  box-shadow: 0 8px 0 0 var(--line);
  min-height: 540px;
  display: flex;
  flex-direction: column;
}
.screen-inner {
  background: var(--card);
  border-radius: 10px;
  padding: 18px 22px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chart-area {
  background: var(--bg);
  border: 2px dashed #ddd;
  border-radius: 12px;
  padding: 10px;
}
.chart-svg { width: 100%; height: auto; display: block; }

.question-area {
  background: #fff7e8;
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
}
.question-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.question-tag {
  background: var(--orange);
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.08em;
  padding: 3px 9px;
  border-radius: 999px;
  border: 2px solid var(--line);
}
.question-counter { font-size: 12px; font-weight: 800; color: var(--muted); }
.question-prompt { margin: 0; font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.4; }

/* Reveal banner on the big screen — now just the educational explanation
   (the ✓/✗ + correct answer moved to the right-hand answer-display panel). */
.reveal-banner {
  border: 3px solid var(--line);
  border-radius: 12px;
  padding: 14px 18px;
  animation: banner-fade 0.4s ease-out;
}
.reveal-banner.correct { background: #d8f3dc; }
.reveal-banner.wrong   { background: #ffd6d6; }
.reveal-banner-label {
  display: block;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.15em;
  color: var(--ink);
  margin-bottom: 6px;
}
.reveal-banner.correct .reveal-banner-label { color: var(--green-dk); }
.reveal-banner.wrong   .reveal-banner-label { color: var(--red-dk); }
.reveal-explanation { font-size: 14px; color: var(--ink); line-height: 1.5; }
@keyframes banner-fade {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===================== RIGHT: POD PANEL ===================== */

.pod-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Small "answer screen" above the capsule */
.answer-display {
  background: #1c1f33;
  border: 4px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 6px 0 0 var(--line);
  transition: background 0.2s ease, border-color 0.2s ease;
}
.answer-display .label {
  display: block;
  font-size: 10px;
  font-weight: 900;
  color: var(--yellow);
  letter-spacing: 0.15em;
  margin-bottom: 6px;
}
.answer-text {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 18px;
  font-weight: 800;
  color: var(--green);
  background: #000;
  border: 2px solid #444;
  border-radius: 6px;
  padding: 10px 12px;
  min-height: 22px;
  word-break: break-word;
  text-shadow: 0 0 4px rgba(52, 211, 153, 0.5);
}
.answer-text.placeholder { color: #666; text-shadow: none; font-style: italic; }

/* Reveal state — small screen flips colour to show right/wrong + final answer */
.answer-display.reveal {
  animation: reveal-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.answer-display.reveal.correct {
  background: #064e3b;
  border-color: var(--green-dk);
  box-shadow: 0 6px 0 0 var(--green-dk);
}
.answer-display.reveal.wrong {
  background: #7f1d1d;
  border-color: var(--red-dk);
  box-shadow: 0 6px 0 0 var(--red-dk);
}
.answer-display.reveal .label {
  font-size: 14px;
  color: #fff;
}
.answer-display.reveal.correct .label { color: #a7f3d0; }
.answer-display.reveal.wrong   .label { color: #fecaca; }
.answer-text.reveal-answer {
  font-size: 17px;
  font-weight: 900;
  color: #fff;
  background: rgba(0, 0, 0, 0.4);
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
  font-family: var(--font);
  letter-spacing: 0.01em;
}
@keyframes reveal-pop {
  0%   { transform: scale(0.96); }
  60%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}

/* "Enter your answer ↓" label above the input area */
.input-label {
  display: block;
  font-size: 11px;
  font-weight: 900;
  color: var(--orange-dk);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* The capsule + Bug-Bug animations */
.capsule-wrap {
  display: flex;
  justify-content: center;
}
.capsule-svg {
  width: 100%;
  max-width: 220px;
  height: auto;
  transition: transform 0.2s ease;
}

/* Idle bobble when waiting for player to type (thinking) */
.capsule-thinking .capsule-svg {
  animation: bob 2.4s ease-in-out infinite;
}
.capsule-thinking .capsule-svg g[transform^="translate"]:last-of-type {
  /* The Bug-Bug group inside — wobble the antennae */
  animation: think-wobble 1.8s ease-in-out infinite;
  transform-origin: center;
  transform-box: fill-box;
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
@keyframes think-wobble {
  0%, 100% { transform: rotate(0deg); }
  25%      { transform: rotate(-3deg); }
  75%      { transform: rotate(3deg); }
}

/* Happy — bounce up on correct */
.capsule-happy .capsule-svg {
  animation: bounce-happy 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1;
}
@keyframes bounce-happy {
  0%   { transform: translateY(0) scale(1); }
  40%  { transform: translateY(-14px) scale(1.05); }
  70%  { transform: translateY(-4px) scale(1.02); }
  100% { transform: translateY(0) scale(1); }
}

/* Sad — slight slump on wrong */
.capsule-sad .capsule-svg {
  animation: slump-sad 0.7s ease-out 1 forwards;
}
@keyframes slump-sad {
  0%   { transform: translateY(0); }
  100% { transform: translateY(6px); }
}

/* Answer input below the capsule */
.answer-input-area { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.answer-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  box-shadow: var(--shadow);
}
.answer-input {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 16px;
  font-weight: 700;
  padding: 10px 12px;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
}
.answer-input:focus {
  outline: none;
  box-shadow: 0 0 0 3px var(--yellow);
}
.pod-submit-btn { width: 100%; }
.pod-continue-btn { width: 100%; }

/* Multiple choice */
.mc-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  box-shadow: var(--shadow);
}
.mc-btn {
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  transition: transform 80ms ease, background 80ms ease;
}
.mc-btn:hover { background: #fff; transform: translateX(2px); }
.mc-btn.selected { background: var(--orange); color: #fff; border-color: var(--line); }

/* ===================== ROUND END SCREEN ===================== */

.round-end-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.round-end-card {
  max-width: 560px;
  width: 100%;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 36px 32px;
  box-shadow: 0 8px 0 0 var(--line);
  text-align: center;
}
.round-end-card.passed { background: #ecfdf5; }
.round-end-card.failed { background: #fef2f2; }
.end-icon { font-size: 64px; line-height: 1; margin-bottom: 4px; }
.end-headline { margin: 0 0 4px; font-size: 28px; font-weight: 900; letter-spacing: 0.02em; }
.end-roundname { margin: 0 0 22px; font-size: 16px; font-weight: 700; color: var(--ink-soft); }

.end-score-bar-wrap { margin: 0 0 18px; }
.end-score-bar {
  position: relative;
  height: 24px;
  background: #fff;
  border: 3px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.end-score-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--orange);
  border-right: 3px solid var(--line);
  transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.end-score-fill.pass { background: var(--green); }
.end-score-fill.fail { background: var(--red); }
.end-score-threshold {
  position: absolute;
  top: -4px;
  bottom: -4px;
  width: 3px;
  background: var(--ink);
  transform: translateX(-50%);
}
.end-score-labels {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-top: 6px;
}
.end-score-labels .dim { color: var(--muted); }
.end-message { font-size: 14px; color: var(--ink-soft); margin: 0 0 22px; }

/* ===================== FINAL END SCREEN ===================== */

.final-end-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.final-end-card {
  max-width: 640px;
  width: 100%;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 36px 32px;
  box-shadow: 0 8px 0 0 var(--line);
  text-align: center;
}
.final-icon { font-size: 72px; line-height: 1; margin-bottom: 8px; }
.final-headline { margin: 0 0 6px; font-size: 32px; font-weight: 900; }
.final-sub { color: var(--ink-soft); font-size: 15px; margin: 0 0 24px; }
.final-overall {
  background: var(--yellow);
  border: 3px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px;
  margin: 0 0 22px;
  display: inline-block;
}
.final-overall .label {
  display: block;
  font-size: 11px;
  font-weight: 900;
  color: var(--ink);
  letter-spacing: 0.15em;
}
.final-overall .value { display: block; font-size: 44px; font-weight: 900; margin-top: 4px; }

.final-table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 24px;
  font-size: 14px;
}
.final-table th, .final-table td {
  padding: 8px 12px;
  border: 2px solid var(--line);
  text-align: left;
}
.final-table th { background: var(--yellow); font-weight: 900; }
.final-table td:first-child, .final-table th:first-child { text-align: center; }

.final-actions { margin-bottom: 16px; }
.final-data-note { font-size: 12px; color: var(--muted); font-style: italic; }

/* ===================== RESPONSIVE ===================== */

@media (max-width: 1000px) {
  .game-main { grid-template-columns: 1fr; }
  .pod-panel { flex-direction: row; flex-wrap: wrap; }
  .answer-display { flex: 1 1 100%; }
  .capsule-wrap { flex: 0 0 220px; }
  .answer-input-area { flex: 1 1 200px; }
  .status-bar { grid-template-columns: 1.5fr 0.5fr 0.7fr 1fr 0.5fr; }
}
@media (max-width: 700px) {
  .status-bar { grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px; }
  .status-bar .brand { grid-column: span 2; }
  .game-main { padding: 12px; gap: 12px; }
  .screen-bezel { min-height: auto; padding: 10px; }
  .screen-inner { padding: 12px 14px; }
  .pod-panel { flex-direction: column; }
  .capsule-wrap { flex: 0 0 auto; }
  .capsule-svg { max-width: 160px; }
}

@media (max-width: 820px) {
  html, body { overflow-x: hidden; max-width: 100vw; }
  html, body { min-height: 100vh; min-height: 100dvh; }
  .round-stat { min-width: 0; padding: 10px 12px; flex: 1 1 auto; }
  .round-stats { gap: 8px; }
  .game-screen { min-height: 100dvh; }
  /* Extra top padding clears the fixed Arcade / Share buttons; compress the
     header to two tight rows (brand + mute, then the four stats). */
  .status-bar {
    grid-template-columns: repeat(4, 1fr);
    padding: 44px 10px 4px; gap: 3px 6px; align-items: center;
  }
  .status-bar .brand { grid-column: 1 / 4; }
  .status-bar .mute-btn { grid-column: 4; justify-self: end; }
  .status-bar .brand-logo { width: 24px; height: 19px; }
  .status-bar .brand h1 { font-size: 12px; }
  .status-bar .brand p { display: none; }
  .header-stat { padding: 2px 4px; }
  .header-stat .label { font-size: 8px; }
  .header-stat strong { font-size: 13px; }

  /* Fit the whole question — chart AND answer options — on one screen so
     the player can read the chart while choosing. */
  .game-main { padding: 6px 8px; gap: 8px; }
  .screen-bezel { min-height: 0; padding: 6px; border-width: 4px; box-shadow: 0 4px 0 0 var(--line); }
  .screen-inner { padding: 8px 10px; gap: 8px; }
  .chart-area { padding: 4px; }
  .chart-svg { max-height: 128px; width: auto; margin: 0 auto; }

/* ==== audio.js ==== */
// Decision Lab — audio. Web Audio API tones, no external files.
// Mirrors the Mountain Climb audio pattern. All sounds short and
// muted-by-default-respecting.

let ctx = null;
let muted = false;

function ensureCtx() {
  if (ctx) return ctx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
  } catch (_) {
    ctx = null;
  }
  return ctx;
}

/**
 * Call this from a click handler (e.g. the PLAY button) to make sure
 * the AudioContext is unlocked from the browser's autoplay policy.
 * Browsers won't let audio play until they see a user gesture.
 */
function unlock() {
  const c = ensureCtx();
  if (!c) return;
  if (c.state === 'suspended') {
    c.resume?.();
  }
  // Play an inaudible blip to fully "warm up" iOS / Safari
  try {
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + 0.01);
  } catch (_) { /* ignore */ }
}

function setMuted(m) {
  muted = !!m;
  if (muted && ctx && ctx.state === 'running') {
    ctx.suspend?.();
  } else if (!muted && ctx && ctx.state === 'suspended') {
    ctx.resume?.();
  }
}

function isMuted() {
  return muted;
}

function envelope(gain, t0, peak, attack, decay, sustain, sustainLevel, release) {
  gain.gain.cancelScheduledValues(t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0 + attack);
  gain.gain.linearRampToValueAtTime(peak * sustainLevel, t0 + attack + decay);
  gain.gain.setValueAtTime(peak * sustainLevel, t0 + attack + decay + sustain);
  gain.gain.linearRampToValueAtTime(0, t0 + attack + decay + sustain + release);
}

function tone({ freq, type = 'sine', peak = 0.2, attack = 0.01, decay = 0.05, sustain = 0.05, sustainLevel = 0.6, release = 0.1, freqEndRamp = null }) {
  if (muted) return;
  const c = ensureCtx();
  if (!c) return;
  if (c.state === 'suspended') c.resume?.();
  const t0 = c.currentTime;
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freqEndRamp != null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEndRamp), t0 + attack + decay + sustain + release);
  }
  envelope(gain, t0, peak, attack, decay, sustain, sustainLevel, release);
  osc.connect(gain).connect(c.destination);
  osc.start(t0);
  osc.stop(t0 + attack + decay + sustain + release + 0.02);
}

/* ==== charts.js ==== */
// SVG chart renderers for Decision Lab.
// Each function returns an SVG string. Pure functions, no DOM access.

const PALETTE = ['#ff6a00', '#ffc94d', '#0ea5a4', '#a78bfa', '#2563eb', '#dc2626', '#16a34a'];

function fmtNum(n) {
  if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1) + 'k';
  if (Number.isInteger(n)) return String(n);
  return n.toFixed(1);
}

// ---------- Bar chart ----------
// Spec: { type: 'bar', title, ylabel, data: [{label, value, color?}] }
function renderBar(spec) {
  const VB_W = 640, VB_H = 360;
  const PAD_L = 60, PAD_R = 20, PAD_T = 40, PAD_B = 60;
  const plotW = VB_W - PAD_L - PAD_R;
  const plotH = VB_H - PAD_T - PAD_B;

  const data = spec.data;
  const maxV = Math.max(...data.map(d => d.value));
  const barW = plotW / data.length * 0.7;
  const gap = plotW / data.length * 0.3;

  let yTicks = '';
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const v = (maxV * i) / ticks;
    const y = PAD_T + plotH - (plotH * i) / ticks;
    yTicks += `<line x1="${PAD_L}" y1="${y}" x2="${PAD_L + plotW}" y2="${y}" stroke="#e5e5e5" stroke-width="1"/>`;
    yTicks += `<text x="${PAD_L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6b6b73" font-family="ui-sans-serif, system-ui">${fmtNum(v)}</text>`;
  }

  let bars = '';
  data.forEach((d, i) => {
    const x = PAD_L + (plotW / data.length) * i + gap / 2;
    const h = (d.value / maxV) * plotH;
    const y = PAD_T + plotH - h;
    const color = d.color || PALETTE[i % PALETTE.length];
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" stroke="#0e0e10" stroke-width="2" rx="3"/>`;
    bars += `<text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="#0e0e10" font-family="ui-sans-serif, system-ui">${fmtNum(d.value)}</text>`;
    bars += `<text x="${x + barW / 2}" y="${PAD_T + plotH + 18}" text-anchor="middle" font-size="11" fill="#3a3a40" font-family="ui-sans-serif, system-ui">${escapeXml(d.label)}</text>`;
  });

  const title = spec.title ? `<text x="${VB_W / 2}" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="#0e0e10" font-family="ui-sans-serif, system-ui">${escapeXml(spec.title)}</text>` : '';
  const ylabel = spec.ylabel ? `<text x="14" y="${PAD_T + plotH / 2}" text-anchor="middle" transform="rotate(-90 14 ${PAD_T + plotH / 2})" font-size="11" font-weight="700" fill="#3a3a40" font-family="ui-sans-serif, system-ui">${escapeXml(spec.ylabel)}</text>` : '';

  return `<svg viewBox="0 0 ${VB_W} ${VB_H}" class="chart-svg" role="img" aria-label="${escapeXml(spec.title || 'Bar chart')}">
    ${title}
    ${yTicks}
    <line x1="${PAD_L}" y1="${PAD_T + plotH}" x2="${PAD_L + plotW}" y2="${PAD_T + plotH}" stroke="#0e0e10" stroke-width="2"/>
    <line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T + plotH}" stroke="#0e0e10" stroke-width="2"/>
    ${bars}
    ${ylabel}
  </svg>`;
}

// ---------- Line chart ----------
// Spec: { type: 'line', title, ylabel, xlabels, series: [{label, color, values}] }
function renderLine(spec) {
  const VB_W = 640, VB_H = 360;
  const PAD_L = 60, PAD_R = 110, PAD_T = 40, PAD_B = 50;
  const plotW = VB_W - PAD_L - PAD_R;
  const plotH = VB_H - PAD_T - PAD_B;

  const allVals = spec.series.flatMap(s => s.values);
  const maxV = Math.max(...allVals);
  const minV = Math.min(0, ...allVals);
  const range = maxV - minV;
  const n = spec.xlabels.length;
  const xFor = (i) => PAD_L + (plotW * i) / (n - 1);
  const yFor = (v) => PAD_T + plotH - ((v - minV) / range) * plotH;

  let yTicks = '';
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const v = minV + (range * i) / ticks;
    const y = yFor(v);
    yTicks += `<line x1="${PAD_L}" y1="${y}" x2="${PAD_L + plotW}" y2="${y}" stroke="#e5e5e5" stroke-width="1"/>`;
    yTicks += `<text x="${PAD_L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6b6b73" font-family="ui-sans-serif, system-ui">${fmtNum(v)}</text>`;
  }

  let xLabels = '';
  spec.xlabels.forEach((lbl, i) => {
    xLabels += `<text x="${xFor(i)}" y="${PAD_T + plotH + 18}" text-anchor="middle" font-size="11" fill="#3a3a40" font-family="ui-sans-serif, system-ui">${escapeXml(lbl)}</text>`;
  });

  let lines = '';
  let legend = '';
  spec.series.forEach((s, idx) => {
    const color = s.color || PALETTE[idx % PALETTE.length];
    const path = s.values.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xFor(i)} ${yFor(v)}`).join(' ');
    lines += `<path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.values.forEach((v, i) => {
      lines += `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="4" fill="${color}" stroke="#0e0e10" stroke-width="1.5"/>`;
    });
    legend += `<g transform="translate(${PAD_L + plotW + 12} ${PAD_T + 16 + idx * 22})">
      <rect width="14" height="14" fill="${color}" stroke="#0e0e10" stroke-width="1.5" rx="2"/>
      <text x="20" y="11" font-size="11" font-weight="700" fill="#0e0e10" font-family="ui-sans-serif, system-ui">${escapeXml(s.label)}</text>
    </g>`;
  });

  const title = spec.title ? `<text x="${VB_W / 2}" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="#0e0e10" font-family="ui-sans-serif, system-ui">${escapeXml(spec.title)}</text>` : '';
  const ylabel = spec.ylabel ? `<text x="14" y="${PAD_T + plotH / 2}" text-anchor="middle" transform="rotate(-90 14 ${PAD_T + plotH / 2})" font-size="11" font-weight="700" fill="#3a3a40" font-family="ui-sans-serif, system-ui">${escapeXml(spec.ylabel)}</text>` : '';

  return `<svg viewBox="0 0 ${VB_W} ${VB_H}" class="chart-svg" role="img" aria-label="${escapeXml(spec.title || 'Line chart')}">
    ${title}
    ${yTicks}
    <line x1="${PAD_L}" y1="${PAD_T + plotH}" x2="${PAD_L + plotW}" y2="${PAD_T + plotH}" stroke="#0e0e10" stroke-width="2"/>
    <line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T + plotH}" stroke="#0e0e10" stroke-width="2"/>
    ${lines}
    ${xLabels}
    ${legend}
    ${ylabel}
  </svg>`;
}

// ---------- Pie chart ----------
// Spec: { type: 'pie', title, data: [{label, value, color?}] }
function renderPie(spec) {
  const VB_W = 640, VB_H = 360;
  const cx = 220, cy = 200, r = 130;
  const total = spec.data.reduce((s, d) => s + d.value, 0);

  let slices = '';
  let legend = '';
  let cursor = -Math.PI / 2;
  spec.data.forEach((d, i) => {
    const portion = d.value / total;
    const angle = portion * Math.PI * 2;
    const x1 = cx + r * Math.cos(cursor);
    const y1 = cy + r * Math.sin(cursor);
    cursor += angle;
    const x2 = cx + r * Math.cos(cursor);
    const y2 = cy + r * Math.sin(cursor);
    const large = angle > Math.PI ? 1 : 0;
    const color = d.color || PALETTE[i % PALETTE.length];
    slices += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${color}" stroke="#0e0e10" stroke-width="2.5"/>`;

    // Percentage label inside the slice
    const midAngle = cursor - angle / 2;
    const labelR = r * 0.65;
    const lx = cx + labelR * Math.cos(midAngle);
    const ly = cy + labelR * Math.sin(midAngle);
    if (portion > 0.05) {
      slices += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="ui-sans-serif, system-ui">${(portion * 100).toFixed(0)}%</text>`;
    }

    legend += `<g transform="translate(400 ${100 + i * 26})">
      <rect width="16" height="16" fill="${color}" stroke="#0e0e10" stroke-width="1.5" rx="2"/>
      <text x="22" y="13" font-size="12" font-weight="700" fill="#0e0e10" font-family="ui-sans-serif, system-ui">${escapeXml(d.label)} — ${fmtNum(d.value)}</text>
    </g>`;
  });

  const title = spec.title ? `<text x="${VB_W / 2}" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="#0e0e10" font-family="ui-sans-serif, system-ui">${escapeXml(spec.title)}</text>` : '';

  return `<svg viewBox="0 0 ${VB_W} ${VB_H}" class="chart-svg" role="img" aria-label="${escapeXml(spec.title || 'Pie chart')}">
    ${title}
    ${slices}
    ${legend}
  </svg>`;
}

function renderChart(spec) {
  switch (spec.type) {
    case 'bar':  return renderBar(spec);
    case 'line': return renderLine(spec);
    case 'pie':  return renderPie(spec);
    default:     return `<svg viewBox="0 0 640 360"><text x="320" y="180" text-anchor="middle">[unsupported chart: ${spec.type}]</text></svg>`;
  }
}

function escapeXml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}


/* ==== questions.js ==== */
// Question bank for Decision Lab.
//
// 5 rounds × 5 questions = 25 total. Each round represents a stage
// of data work:
//   1. Read the Chart      — extract specific values from a chart
//   2. Compare & Rank      — relative comparisons across categories
//   3. Spot Trends         — direction / pattern / anomaly over time
//   4. Make Decisions      — recommend an action given the data
//   5. Insight & Forecast  — what's next, what's the bigger story
//
// Pass thresholds rise per round (50% → 80%) so difficulty matches
// the task difficulty.
//
// Answer types:
//   'numeric'         — accepts numbers (with tolerance)
//   'multiple_choice' — pick one from options[]
//   'free_text'       — short text answer, case/whitespace tolerant,
//                        optional acceptedAnswers[] alternatives
//
// Datasets are realistic-but-synthesised, sourced from public
// reports (ONS, World Bank, industry data). Numbers picked to be
// plausible without claiming precise authority.

const TIMER_SECONDS = 30;

const ROUNDS = [
  // ─────────────────────────────────────────────────────────────
  // ROUND 1 — Read the Chart (50% to pass)
  // ─────────────────────────────────────────────────────────────
  {
    number: 1,
    name: "Read the Chart",
    description: "Look at the chart and tell us what you see. No tricks — just read the values.",
    passThreshold: 0.5,
    questions: [
      {
        id: 'r1q1',
        type: 'numeric',
        chart: {
          type: 'bar',
          title: 'UK monthly streaming-service subscribers (2024, millions)',

// ---------- Per-game randomisation ----------

const QUESTIONS_PER_ROUND = 5;

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Build the round set for one playthrough. Each round picks 5 questions
 * at random from its pool of 8 (so replays show different subsets), and
 * shuffles the option order for any multiple-choice question (so even
 * a repeated question feels new).
 *
 * Pure of state — pass through state.rounds to lock the selection for
 * the duration of one game.
 */
function generateGameRounds() {
  return ROUNDS.map(pool => {
    const picked = shuffleArray(pool.questions).slice(0, QUESTIONS_PER_ROUND);
    const finalised = picked.map(q => {
      if (q.type === 'multiple_choice' && Array.isArray(q.options)) {
        return { ...q, options: shuffleArray(q.options) };
      }
      return q;
    });
    return { ...pool, questions: finalised };
  });
}

// ---------- Answer checking ----------

/**
 * Compare a player's raw input to the correct answer for a question.
 * Returns { correct: boolean, normalisedInput: string }.
 *
 * - numeric:         parse as number, accept within ±tolerance
 * - multiple_choice: exact match against one of the options
 * - free_text:       case-insensitive, whitespace-tolerant, trimmed,
 *                    accepts any of correctAnswer + acceptedAnswers[]
 */
function checkAnswer(question, rawInput) {
  const raw = String(rawInput ?? '').trim();
  if (!raw) return { correct: false, normalisedInput: '' };

  if (question.type === 'numeric') {
    const cleaned = raw.replace(/[£$€,]/g, '').replace(/[a-z%]+$/i, '').trim();
    const num = Number.parseFloat(cleaned);
    if (Number.isNaN(num)) return { correct: false, normalisedInput: raw };
    const expected = Number(question.correctAnswer);
    const tolerance = question.tolerance ?? 0;
    return { correct: Math.abs(num - expected) <= tolerance, normalisedInput: String(num) };
  }

  if (question.type === 'multiple_choice') {
    return { correct: raw === String(question.correctAnswer), normalisedInput: raw };
  }

  if (question.type === 'free_text') {
    const norm = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const candidates = [question.correctAnswer, ...(question.acceptedAnswers || [])].map(norm);
    return { correct: candidates.includes(norm(raw)), normalisedInput: norm(raw) };
  }

  return { correct: false, normalisedInput: raw };
}


/* ==== state.js ==== */
// State machine for Decision Lab.
// Pure functions only — no DOM, no side effects.
//
// Phases:
//   'title'         — intro / play button
//   'round-intro'   — between rounds, shows the upcoming round's name + threshold
//   'question'      — chart + question + answer input + ticking timer
//   'reveal'        — answer locked, showing right/wrong + correct + explanation
//   'round-end'     — round complete, shows pass/fail vs threshold
//   'ended'         — game over (either ran out of rounds, or failed a round)


const TOTAL_ROUNDS = ROUNDS.length;

/** Create a fresh game state.
 *
 * `rounds` is the per-playthrough subset chosen from each round's question
 * pool. Two consecutive games will see different questions (and shuffled
 * multiple-choice options), so replays feel fresh.
 */
function createGame() {
  return {
    phase: 'title',
    rounds: generateGameRounds(), // per-game pick of 5 questions per round, options shuffled
    roundIndex: 0,         // 0-based index into state.rounds
    questionIndex: 0,      // 0-based index into the current round's questions
    timer: TIMER_SECONDS,
    typedAnswer: '',
    lastResult: null,      // { correct, correctAnswer, explanation }
    roundScores: [],       // array of { round, correct, total, percent, passed } for completed rounds
    currentRoundCorrect: 0,
  };
}

/** Get the current round object (or null if past the last round).
 *  Reads from state.rounds (the per-game pick) — falls back to the static
 *  ROUNDS pool defensively if state was constructed without it.
 */
function currentRound(state) {
  return state.rounds?.[state.roundIndex] || ROUNDS[state.roundIndex] || null;
}

/** Get the current question object (or null). */
function currentQuestion(state) {
  const round = currentRound(state);
  if (!round) return null;
  return round.questions[state.questionIndex] || null;
}

/** Move from title → round-intro for round 0. */
function startGame(state) {
  return { ...state, phase: 'round-intro', roundIndex: 0 };
}

/** Move from round-intro → question 0 of current round. */
function beginRound(state) {
  return {
    ...state,
    phase: 'question',
    questionIndex: 0,
    timer: TIMER_SECONDS,
    typedAnswer: '',
    lastResult: null,
    currentRoundCorrect: 0,
  };
}

/** User typed a character (we just store the full string, debounced upstream). */
function setTypedAnswer(state, text) {
  if (state.phase !== 'question') return state;
  return { ...state, typedAnswer: text };
}

/** Decrement timer by one second. Returns same state if not on 'question' phase. */
function tickTimer(state) {
  if (state.phase !== 'question') return state;
  const next = Math.max(0, state.timer - 1);
  if (next === 0) {
    // Timeout — auto-submit whatever's typed (or count as wrong if empty)
    return submitAnswer({ ...state, timer: 0 });
  }
  return { ...state, timer: next };
}

/** Submit the current answer — moves to 'reveal' phase. */
function submitAnswer(state) {
  if (state.phase !== 'question') return state;
  const question = currentQuestion(state);
  if (!question) return state;
  const { correct } = checkAnswer(question, state.typedAnswer);
  return {
    ...state,
    phase: 'reveal',
    lastResult: {
      correct,
      submittedAnswer: state.typedAnswer,
      correctAnswer: question.correctAnswer,
      explanation: question.explanation,
    },
    currentRoundCorrect: state.currentRoundCorrect + (correct ? 1 : 0),
  };
}

/** Click Continue after reveal — moves to next question, end of round, or end of game. */
function continueFromReveal(state) {
  if (state.phase !== 'reveal') return state;
  const round = currentRound(state);
  const isLastQuestionInRound = state.questionIndex >= round.questions.length - 1;
  if (!isLastQuestionInRound) {
    return {
      ...state,
      phase: 'question',
      questionIndex: state.questionIndex + 1,
      timer: TIMER_SECONDS,
      typedAnswer: '',
      lastResult: null,
    };
  }
  // End of round — calculate round result
  const total = round.questions.length;
  const correct = state.currentRoundCorrect;
  const percent = correct / total;
  const passed = percent >= round.passThreshold;
  const roundResult = { round: round.number, name: round.name, correct, total, percent, passed };
  return {
    ...state,
    phase: 'round-end',
    roundScores: state.roundScores.concat([roundResult]),
  };
}

/** Click Continue after round summary — advances to next round, or to 'ended'. */
function advanceFromRoundEnd(state) {
  if (state.phase !== 'round-end') return state;
  const lastRound = state.roundScores[state.roundScores.length - 1];
  if (!lastRound.passed) {
    // Failed the round — game over
    return { ...state, phase: 'ended' };
  }
  const nextRoundIndex = state.roundIndex + 1;
  if (nextRoundIndex >= TOTAL_ROUNDS) {
    // Completed all rounds — winner!
    return { ...state, phase: 'ended' };
  }
  return {
    ...state,
    phase: 'round-intro',
    roundIndex: nextRoundIndex,
    questionIndex: 0,
    currentRoundCorrect: 0,
  };
}

/** Overall % across completed rounds. */
function overallPercent(state) {
  if (state.roundScores.length === 0) return 0;
  const totalCorrect = state.roundScores.reduce((s, r) => s + r.correct, 0);
  const totalQuestions = state.roundScores.reduce((s, r) => s + r.total, 0);
  return totalCorrect / totalQuestions;
}

/** Did the player win (completed all rounds, each passing threshold)? */
function didWin(state) {
  return (
    state.phase === 'ended' &&
    state.roundScores.length === TOTAL_ROUNDS &&
    state.roundScores.every(r => r.passed)
  );
}


/* ==== render.js ==== */
// Decision Lab — render functions. Each returns an HTML string for #app.


function muteButton() {
  const m = isMuted();
  return `<button class="mute-btn" data-action="toggle-mute" title="${m ? 'Sound off — click to enable' : 'Sound on — click to mute'}">${m ? '🔇' : '🔊'}</button>`;
}

// ---------- Top-level dispatch ----------

function render(state) {
  if (state.phase === 'title')       return renderTitle(state);
  if (state.phase === 'round-intro') return renderRoundIntro(state);
  if (state.phase === 'question')    return renderQuestion(state);
  if (state.phase === 'reveal')      return renderReveal(state);
  if (state.phase === 'round-end')   return renderRoundEnd(state);
  if (state.phase === 'ended')       return renderEnd(state);
  return '<div>Unknown phase</div>';
}

            <p class="question-prompt">${escapeHtml(q.prompt)}</p>
          </div>
          ${showingReveal ? renderRevealBanner(state.lastResult, q) : ''}
        </div>
      </div>
    </section>`;
}

function renderRevealBanner(result, q) {
  // The ✓/✗ + correct answer now live on the right-hand answer-display panel.
  // The big-screen banner now just shows the educational explanation.
  return `
    <div class="reveal-banner ${result.correct ? 'correct' : 'wrong'}">
      <span class="reveal-banner-label">WHY?</span>
      <div class="reveal-explanation">${escapeHtml(q.explanation || '')}</div>
    </div>`;
}

function podPanel(state, q, mood = 'neutral') {
  // The right-hand "pod" area: small screen above the capsule + answer entry below.
  return `
    <aside class="pod-panel">
      ${renderAnswerDisplay(state, q)}
      <div class="capsule-wrap capsule-${mood}">
        ${capsule(220, 280, mood)}
      </div>
      <div class="answer-input-area">
        ${renderAnswerInput(state, q)}
      </div>
    </aside>`;
}

function renderAnswerDisplay(state, q) {
  // On reveal: the small screen flips to show ✓/✗ + the final correct answer.
  if (state.phase === 'reveal' && state.lastResult) {
    const result = state.lastResult;
    const correctText = formatAnswerForDisplay(q, q.correctAnswer);
    return `
      <div class="answer-display reveal ${result.correct ? 'correct' : 'wrong'}">
        <span class="label">${result.correct ? '✓ CORRECT' : '✗ WRONG'}</span>
        <div class="answer-text reveal-answer">
          ${escapeHtml(correctText)}
        </div>
      </div>`;
  }
  // Question phase: shows what the player has typed (or the placeholder).
  return `
    <div class="answer-display">
      <span class="label">ANSWER</span>
      <div class="answer-text ${state.typedAnswer ? '' : 'placeholder'}">
        ${state.typedAnswer ? escapeHtml(state.typedAnswer) : 'awaiting input...'}
      </div>
    </div>`;
}

function renderAnswerInput(state, q) {
  if (state.phase !== 'question') {
    // On reveal, show the Continue button instead of the input
    return `
      <button class="primary-btn pod-continue-btn" data-action="continue-from-reveal">
        Continue →
      </button>`;
  }

  if (q.type === 'multiple_choice') {
    return `
      <div class="mc-options">
        <span class="input-label">Enter your answer ↓</span>
        ${q.options.map((opt) => `
          <button class="mc-btn ${state.typedAnswer === opt ? 'selected' : ''}"
                  data-action="pick-mc"
                  data-value="${escapeAttr(opt)}">
            ${escapeHtml(opt)}
          </button>
        `).join('')}
        <button class="primary-btn pod-submit-btn"
                data-action="submit-answer"
                ${state.typedAnswer ? '' : 'disabled'}>
          Submit →
        </button>
      </div>`;
  }

  // Numeric or free text
  const placeholder = q.type === 'numeric'
    ? (q.unit ? `e.g. 8.4 (${q.unit})` : 'type a number…')
    : 'type your answer…';
  return `
    <form class="answer-form" data-answer-form>
      <span class="input-label">Enter your answer ↓</span>
      <input
        type="text"
        class="answer-input"
        data-answer-input
        value="${escapeAttr(state.typedAnswer)}"
        placeholder="${escapeAttr(placeholder)}"
        autocomplete="off"
        spellcheck="false"
        autofocus
      />
      <button class="primary-btn pod-submit-btn" type="submit"
              ${state.typedAnswer ? '' : 'disabled'}>
        Submit →
      </button>
    </form>`;
}

// ---------- Reveal screen (re-uses question screen layout but with reveal-banner) ----------

function renderReveal(state) {
  const round = currentRound(state);
  const q = currentQuestion(state);
  const qIndex = state.questionIndex + 1;
  const total = round.questions.length;
  const mood = state.lastResult?.correct ? 'happy' : 'sad';
  return `
    <div class="screen game-screen reveal-phase">
      ${headerBar(state)}
      <main class="game-main">
        ${bigScreen(state, round, q, qIndex, total)}
        ${podPanel(state, q, mood)}
      </main>
    </div>`;
}

// ---------- Round end ----------

function renderRoundEnd(state) {
  const last = state.roundScores[state.roundScores.length - 1];
  const round = ROUNDS.find(r => r.number === last.round);
  const passed = last.passed;
  return `
    <div class="screen round-end-screen">
      <div class="round-end-card ${passed ? 'passed' : 'failed'}">
        <div class="end-icon">${passed ? '🎉' : '💔'}</div>
        <h1 class="end-headline">${passed ? 'ROUND COMPLETE' : 'ROUND FAILED'}</h1>
        <h2 class="end-roundname">Round ${last.round}: ${escapeHtml(last.name)}</h2>
        <div class="end-score-bar-wrap">
          <div class="end-score-bar">
            <div class="end-score-fill ${passed ? 'pass' : 'fail'}" style="width:${Math.round(last.percent * 100)}%"></div>
            <div class="end-score-threshold" style="left:${Math.round(round.passThreshold * 100)}%" title="Pass threshold"></div>
          </div>
          <div class="end-score-labels">
            <span><strong>${last.correct}</strong> / ${last.total} correct (${Math.round(last.percent * 100)}%)</span>
            <span class="dim">Threshold: ${Math.round(round.passThreshold * 100)}%</span>
          </div>
        </div>
        <p class="end-message">
          ${passed
            ? `Nice work — you met the ${Math.round(round.passThreshold * 100)}% threshold for this round.`
            : `You needed ${Math.round(round.passThreshold * 100)}% but scored ${Math.round(last.percent * 100)}%. The lab shuts down here.`}
        </p>
        <button class="primary-btn" data-action="advance-round">
          ${passed
            ? (last.round < TOTAL_ROUNDS ? 'NEXT ROUND →' : 'SEE FINAL SCORE →')
            : 'SEE FINAL SCORE →'}
        </button>
      </div>
    </div>`;
}

// ---------- End screen ----------

function renderEnd(state) {
  const won = didWin(state);
  const overall = Math.round(overallPercent(state) * 100);
  return `
    <div class="screen final-end-screen">
      <div class="final-end-card">
        <div class="final-icon">${won ? '🏆' : '📉'}</div>
        <h1 class="final-headline">${won ? 'LAB COMPLETE' : 'LAB CLOSED'}</h1>
        <p class="final-sub">
          ${won
            ? `You cleared all ${TOTAL_ROUNDS} rounds — that's the full data-analysis arc.`
            : `You made it to Round ${state.roundScores.length}. Try again — the lab is always open.`}
        </p>

        <div class="final-overall">
          <span class="label">OVERALL SCORE</span>
          <span class="value">${overall}%</span>
        </div>

        <table class="final-table">
          <thead><tr><th>Round</th><th>Topic</th><th>Score</th><th>Pass?</th></tr></thead>
          <tbody>
            ${state.roundScores.map(r => `
              <tr>
                <td>${r.round}</td>
                <td>${escapeHtml(r.name)}</td>
                <td>${r.correct}/${r.total} (${Math.round(r.percent * 100)}%)</td>
                <td>${r.passed ? '✓' : '✗'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="final-actions">
          <button class="primary-btn" data-action="restart">🔁 PLAY AGAIN</button>
        </div>

        <p class="final-data-note">
          📥 Data download coming in the next version — you'll be able to grab the
          datasets used in the quiz to explore them in Tableau / Excel / your tool
          of choice.
        </p>
      </div>
    </div>`;
}

// ---------- Helpers ----------

function formatAnswerForDisplay(q, answer) {
  if (q.type === 'numeric') {
    return q.unit ? `${answer} ${q.unit}` : String(answer);
  }
  return String(answer);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }


/* ==== Synthesised namespace objects for `import * as X` ==== */
const audio = { unlock, setMuted, isMuted, playKey, playTick, playPick, playCorrect, playWrong, playRoundWin, playRoundFail, playGameWin, playGameLose };

/* ==== main.js ==== */
// Bootstrap. Single state, single render, click + keyboard handlers,
// a 1-second tick when in 'question' phase.


const app = document.getElementById('app');

let state = createGame();
let timerInterval = null;
let lastPhase = null;

paint();
document.addEventListener('click', onClick);
document.addEventListener('input', onInput);
document.addEventListener('submit', onSubmit);
document.addEventListener('keydown', onKeydown);

// ---------- click router ----------

function onClick(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.getAttribute('data-action');
  if (target.hasAttribute('disabled')) return;

  switch (action) {
    case 'start':
      // Unlock the AudioContext on the very first user gesture so all
      // subsequent sounds play reliably (browsers block audio until
      // they see a click).
      audio.unlock();
      state = startGame(state);
      paint();
      return;
    case 'begin-round':
      audio.unlock(); // belt-and-braces in case the user disables sound at title and re-enables
      state = beginRound(state);
      paint();
      return;
    case 'pick-mc':
      state = setTypedAnswer(state, target.getAttribute('data-value') || '');
      audio.playPick();
      paint();
      return;
    case 'submit-answer':
      handleSubmit();
      return;
    case 'continue-from-reveal':
      state = continueFromReveal(state);
      paint();
      return;
    case 'advance-round':
      state = advanceFromRoundEnd(state);
      if (state.phase === 'ended') {
        if (didWin(state)) audio.playGameWin();
        else audio.playGameLose();
        const _c = state.roundScores.reduce((a, r) => a + r.correct, 0);
        const _t = state.roundScores.reduce((a, r) => a + r.total, 0) || 1;
        const _pct = _c / _t;
        window.DataCruiseResult && DataCruiseResult.ready({
          slug: 'decision-lab', game: 'Decision Lab',
          headline: _c + '/' + _t,
          sub: didWin(state)
            ? 'cleared every round! 🧪'
            : state.roundScores.length + '/5 rounds reached',
          stars: _pct >= 0.9 ? 3 : _pct >= 0.7 ? 2 : _pct > 0 ? 1 : 0, starsMax: 3,
        });
      }
      paint();
      return;
    case 'restart':
      state = createGame();
      paint();
      return;
    case 'toggle-mute':
      audio.setMuted(!audio.isMuted());
      paint();
      return;
  }
}

function handleSubmit() {
  state = submitAnswer(state);
  if (state.phase === 'reveal') {
    if (state.lastResult?.correct) audio.playCorrect();
    else audio.playWrong();
  }
  paint();
}

// ---------- typed input (numeric / free text) ----------

function onInput(e) {
  if (e.target.matches('[data-answer-input]')) {
    // Update state without full re-paint to preserve focus + caret position
    state.typedAnswer = e.target.value;
    syncMinorState();
  }
}

function onSubmit(e) {
  if (e.target.matches('[data-answer-form]')) {
    e.preventDefault();
    handleSubmit();
  }
}

function onKeydown(e) {
  // Enter advances Continue button on reveal
  if (e.key === 'Enter' && state.phase === 'reveal') {
    state = continueFromReveal(state);
    paint();
  }
  // Esc closes nothing currently (reserved for future)
}

// ---------- timer ----------

function ensureTimerRunning() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (state.phase === 'question') {
      const prevTimer = state.timer;
      state = tickTimer(state);
      if (state.phase !== 'question') {
        // submitAnswer fired from timeout — full repaint + reveal sound
        if (state.lastResult?.correct) audio.playCorrect();
        else audio.playWrong();
        paint();
      } else {
        // Tick sound for the last 5 seconds
        if (state.timer <= 5 && state.timer >= 1 && state.timer !== prevTimer) {
          audio.playTick();
        }
        syncTimerOnly();
      }
    } else {
      stopTimer();
    }
  }, 1000);
}

function stopTimer() {
  if (!timerInterval) return;
  clearInterval(timerInterval);
  timerInterval = null;
}

// ---------- render ----------

function paint() {
  const enteringRoundEnd = state.phase === 'round-end' && lastPhase !== 'round-end';
  app.innerHTML = render(state);
  lastPhase = state.phase;

  // Play round-end fanfare on transition
  if (enteringRoundEnd) {
    const last = state.roundScores[state.roundScores.length - 1];
    if (last?.passed) audio.playRoundWin();
    else audio.playRoundFail();
    // Animate the score-fill bar into its final width
    requestAnimationFrame(() => {
      const fill = app.querySelector('.end-score-fill');
      if (fill) {
        const target = fill.style.width;
        fill.style.width = '0%';
        requestAnimationFrame(() => { fill.style.width = target; });
      }
    });
  }

  if (state.phase === 'question') {
    ensureTimerRunning();
    const input = app.querySelector('[data-answer-input]');
    if (input) {
      setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 30);
    }
  } else {
    stopTimer();
  }
}

/** When the user types into the input, sync the small answer display
 *  without re-painting the whole screen (loses focus / caret). */
function syncMinorState() {
  const display = app.querySelector('.answer-text');
  if (display) {
    if (state.typedAnswer) {
      display.textContent = state.typedAnswer;
      display.classList.remove('placeholder');
    } else {
      display.textContent = 'awaiting input...';
      display.classList.add('placeholder');
    }
  }
  const submitBtn = app.querySelector('.pod-submit-btn');
  if (submitBtn) {
    if (state.typedAnswer) submitBtn.removeAttribute('disabled');
    else submitBtn.setAttribute('disabled', '');
  }
}

/** Sync just the timer display every second instead of re-painting. */
function syncTimerOnly() {
  const timer = app.querySelector('.header-timer strong');
  if (timer) timer.textContent = `${state.timer}s`;
  const timerWrap = app.querySelector('.header-timer');
  if (timerWrap) timerWrap.classList.toggle('urgent', state.timer <= 5);
}



/* ==== GameMonetize SDK bootstrap ==== */
const PLATFORM = "site";
const AD = { enabled: true, gameId: "0hmhteadfq07n01ftax00gzvxhdx99hs" };
let _gmReady = false, _gmPending = null;
// Enable GameMonetize test-ad mode on localhost / dev origins so ads actually
// serve during local verification. Real domains (GameMonetize's player,
// arcade.datacruise.app, etc.) get the production ad stack instead.
const _gmIsLocalOrigin = /^(127\.0\.0\.1|localhost|0\.0\.0\.0|::1)$/.test(location.hostname);
if (PLATFORM === "site" && AD.enabled && AD.gameId) {
  window.SDK_OPTIONS = {
    gameId: AD.gameId,
    testing: _gmIsLocalOrigin,
    debug: _gmIsLocalOrigin,
    onEvent: function (a) {
      switch (a && a.name) {
        case "SDK_READY":                   _gmReady = true; break;
        case "SDK_GAME_PAUSE":               if (_gmPending) _gmPending.adShown = true; break;
        case "SDK_REWARDED_WATCH_COMPLETE": if (_gmPending) _gmPending.earned = true; break;
        case "SDK_GAME_START":              _gmResolve(true); break;
        case "SDK_ERROR":                   _gmResolve(false); break;
      }
    }
  };
  (function (d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = "https://api.gamemonetize.com/sdk.js";
    fjs.parentNode.insertBefore(js, fjs);
  })(document, "script", "gamemonetize-sdk");
}
function _gmResolve(ok) {
  if (!_gmPending) return;
  const g = _gmPending; _gmPending = null;
  clearTimeout(g.timer);
  if (typeof g.done === "function") g.done(!!ok);
}
function showRewardedAd(onReward) {
  const done = (ok) => { if (ok && typeof onReward === "function") onReward(); };
  if (_gmReady && typeof sdk !== "undefined" && sdk && typeof sdk.showBanner === "function") {
    _gmPending = { done, earned: false, adShown: false,
                     timer: setTimeout(() => _gmResolve(true), 25000) };
    try { sdk.showBanner(); } catch (e) { _gmResolve(true); }
    return;
  }
  setTimeout(() => done(true), 800);
}

/* ==== Rewarded-ad hook ==== */
function _handleWatchAdContinue() {
  if (!(state && state.phase === 'ended' && typeof didWin === 'function' && !didWin(state))) return;
  showRewardedAd(() => {
    if (state.roundScores && state.roundScores.length > 0) state.roundScores.pop();
            state.phase = 'round-intro';
            state.questionIndex = 0;
            state.currentRoundCorrect = 0;
            state.typedAnswer = '';
            app.innerHTML = render(state);
  });
}

(function () {
  const seen = new WeakSet();
  const check = () => {
    if (!(state && state.phase === 'ended' && typeof didWin === 'function' && !didWin(state))) return;
    const actions = document.querySelector(".end-actions, .card .actions, .game-over-actions, .actions-row");
    if (!actions || seen.has(actions)) return;
    if (actions.querySelector('[data-action="watch-ad-continue"]')) return;
    seen.add(actions);
    const btn = document.createElement("button");
    btn.className = "gold";
    btn.setAttribute("data-action", "watch-ad-continue");
    btn.textContent = "▶ WATCH AD → RETRY THIS ROUND";
    const refNode = actions.firstChild;
    actions.insertBefore(btn, refNode);
  };
  setInterval(check, 400);
}());

document.addEventListener("click", function (e) {
  const t = e.target.closest && e.target.closest("[data-action]");
  if (t && t.getAttribute("data-action") === "watch-ad-continue") {
    e.preventDefault();
    _handleWatchAdContinue();
  }
}, true);

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lost in the Arcade · DataCruise</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/shared/hub.css" />
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .nf-card {
      max-width: 480px;
    }
    .nf-code {
      display: inline-block;
      background: var(--yellow);
      border: 2px solid var(--line);
      padding: 6px 18px;
      border-radius: 999px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }
    .nf-card h1 {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0 0 16px;
    }
    .nf-card p {
      color: var(--ink-soft);
      font-size: 18px;
      margin: 0 0 28px;
    }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-card">
      <span class="nf-code">404 · LOST IN THE ARCADE</span>
      <h1>That cabinet's not plugged in.</h1>
      <p>The page you tried to load doesn't exist — but ten games are still waiting.</p>
      <a href="/index.html" class="btn btn-primary">Back to the Arcade</a>
    </div>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A rebus puzzle hinting at the word DATA with letters and a magnifying glass">
  <rect width="320" height="180" fill="#ece6ff"/>
  <!-- speech-bubble panel -->
  <rect x="30" y="32" width="220" height="100" rx="10" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
  <path d="M70 132 L78 152 L92 132 Z" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
  <!-- rebus content: D + [emoji-ish dot] + T + A -->
  <g font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif" font-weight="900" font-size="40" fill="#0e0e10">
    <text x="60"  y="98">D</text>
    <circle cx="108" cy="84" r="14" fill="#ff6a00" stroke="#0e0e10" stroke-width="3"/>
    <text x="140" y="98">+</text>
    <text x="170" y="98">A</text>
  </g>
  <text x="86" y="125" font-family="ui-rounded, system-ui" font-weight="700" font-size="14" fill="#0e0e10" opacity=".6">read the rebus</text>
  <!-- magnifying glass (Magni) -->
  <g transform="translate(240,118)">
    <circle r="26" fill="#fff" stroke="#0e0e10" stroke-width="4"/>
    <circle r="22" fill="#a78bfa" opacity=".35"/>
    <line x1="18" y1="18" x2="38" y2="38" stroke="#0e0e10" stroke-width="6" stroke-linecap="round"/>
    <text x="-8" y="6" font-family="ui-rounded, system-ui" font-weight="900" font-size="22" fill="#0e0e10">?</text>
  </g>
</svg>

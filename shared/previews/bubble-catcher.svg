<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Colorful bubbles of varying sizes drifting with a string and net catcher">
  <rect width="320" height="180" fill="#ffe7d6"/>
  <!-- floor line -->
  <line x1="0" y1="160" x2="320" y2="160" stroke="#0e0e10" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- bubbles -->
  <g stroke="#0e0e10" stroke-width="2.5">
    <circle cx="60"  cy="55" r="22" fill="#ff6a00" opacity=".85"/>
    <circle cx="125" cy="80" r="14" fill="#ffc94d" opacity=".9"/>
    <circle cx="180" cy="45" r="28" fill="#a78bfa" opacity=".9"/>
    <circle cx="245" cy="90" r="18" fill="#0ea5a4" opacity=".9"/>
    <circle cx="285" cy="45" r="10" fill="#2563eb" opacity=".85"/>
    <circle cx="100" cy="120" r="8"  fill="#ff6a00" opacity=".85"/>
  </g>
  <!-- highlights -->
  <g fill="#fff" opacity=".55">
    <circle cx="52" cy="45" r="4"/>
    <circle cx="120" cy="72" r="3"/>
    <circle cx="170" cy="32" r="5"/>
    <circle cx="240" cy="82" r="3"/>
  </g>
  <!-- pull-string catcher -->
  <g stroke="#0e0e10" stroke-width="3" fill="none">
    <line x1="160" y1="0" x2="160" y2="140"/>
  </g>
  <g transform="translate(160,140)">
    <path d="M-22 0 Q0 30 22 0 Z" fill="#0e0e10"/>
    <path d="M-18 2 Q0 24 18 2" stroke="#ffc94d" stroke-width="3" fill="none"/>
  </g>
</svg>

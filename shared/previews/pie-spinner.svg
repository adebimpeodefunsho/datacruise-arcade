<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A pie chart with four colorful slices and a spinning arrow">
  <rect width="320" height="180" fill="#fff4e0"/>
  <!-- pie -->
  <g transform="translate(160,95)">
    <!-- slice 1 (orange, 0-120 deg) -->
    <path d="M0 0 L0 -70 A70 70 0 0 1 60.6 35 Z" fill="#ff6a00" stroke="#0e0e10" stroke-width="3"/>
    <!-- slice 2 (yellow, 120-210 deg) -->
    <path d="M0 0 L60.6 35 A70 70 0 0 1 -35 60.6 Z" fill="#ffc94d" stroke="#0e0e10" stroke-width="3"/>
    <!-- slice 3 (teal, 210-300 deg) -->
    <path d="M0 0 L-35 60.6 A70 70 0 0 1 -60.6 -35 Z" fill="#0ea5a4" stroke="#0e0e10" stroke-width="3"/>
    <!-- slice 4 (lilac, 300-360 deg) -->
    <path d="M0 0 L-60.6 -35 A70 70 0 0 1 0 -70 Z" fill="#a78bfa" stroke="#0e0e10" stroke-width="3"/>
    <!-- center hub -->
    <circle r="10" fill="#fff4e0" stroke="#0e0e10" stroke-width="3"/>
    <!-- spinner arrow -->
    <g transform="rotate(-30)">
      <path d="M0 0 L40 -8 L40 8 Z" fill="#0e0e10"/>
      <circle r="4" fill="#0e0e10"/>
    </g>
  </g>
  <!-- motion dots -->
  <g fill="#0e0e10" opacity=".4">
    <circle cx="280" cy="40" r="2"/>
    <circle cx="290" cy="55" r="2"/>
    <circle cx="295" cy="75" r="2"/>
  </g>
</svg>

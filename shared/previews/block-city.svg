<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Stacked colorful blocks forming a city-skyline bar chart">
  <rect width="320" height="180" fill="#fff1c2"/>
  <!-- ground -->
  <rect x="0" y="150" width="320" height="30" fill="#0e0e10"/>
  <line x1="0" y1="150" x2="320" y2="150" stroke="#0e0e10" stroke-width="3"/>
  <!-- bars / buildings -->
  <g stroke="#0e0e10" stroke-width="3">
    <!-- bar 1 -->
    <rect x="30" y="100" width="40" height="50" fill="#ff6a00"/>
    <rect x="36" y="108" width="6" height="8" fill="#fff1c2"/>
    <rect x="48" y="108" width="6" height="8" fill="#fff1c2"/>
    <rect x="60" y="108" width="6" height="8" fill="#fff1c2"/>
    <rect x="36" y="124" width="6" height="8" fill="#fff1c2"/>
    <rect x="48" y="124" width="6" height="8" fill="#fff1c2"/>
    <rect x="60" y="124" width="6" height="8" fill="#fff1c2"/>
    <!-- bar 2 -->
    <rect x="90" y="60" width="40" height="90" fill="#ffc94d"/>
    <rect x="96" y="70" width="6" height="8" fill="#0e0e10"/>
    <rect x="108" y="70" width="6" height="8" fill="#0e0e10"/>
    <rect x="120" y="70" width="6" height="8" fill="#0e0e10"/>
    <rect x="96" y="86" width="6" height="8" fill="#0e0e10"/>
    <rect x="108" y="86" width="6" height="8" fill="#0e0e10"/>
    <rect x="120" y="86" width="6" height="8" fill="#0e0e10"/>
    <rect x="96" y="102" width="6" height="8" fill="#0e0e10"/>
    <rect x="108" y="102" width="6" height="8" fill="#0e0e10"/>
    <rect x="120" y="102" width="6" height="8" fill="#0e0e10"/>
    <!-- bar 3 -->
    <rect x="150" y="80" width="40" height="70" fill="#2563eb"/>
    <rect x="156" y="90" width="6" height="8" fill="#fff1c2"/>
    <rect x="168" y="90" width="6" height="8" fill="#fff1c2"/>
    <rect x="180" y="90" width="6" height="8" fill="#fff1c2"/>
    <rect x="156" y="106" width="6" height="8" fill="#fff1c2"/>
    <rect x="168" y="106" width="6" height="8" fill="#fff1c2"/>
    <rect x="180" y="106" width="6" height="8" fill="#fff1c2"/>
    <!-- bar 4 -->
    <rect x="210" y="40" width="40" height="110" fill="#0ea5a4"/>
    <rect x="216" y="52" width="6" height="8" fill="#fff1c2"/>
    <rect x="228" y="52" width="6" height="8" fill="#fff1c2"/>
    <rect x="240" y="52" width="6" height="8" fill="#fff1c2"/>
    <rect x="216" y="68" width="6" height="8" fill="#fff1c2"/>
    <rect x="228" y="68" width="6" height="8" fill="#fff1c2"/>
    <rect x="240" y="68" width="6" height="8" fill="#fff1c2"/>
    <rect x="216" y="84" width="6" height="8" fill="#fff1c2"/>
    <rect x="228" y="84" width="6" height="8" fill="#fff1c2"/>
    <rect x="240" y="84" width="6" height="8" fill="#fff1c2"/>
    <rect x="216" y="100" width="6" height="8" fill="#fff1c2"/>
    <rect x="228" y="100" width="6" height="8" fill="#fff1c2"/>
    <rect x="240" y="100" width="6" height="8" fill="#fff1c2"/>
    <!-- bar 5 -->
    <rect x="270" y="110" width="22" height="40" fill="#a78bfa"/>
    <rect x="275" y="118" width="4" height="6" fill="#0e0e10"/>
    <rect x="283" y="118" width="4" height="6" fill="#0e0e10"/>
    <rect x="275" y="132" width="4" height="6" fill="#0e0e10"/>
    <rect x="283" y="132" width="4" height="6" fill="#0e0e10"/>
  </g>
</svg>

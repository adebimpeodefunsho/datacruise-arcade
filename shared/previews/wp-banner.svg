<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="DataCruise Arcade — 10 little games. Play now.">
  <defs>
    <linearGradient id="wp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd07a"/>
      <stop offset="0.55" stop-color="#ff9040"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="wp-marquee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#2a2a30"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#wp-bg)"/>

  <!-- ===== Top marquee bar with blinking-light dots ===== -->
  <rect x="0" y="0" width="1200" height="48" fill="url(#wp-marquee)"/>
  <g fill="#ffc94d">
    <circle cx="32"  cy="24" r="6"/>
    <circle cx="96"  cy="24" r="6" opacity=".5"/>
    <circle cx="160" cy="24" r="6"/>
    <circle cx="224" cy="24" r="6" opacity=".5"/>
    <circle cx="288" cy="24" r="6"/>
    <circle cx="352" cy="24" r="6" opacity=".5"/>
    <circle cx="416" cy="24" r="6"/>
    <circle cx="848" cy="24" r="6"/>
    <circle cx="912" cy="24" r="6" opacity=".5"/>
    <circle cx="976" cy="24" r="6"/>
    <circle cx="1040" cy="24" r="6" opacity=".5"/>
    <circle cx="1104" cy="24" r="6"/>
    <circle cx="1168" cy="24" r="6" opacity=".5"/>
  </g>
  <text x="600" y="33" text-anchor="middle"
        font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif"
        font-weight="900" font-size="20" letter-spacing="0.4em" fill="#ffc94d">
    ★ DATACRUISE ARCADE ★
  </text>

  <!-- ===== Bottom cabinet bar ===== -->
  <rect x="0" y="332" width="1200" height="28" fill="#0e0e10"/>

  <!-- ===== LEFT COLUMN — headline & tagline ===== -->
  <g font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif" fill="#0e0e10">
    <!-- Headline (y=85→140 approx, font 56) -->
    <text x="60" y="130" font-weight="900" font-size="56" letter-spacing="-0.02em">
      10 little games.
    </text>

    <!-- Yellow highlight box (y=152→226) -->
    <g transform="translate(60,152)">
      <rect width="630" height="74" rx="10" fill="#ffc94d" stroke="#0e0e10" stroke-width="4"/>
      <text x="20" y="54" font-weight="900" font-size="46">
        A whole lot of data sense.
      </text>
    </g>

    <!-- Tagline (y=265 + 296) -->
    <text x="60" y="265" font-weight="700" font-size="20" fill="#3a3a40">
      Build charts. Crack puzzles. Learn data by feel.
    </text>
    <text x="60" y="296" font-weight="600" font-size="16" fill="#3a3a40">
      For kids, classrooms &amp; the data-curious — no install, no accounts.
    </text>
  </g>

  <!-- ===== RIGHT COLUMN — CTA + info chip ===== -->
  <!-- CTA button (x=770→1130, y=130→198) -->
  <g transform="translate(770,130)">
    <rect width="360" height="68" rx="999" fill="#0e0e10"/>
    <rect x="6" y="6" width="348" height="56" rx="999" fill="#ff6a00" stroke="#fff" stroke-width="3"/>
    <text x="180" y="46" text-anchor="middle"
          font-family="ui-rounded, system-ui" font-weight="900" font-size="24" fill="#fff">
      ▶  PLAY THE ARCADE
    </text>
  </g>

  <!-- Info chip (x=770→1130, y=218→258) -->
  <g transform="translate(770,218)">
    <rect width="360" height="40" rx="999" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
    <text x="180" y="26" text-anchor="middle"
          font-family="ui-rounded, system-ui" font-weight="800" font-size="14" fill="#0e0e10">
      10 games · 4 free · £8 unlocks the lot
    </text>
  </g>

  <!-- Small secondary chip (x=770→1130, y=274→302) -->
  <g transform="translate(770,274)">
    <rect width="360" height="28" rx="999" fill="#ffc94d" stroke="#0e0e10" stroke-width="3"/>
    <text x="180" y="20" text-anchor="middle"
          font-family="ui-rounded, system-ui" font-weight="800" font-size="12" letter-spacing="0.06em" fill="#0e0e10">
      WORKS ON PHONE · TABLET · LAPTOP
    </text>
  </g>
</svg>

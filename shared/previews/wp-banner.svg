<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="DataCruise Arcade — 10 little games. Play now.">
  <defs>
    <linearGradient id="wp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd07a"/>
      <stop offset="0.55" stop-color="#ff9040"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="wp-marquee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#2a2a30"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#wp-bg)"/>

  <!-- Arcade-marquee top bar with blinking-light dots -->
  <rect x="0" y="0" width="1200" height="48" fill="url(#wp-marquee)"/>
  <g fill="#ffc94d">
    <circle cx="32"  cy="24" r="6"/>
    <circle cx="96"  cy="24" r="6"/>
    <circle cx="160" cy="24" r="6" opacity=".5"/>
    <circle cx="224" cy="24" r="6"/>
    <circle cx="288" cy="24" r="6" opacity=".5"/>
    <circle cx="352" cy="24" r="6"/>
    <circle cx="416" cy="24" r="6" opacity=".5"/>
    <circle cx="480" cy="24" r="6"/>
    <circle cx="544" cy="24" r="6" opacity=".5"/>
    <circle cx="608" cy="24" r="6"/>
    <circle cx="672" cy="24" r="6" opacity=".5"/>
    <circle cx="736" cy="24" r="6"/>
    <circle cx="800" cy="24" r="6" opacity=".5"/>
    <circle cx="864" cy="24" r="6"/>
    <circle cx="928" cy="24" r="6" opacity=".5"/>
    <circle cx="992" cy="24" r="6"/>
    <circle cx="1056" cy="24" r="6" opacity=".5"/>
    <circle cx="1120" cy="24" r="6"/>
    <circle cx="1184" cy="24" r="6" opacity=".5"/>
  </g>
  <text x="600" y="32" text-anchor="middle"
        font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif"
        font-weight="900" font-size="18" letter-spacing="0.18em" fill="#ffc94d">
    ★  D A T A C R U I S E   A R C A D E  ★
  </text>

  <!-- Bottom 'cabinet' bar -->
  <rect x="0" y="332" width="1200" height="28" fill="#0e0e10"/>

  <!-- Headline -->
  <g font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif" fill="#0e0e10">
    <text x="60" y="148" font-weight="900" font-size="58" letter-spacing="-0.02em">10 little games.</text>
    <g transform="translate(60,168)">
      <rect width="640" height="76" rx="10" fill="#ffc94d" stroke="#0e0e10" stroke-width="4"/>
      <text x="20" y="56" font-weight="900" font-size="48">A whole lot of data sense.</text>
    </g>
    <text x="60" y="278" font-weight="700" font-size="20" fill="#3a3a40">
      Build charts. Crack puzzles. Learn data by feel.
    </text>
    <text x="60" y="304" font-weight="700" font-size="16" fill="#3a3a40">
      For kids, classrooms &amp; the data-curious — no install, no accounts.
    </text>
  </g>

  <!-- CTA button + chips on the right -->
  <g transform="translate(800,140)">
    <rect width="340" height="68" rx="999" fill="#0e0e10"/>
    <rect x="6" y="6" width="328" height="56" rx="999" fill="#ff6a00" stroke="#fff" stroke-width="3"/>
    <text x="170" y="46" text-anchor="middle" font-family="ui-rounded, system-ui" font-weight="900" font-size="26" fill="#fff">
      ▶  PLAY THE ARCADE
    </text>
  </g>

  <!-- chips beneath the CTA -->
  <g transform="translate(800,228)" font-family="ui-rounded, system-ui" font-weight="800" font-size="13" fill="#0e0e10">
    <g>
      <rect width="105" height="30" rx="999" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
      <text x="52.5" y="20" text-anchor="middle">5 chart games</text>
    </g>
    <g transform="translate(115,0)">
      <rect width="105" height="30" rx="999" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
      <text x="52.5" y="20" text-anchor="middle">5 word games</text>
    </g>
    <g transform="translate(230,0)">
      <rect width="110" height="30" rx="999" fill="#ffc94d" stroke="#0e0e10" stroke-width="3"/>
      <text x="55" y="20" text-anchor="middle">4 free · £8 unlocks all</text>
    </g>
  </g>

  <!-- mini chart medley on the right side (decorative) -->
  <g transform="translate(60,238)" stroke="#0e0e10" stroke-width="2.5">
    <!-- small mountain -->
    <g>
      <path d="M0 60 L20 30 L40 45 L60 15 L80 35 L80 60 Z" fill="#0e0e10"/>
      <polyline points="2,60 20,30 40,45 60,15 78,35" fill="none" stroke="#ff6a00" stroke-width="3"/>
    </g>
    <!-- small bars -->
    <g transform="translate(100,16)">
      <rect x="0"  y="32" width="10" height="24" fill="#ff6a00"/>
      <rect x="14" y="20" width="10" height="36" fill="#ffc94d"/>
      <rect x="28" y="8"  width="10" height="48" fill="#0ea5a4"/>
      <rect x="42" y="24" width="10" height="32" fill="#a78bfa"/>
    </g>
    <!-- small pie -->
    <g transform="translate(168,38)">
      <circle r="22" fill="#fff"/>
      <path d="M0 0 L0 -22 A22 22 0 0 1 19 11 Z" fill="#ff6a00"/>
      <path d="M0 0 L19 11 A22 22 0 0 1 -19 11 Z" fill="#ffc94d"/>
    </g>
    <!-- small bubble cluster -->
    <g transform="translate(228,38)" fill="#a78bfa">
      <circle cx="0"  cy="0"  r="14"/>
      <circle cx="22" cy="-8" r="8" fill="#0ea5a4"/>
      <circle cx="18" cy="14" r="6" fill="#ff6a00"/>
    </g>
  </g>
</svg>

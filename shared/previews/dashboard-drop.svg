<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A four-panel dashboard with bar, line, pie, and gauge mini-charts">
  <rect width="320" height="180" fill="#ffe2c2"/>
  <!-- dashboard frame -->
  <rect x="20" y="20" width="280" height="140" rx="10" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
  <!-- divider lines -->
  <line x1="160" y1="20" x2="160" y2="160" stroke="#0e0e10" stroke-width="2"/>
  <line x1="20" y1="90" x2="300" y2="90" stroke="#0e0e10" stroke-width="2"/>
  <!-- top-left: bar -->
  <g transform="translate(35,38)">
    <rect x="0"  y="32" width="12" height="20" fill="#ff6a00" stroke="#0e0e10" stroke-width="2"/>
    <rect x="20" y="14" width="12" height="38" fill="#ffc94d" stroke="#0e0e10" stroke-width="2"/>
    <rect x="40" y="22" width="12" height="30" fill="#0ea5a4" stroke="#0e0e10" stroke-width="2"/>
    <rect x="60" y="2"  width="12" height="50" fill="#a78bfa" stroke="#0e0e10" stroke-width="2"/>
    <rect x="80" y="26" width="12" height="26" fill="#2563eb" stroke="#0e0e10" stroke-width="2"/>
  </g>
  <!-- top-right: line -->
  <g transform="translate(175,40)" fill="none" stroke="#0e0e10" stroke-width="2">
    <polyline points="0,40 25,28 50,34 75,12 100,22 115,4" stroke="#ff6a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ff6a00" stroke="#0e0e10">
      <circle cx="0"   cy="40" r="3"/>
      <circle cx="25"  cy="28" r="3"/>
      <circle cx="50"  cy="34" r="3"/>
      <circle cx="75"  cy="12" r="3"/>
      <circle cx="100" cy="22" r="3"/>
      <circle cx="115" cy="4"  r="3"/>
    </g>
  </g>
  <!-- bottom-left: pie -->
  <g transform="translate(90,125)">
    <circle r="25" fill="#fff" stroke="#0e0e10" stroke-width="2.5"/>
    <path d="M0 0 L0 -25 A25 25 0 0 1 21.65 12.5 Z" fill="#ff6a00" stroke="#0e0e10" stroke-width="2.5"/>
    <path d="M0 0 L21.65 12.5 A25 25 0 0 1 -21.65 12.5 Z" fill="#ffc94d" stroke="#0e0e10" stroke-width="2.5"/>
  </g>
  <!-- bottom-right: gauge -->
  <g transform="translate(230,138)">
    <path d="M-30 0 A30 30 0 0 1 30 0" fill="none" stroke="#0e0e10" stroke-width="2.5"/>
    <path d="M-30 0 A30 30 0 0 1 -10 -28" fill="none" stroke="#ff6a00" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="-22" stroke="#0e0e10" stroke-width="3" stroke-linecap="round"/>
    <circle r="4" fill="#0e0e10"/>
  </g>
  <!-- falling chart (cue to game mechanic) -->
  <g transform="translate(260,12) rotate(15)">
    <rect width="32" height="18" fill="#ffc94d" stroke="#0e0e10" stroke-width="2"/>
    <line x1="4" y1="14" x2="8"  y2="6"  stroke="#0e0e10" stroke-width="2"/>
    <line x1="12" y1="14" x2="16" y2="9" stroke="#0e0e10" stroke-width="2"/>
    <line x1="20" y1="14" x2="24" y2="4" stroke="#0e0e10" stroke-width="2"/>
  </g>
</svg>

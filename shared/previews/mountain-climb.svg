<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Bug-Bug climbing a line chart to a golden trophy">
  <defs>
    <linearGradient id="mc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe0b3"/>
      <stop offset="1" stop-color="#ffb060"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#mc-sky)"/>
  <!-- distant range -->
  <path d="M0 130 L60 90 L110 115 L170 75 L230 105 L290 70 L320 95 L320 180 L0 180Z" fill="#d75200" opacity=".25"/>
  <!-- main mountain -->
  <path d="M0 150 L70 95 L130 130 L195 60 L260 110 L320 75 L320 180 L0 180Z" fill="#0e0e10"/>
  <!-- line chart over peaks -->
  <polyline points="20,150 70,95 130,130 195,60 260,110 300,80" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data points -->
  <g fill="#ff6a00" stroke="#0e0e10" stroke-width="2">
    <circle cx="20" cy="150" r="5"/>
    <circle cx="70" cy="95" r="5"/>
    <circle cx="130" cy="130" r="5"/>
    <circle cx="195" cy="60" r="5"/>
    <circle cx="260" cy="110" r="5"/>
    <circle cx="300" cy="80" r="5"/>
  </g>
  <!-- trophy at summit -->
  <g transform="translate(189,32)">
    <rect x="-3" y="14" width="18" height="4" fill="#0e0e10"/>
    <rect x="0" y="10" width="12" height="6" fill="#ffc94d" stroke="#0e0e10" stroke-width="2"/>
    <path d="M0 10 Q-6 4 -2 -2 L2 -2 Z" fill="#ffc94d" stroke="#0e0e10" stroke-width="2"/>
    <path d="M12 10 Q18 4 14 -2 L10 -2 Z" fill="#ffc94d" stroke="#0e0e10" stroke-width="2"/>
    <rect x="-2" y="-4" width="16" height="8" rx="2" fill="#ffc94d" stroke="#0e0e10" stroke-width="2"/>
  </g>
  <!-- Bug-Bug climbing -->
  <g transform="translate(118,118)">
    <circle r="9" fill="#ff6a00" stroke="#0e0e10" stroke-width="2"/>
    <circle cx="-3" cy="-2" r="1.5" fill="#0e0e10"/>
    <circle cx="3" cy="-2" r="1.5" fill="#0e0e10"/>
    <path d="M-4 3 Q0 6 4 3" stroke="#0e0e10" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>

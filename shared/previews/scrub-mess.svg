<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A trash can swallowing messy data rows; clean rows remain behind">
  <rect width="320" height="180" fill="#ece6ff"/>
  <!-- clean data rows on left -->
  <g stroke="#0e0e10" stroke-width="2">
    <rect x="20"  y="40"  width="120" height="14" fill="#fff"/>
    <rect x="20"  y="58"  width="120" height="14" fill="#fff"/>
    <rect x="20"  y="76"  width="120" height="14" fill="#fff"/>
    <rect x="20"  y="94"  width="120" height="14" fill="#fff"/>
    <rect x="20"  y="112" width="120" height="14" fill="#fff"/>
    <line x1="60" y1="40" x2="60" y2="126" stroke="#0e0e10" stroke-width="1"/>
    <line x1="100" y1="40" x2="100" y2="126" stroke="#0e0e10" stroke-width="1"/>
  </g>
  <!-- little ticks in clean rows -->
  <g fill="#0ea5a4" font-family="ui-rounded, system-ui" font-weight="900" font-size="11">
    <text x="28" y="51">✓</text><text x="28" y="69">✓</text><text x="28" y="87">✓</text>
    <text x="28" y="105">✓</text><text x="28" y="123">✓</text>
  </g>
  <!-- messy junk flying toward bin -->
  <g font-family="ui-rounded, system-ui" font-weight="900" font-size="14" fill="#0e0e10">
    <text x="155" y="58" transform="rotate(-12 155 58)">??</text>
    <text x="170" y="80" transform="rotate(8 170 80)">N/A</text>
    <text x="160" y="100" transform="rotate(-6 160 100)">###</text>
    <text x="180" y="120" transform="rotate(14 180 120)">$$$</text>
  </g>
  <!-- trash bin -->
  <g transform="translate(245,55)" stroke="#0e0e10" stroke-width="3" stroke-linejoin="round">
    <rect x="-6" y="-12" width="60" height="10" fill="#ff6a00"/>
    <rect x="-2" y="-2" width="52" height="78" fill="#ffc94d"/>
    <line x1="12" y1="6" x2="12" y2="68"/>
    <line x1="24" y1="6" x2="24" y2="68"/>
    <line x1="36" y1="6" x2="36" y2="68"/>
    <!-- lid handle -->
    <rect x="18" y="-20" width="14" height="6" rx="2" fill="#0e0e10"/>
  </g>
</svg>

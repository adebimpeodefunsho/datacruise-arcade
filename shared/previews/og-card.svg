<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="DataCruise Arcade — 11 games that teach data, by feel">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd07a"/>
      <stop offset="1" stop-color="#ff9040"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <!-- logo dot + title -->
  <g transform="translate(80,100)">
    <circle cx="20" cy="20" r="20" fill="#ff6a00" stroke="#0e0e10" stroke-width="4"/>
    <text x="58" y="32" font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif" font-weight="900" font-size="32" fill="#0e0e10">DataCruise <tspan fill="#b34000">Arcade</tspan></text>
  </g>
  <!-- big headline -->
  <text x="80" y="270" font-family="ui-rounded, system-ui" font-weight="900" font-size="88" fill="#0e0e10">11 little games.</text>
  <g transform="translate(80,330)">
    <rect width="700" height="92" rx="10" fill="#ffc94d" stroke="#0e0e10" stroke-width="5"/>
    <text x="20" y="68" font-family="ui-rounded, system-ui" font-weight="900" font-size="70" fill="#0e0e10">A whole lot of data sense.</text>
  </g>
  <!-- subtitle -->
  <text x="80" y="490" font-family="ui-rounded, system-ui" font-weight="700" font-size="28" fill="#3a3a40">Build charts by feel. Crack puzzles built from data jargon.</text>
  <text x="80" y="528" font-family="ui-rounded, system-ui" font-weight="700" font-size="28" fill="#3a3a40">For kids, classrooms, and curious grown-ups.</text>
  <!-- pill -->
  <g transform="translate(80,562)">
    <rect width="220" height="50" rx="999" fill="#0e0e10"/>
    <text x="110" y="34" text-anchor="middle" font-family="ui-rounded, system-ui" font-weight="800" font-size="20" fill="#fff">10 GAMES · 2 SERIES</text>
  </g>
  <!-- right-side mini chart medley -->
  <g transform="translate(820,80)">
    <!-- card 1: mountain -->
    <g>
      <rect x="0" y="0" width="160" height="120" rx="10" fill="#fff" stroke="#0e0e10" stroke-width="4"/>
      <path d="M0 100 L40 60 L80 80 L120 30 L160 60 L160 120 L0 120 Z" fill="#0e0e10"/>
      <polyline points="10,100 40,60 80,80 120,30 150,60" fill="none" stroke="#fff" stroke-width="3"/>
      <g fill="#ff6a00" stroke="#0e0e10" stroke-width="2">
        <circle cx="10" cy="100" r="4"/><circle cx="40" cy="60" r="4"/><circle cx="80" cy="80" r="4"/><circle cx="120" cy="30" r="4"/><circle cx="150" cy="60" r="4"/>
      </g>
    </g>
    <!-- card 2: bars -->
    <g transform="translate(180,40)">
      <rect width="160" height="120" rx="10" fill="#fff" stroke="#0e0e10" stroke-width="4"/>
      <rect x="20"  y="80" width="20" height="30" fill="#ff6a00" stroke="#0e0e10" stroke-width="3"/>
      <rect x="50"  y="40" width="20" height="70" fill="#ffc94d" stroke="#0e0e10" stroke-width="3"/>
      <rect x="80"  y="60" width="20" height="50" fill="#0ea5a4" stroke="#0e0e10" stroke-width="3"/>
      <rect x="110" y="20" width="20" height="90" fill="#a78bfa" stroke="#0e0e10" stroke-width="3"/>
    </g>
    <!-- card 3: pie -->
    <g transform="translate(40,180)">
      <rect width="160" height="120" rx="10" fill="#fff" stroke="#0e0e10" stroke-width="4"/>
      <g transform="translate(80,60)">
        <circle r="40" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
        <path d="M0 0 L0 -40 A40 40 0 0 1 34.6 20 Z" fill="#ff6a00" stroke="#0e0e10" stroke-width="3"/>
        <path d="M0 0 L34.6 20 A40 40 0 0 1 -34.6 20 Z" fill="#ffc94d" stroke="#0e0e10" stroke-width="3"/>
      </g>
    </g>
    <!-- card 4: word/magnifier -->
    <g transform="translate(220,220)">
      <rect width="160" height="120" rx="10" fill="#ece6ff" stroke="#0e0e10" stroke-width="4"/>
      <text x="20" y="60" font-family="ui-rounded, system-ui" font-weight="900" font-size="30" fill="#0e0e10">D</text>
      <circle cx="68" cy="50" r="11" fill="#ff6a00" stroke="#0e0e10" stroke-width="2"/>
      <text x="86" y="60" font-family="ui-rounded, system-ui" font-weight="900" font-size="30" fill="#0e0e10">+A</text>
      <g transform="translate(115,85)">
        <circle r="18" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
        <line x1="14" y1="14" x2="26" y2="26" stroke="#0e0e10" stroke-width="4"/>
      </g>
    </g>
  </g>
</svg>

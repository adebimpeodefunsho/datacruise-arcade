<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A small crossword grid spelling DATA with a timer">
  <rect width="320" height="180" fill="#ece6ff"/>
  <!-- crossword grid 5x5 -->
  <g stroke="#0e0e10" stroke-width="2.5">
    <!-- row 1 -->
    <rect x="80"  y="30" width="28" height="28" fill="#0e0e10"/>
    <rect x="108" y="30" width="28" height="28" fill="#fff"/>
    <rect x="136" y="30" width="28" height="28" fill="#0e0e10"/>
    <rect x="164" y="30" width="28" height="28" fill="#0e0e10"/>
    <rect x="192" y="30" width="28" height="28" fill="#0e0e10"/>
    <!-- row 2 -->
    <rect x="80"  y="58" width="28" height="28" fill="#0e0e10"/>
    <rect x="108" y="58" width="28" height="28" fill="#fff"/>
    <rect x="136" y="58" width="28" height="28" fill="#0e0e10"/>
    <rect x="164" y="58" width="28" height="28" fill="#fff"/>
    <rect x="192" y="58" width="28" height="28" fill="#0e0e10"/>
    <!-- row 3 (DATA across) -->
    <rect x="80"  y="86" width="28" height="28" fill="#fff"/>
    <rect x="108" y="86" width="28" height="28" fill="#fff"/>
    <rect x="136" y="86" width="28" height="28" fill="#fff"/>
    <rect x="164" y="86" width="28" height="28" fill="#fff"/>
    <rect x="192" y="86" width="28" height="28" fill="#0e0e10"/>
    <!-- row 4 -->
    <rect x="80"  y="114" width="28" height="28" fill="#0e0e10"/>
    <rect x="108" y="114" width="28" height="28" fill="#fff"/>
    <rect x="136" y="114" width="28" height="28" fill="#0e0e10"/>
    <rect x="164" y="114" width="28" height="28" fill="#fff"/>
    <rect x="192" y="114" width="28" height="28" fill="#0e0e10"/>
    <!-- row 5 -->
    <rect x="80"  y="142" width="28" height="28" fill="#0e0e10"/>
    <rect x="108" y="142" width="28" height="28" fill="#fff"/>
    <rect x="136" y="142" width="28" height="28" fill="#0e0e10"/>
    <rect x="164" y="142" width="28" height="28" fill="#fff"/>
    <rect x="192" y="142" width="28" height="28" fill="#0e0e10"/>
  </g>
  <!-- letters in row 3 -->
  <g font-family="ui-rounded, system-ui" font-weight="900" font-size="18" fill="#0e0e10" text-anchor="middle">
    <text x="94"  y="106">D</text>
    <text x="122" y="106">A</text>
    <text x="150" y="106">T</text>
    <text x="178" y="106">A</text>
  </g>
  <!-- tiny clue numbers -->
  <g font-family="ui-rounded, system-ui" font-weight="700" font-size="8" fill="#0e0e10">
    <text x="83" y="95">1</text>
    <text x="111" y="39">2</text>
    <text x="167" y="67">3</text>
  </g>
  <!-- timer -->
  <g transform="translate(258,75)">
    <circle r="28" fill="#fff" stroke="#0e0e10" stroke-width="3"/>
    <path d="M0 0 L0 -22 A22 22 0 0 1 19 11 Z" fill="#ff6a00"/>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#0e0e10" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14" y2="8" stroke="#0e0e10" stroke-width="3" stroke-linecap="round"/>
    <circle r="3" fill="#0e0e10"/>
  </g>
</svg>
